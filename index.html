<title>Hybrid Training</title>
<!-- v11.25 — HOME-SCREEN ICON. Two mistakes were made here; both are recorded because both
     are easy to repeat.

     1. THE REL VALUE WAS COMBINED. It read rel="apple-touch-icon icon" — one tag doing two
        jobs, to avoid embedding the same base64 payload twice. `apple-touch-icon` is a
        proprietary Apple relation and Safari matches it as an exact rel value; a
        space-separated multi-token rel is not reliably recognised. Clever de-duplication,
        broken icon. KEEP THESE TAGS SEPARATE AND SINGLE-VALUED.

     2. IT WAS A data: URI. iOS "Add to Home Screen" does not reliably accept a data: URI for
        apple-touch-icon — it reads the tag, fails to resolve an image, and falls back to the
        lettered tile. It is an external file now.

     THE HREF IS RELATIVE ON PURPOSE. GitHub Pages serves project sites from a subpath
     (user.github.io/REPO/), so "/apple-touch-icon.png" would 404 — only a bare relative path
     resolves in both a project site and a user site. Never make this absolute.

     This is the ONE permitted external file. It does not weaken the offline guarantee: the
     icon is fetched once, when the shortcut is created, and nothing at runtime touches it.
     The app still works with the network off. See README, hard constraints.

     The PNG is 180x180, true-colour (no palette, no alpha), composited onto --bg, because iOS
     renders PNG alpha as BLACK on the home screen rather than honouring it.

     iOS CACHES THE ICON AT ADD TIME. A redeploy will not refresh it — the shortcut has to be
     deleted and re-added. -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Hybrid">
<style>
:root{
  --bg:#0F1216; --panel:#161B21; --panel2:#1E252D; --line:#2A323C;
  --ink:#E8E4DA; --mut:#8A93A0; --dim:#5B6572;
  --t1:#E5484D; --t2:#E0A458; --t3:#5B6572;
  --z2:#4FA3A5; --good:#6BBF7B; --warn:#E0A458;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-bottom:40px}
.hdr{padding:calc(env(safe-area-inset-top) + 10px) 16px 6px}
.hdr .brand{font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;font-weight:700}
.hdr h1{margin:2px 0 0;font-size:26px;font-weight:800;letter-spacing:-.01em}
.hdr .sub{color:var(--mut);font-size:13px;margin-top:2px}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--mut)}
.chip.red{color:#fff;background:var(--t1);border-color:var(--t1)}
.chip.amber{color:#171308;background:var(--t2);border-color:var(--t2)}
.chip.teal{color:#06211f;background:var(--z2);border-color:var(--z2)}
.chip.ghost{color:var(--mut)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 12px;position:sticky;top:0;
  background:linear-gradient(var(--bg) 85%,transparent);z-index:50;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
  color:var(--mut);font-weight:700;font-size:13px;cursor:pointer;user-select:none}
.tab.on{background:var(--ink);color:#12161B;border-color:var(--ink)}
.view{display:none;padding:0 16px}
.view.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.spine{border-left:4px solid var(--t3)}
.card.spine.t1{border-left-color:var(--t1)}
.card.spine.t2{border-left-color:var(--t2)}
.card h3{margin:0 0 2px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .meta{color:var(--mut);font-size:12.5px;margin-bottom:8px}
.klabel{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800;margin:10px 0 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .nm{flex:1;font-size:14.5px}
.row .nm .sup{color:var(--dim);font-size:12px}
.row .rx{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.done .nm{color:var(--dim);text-decoration:line-through}
.win{width:62px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:6px 6px;font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
.ck{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel2);
  display:flex;align-items:center;justify-content:center;color:transparent;font-weight:900;flex:0 0 auto;cursor:pointer}
.ck.on{background:var(--good);border-color:var(--good);color:#0c1a10}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
  color:var(--mut);font-weight:800;font-size:15px;cursor:pointer}
.seg button.on{background:var(--ink);color:#12161B;border-color:var(--ink)}
.banner{border-radius:12px;padding:11px 13px;font-size:13.5px;margin-bottom:12px;border:1px solid}
.banner.red{background:rgba(229,72,77,.12);border-color:rgba(229,72,77,.5)}
.banner.amber{background:rgba(224,164,88,.12);border-color:rgba(224,164,88,.5)}
.banner.teal{background:rgba(79,163,165,.12);border-color:rgba(79,163,165,.5)}
.banner b{display:block;margin-bottom:2px}
.btn{display:inline-block;padding:10px 16px;border-radius:11px;background:var(--ink);color:#12161B;
  font-weight:800;font-size:14px;border:none;cursor:pointer}
.btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.red{background:var(--t1);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
input[type=number],input[type=date],select,input[type=text]{background:var(--panel2);border:1px solid var(--line);
  color:var(--ink);border-radius:10px;padding:9px 11px;font-size:15px;width:100%}
label.f{display:block;font-size:12px;color:var(--mut);font-weight:700;margin:10px 0 4px}
a{color:var(--z2);text-decoration:none;font-weight:600}
.vlink{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:10px}
.vlink:last-child{border-bottom:none}
.vlink.dedupe{opacity:.35;pointer-events:none}
.bar{height:14px;border-radius:7px;background:var(--panel2);position:relative;overflow:hidden;border:1px solid var(--line)}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--dim);opacity:.8}
.volrow{margin-bottom:11px}
.volrow .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.volrow .t .n{font-weight:700}
.volrow .t .s{color:var(--mut);font-variant-numeric:tabular-nums}
#tCard[data-flash]{animation:flashPulse .6s ease-out}
#tCard[data-flash="go"]{--fl:#3a7}
#tCard[data-flash="stop"]{--fl:#c93}
#tCard[data-flash="section"]{--fl:#49f}

.timerBig{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:6px 0}
.timerMove{text-align:center;font-size:20px;font-weight:800;min-height:28px}
.timerNext{text-align:center;color:var(--mut);font-size:13px;min-height:18px}
.timerPhase{text-align:center}
.tprog{height:6px;background:var(--panel2);border-radius:3px;margin:14px 0;overflow:hidden}
.tprog .f{height:100%;background:var(--z2)}
.trow{display:flex;gap:10px;justify-content:center;margin-top:14px}
details{margin-bottom:10px}
details summary{cursor:pointer;font-weight:800;padding:10px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}

.mini{font-size:12.5px;color:var(--mut)}
.tinylist{font-size:13px;color:var(--mut);padding-left:16px;margin:4px 0}
.spark{width:100%;height:44px}
.assume li{margin-bottom:6px;font-size:13.5px}
.tiertag{font-size:10px;font-weight:900;letter-spacing:.08em;padding:1px 6px;border-radius:5px}

.tiertag.T2{background:var(--t2);color:#171308}

.hr{height:1px;background:var(--line);margin:12px 0}
.wksel{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}

.wksel button.on{background:var(--ink);color:#12161B}
.daysel{display:flex;gap:6px;margin-bottom:10px}
.daysel button{flex:1;padding:8px 0;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);font-weight:800;font-size:12px;cursor:pointer}
.daysel button.on{background:var(--ink);color:#12161B}
/* v11.32 — compact mode, collapsed done-cards, per-card "why" */
body.compact .why{display:none!important}
body.compact .card.showwhy div.why,body.compact .card.showwhy .banner.why{display:block!important}
body.compact .card.showwhy span.why,body.compact .card.showwhy i.why{display:inline!important}
.cardbtn{margin-left:auto;padding:3px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);font-size:11px;font-weight:700;cursor:pointer}
.whybtn{display:none}
body.compact .whybtn{display:inline-block}
.card.collapsed{padding:9px 14px;opacity:.6}
.card.collapsed>*:not(h3){display:none!important}
.card.collapsed h3{margin:0;font-size:14.5px}
.hdrbtn{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 14px)}
.hdr{position:relative}
/* v11.34 — larger tap targets on the logging controls (item 17), RPE row, thumbnails, note box, summaries,
   the corrections box that must look different from the add form, the week strip. */
.ck{width:36px;height:36px;border-radius:10px;font-size:18px}
.win{min-height:38px}
.win.wu{width:46px}
.seg button{min-height:40px}
.btn.sm{min-height:36px}
input[type=date]{min-height:42px}
.rpe{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:6px 0 2px}
.rpe button{min-width:30px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);font-weight:800;font-size:12px;cursor:pointer;padding:0 6px}
.rpe button.on{background:var(--t2);color:#171308;border-color:var(--t2)}
.rpe .mini{margin-right:4px}
img.thumb{width:160px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--panel2);display:block}
img.thumb.big{margin:6px auto 4px;width:min(100%,320px)}
textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 11px;font-size:15px;font-family:inherit;line-height:1.4;resize:vertical}
.sumblock{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:6px}
.sumblock .row{padding:4px 0}
.corrbox{border:1px dashed var(--warn);border-radius:12px;padding:8px 10px;background:rgba(224,164,88,.06)}
.addform{border:1px solid var(--z2)}
.wstrip{display:flex;gap:4px}
.wday{flex:1;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 2px;cursor:pointer}
.wday.cur{border-color:var(--ink)}
.wday .d{font-size:11px;color:var(--dim);font-weight:800;letter-spacing:.08em}
.wday .n{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
</style>

<div class="hdr">
  <div class="brand">Hybrid Training</div>
  <h1 id="hdrTitle">Today</h1>

<script>
/* ================= DATA ================= */
const DOB=new Date(1985,4,16), HT_CM=175.3, SEX="M";
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
/* ================= v10: ON-RAMP + BLOCK START ================= */
const BUILD="v11.34 · 2026-09-20";
/* v11.22 — THE START DATE IS NOW STATE, NOT A CONSTANT.
   Sixth start date (Jul 28 · Aug 3 · Aug 10 · Aug 17 · Aug 24), moved for an episodic
   lumbar recurrence. The point of this change is that there must never be a seventh
   edit to a constant: `Z.start` is the single source of truth and the Log tab moves it.

   PROGRAM_START_DEFAULT is a SEED ONLY. It is read exactly once, when `Z.start` is
   absent. Nothing else in this file may read it. Every other date comparison goes
   through progStart(). If you are adding a date comparison, call progStart().

   What was broken before this version, and why it looked like it worked:
     1. `Z.start` existed and had an input on the Log tab, but line ~1298 read
        `if(Z.start!==PROGRAM_START&&!Z.startPinned)Z.start=PROGRAM_START;` and
        `Z.startPinned` was NEVER SET ANYWHERE. Every edit silently reverted on reload.
     2. Even when it held, `Z.start` fed only curWeek() and the Log-tab compliance
        count. Fifteen other comparisons read the constant. Two start dates that
        disagreed — benchTodayCard() called curWeek() while the card rendered beside it
        on Today read the constant. */
const PROGRAM_START_DEFAULT="2026-09-14";   /* Monday. SEED ONLY — see progStart(). v11.32: block start per STATE.md, set 2026-09-09. */
const ONRAMP_START="2026-08-11";            /* Tuesday. First on-ramp. HISTORICAL — see inOnramp(). */
/* The block start, from state. Hoisted so the functions above may call it; Z is only
   dereferenced at call time, always after Z is initialised. */
function progStart(){return (typeof Z!=="undefined"&&Z&&Z.start)||PROGRAM_START_DEFAULT;}
/* True for dates after the on-ramp finished but before the block opens. Before v11.22
   no branch owned this state, because the on-ramp was defined as "everything between
   ONRAMP_START and the block" and the two were assumed adjacent.

   v11.25 — rewritten because the old form read the LAST element of the array. With a second
   on-ramp appended, `ONRAMP[ONRAMP.length-1].d` became 2026-08-30, so Aug 24 (after on-ramp 1,
   before on-ramp 2) was no longer > that date, failed the gap test, fell through to the block
   branch and rendered Week 1 six days early with curWeek() clamped to 0. That is the v11.22
   bug wearing a different hat: a state defined by a RANGE between two moving endpoints.

   Defined by exclusion now: a date is a gap day if it is inside the programme's span and no
   other branch owns it. Adding a third on-ramp cannot break this. */
function inGap(iso){return !inOnramp(iso)&&iso>ONRAMP[0].d&&iso<progStart();}
/* ============ RE-ENTRY ON-RAMP, Aug 11-16. Rewritten 2026-08-10. ============
   Six days of real training before the block opens Mon Aug 17. Not a taper, not a
   rehearsal, and no habit-coaching — he asked for training and this is training.

   TWO JOBS, in priority order.

   1. GET BACK ON THE BIKE. This is the domain furthest from baseline. Whoop shows one ride
      in the last eight weeks (Aug 4, 45 min) against a spring pattern of 65-95 min rides,
      and the handoff already records him at the bottom of his FTP post-layoff. Three Z2
      rides here, ~2.5 h total, is a real re-entry dose off a near-zero base without
      spiking it. Z2 is also the lowest-interference modality against lower-body strength —
      concurrent-training interference comes overwhelmingly from high-intensity and from
      high-eccentric running, not from steady-state cycling. So the aerobic work can be
      genuine without costing Monday anything.

   2. LIFT THE THREE MAINS ONCE EACH, FOR REAL, SEQUENCED BACKWARD OFF WEEK 1.
      DKEY puts D1 box squat on Mon, D2 bench on Wed, D3 trap bar on Thu. So:
        box squat Tue 11 -> D1 Mon 17   (6 days)
        bench     Thu 13 -> D2 Wed 19   (6 days)
        trap bar  Sat 15 -> D3 Thu 20   (5 days)
      Each lift gets most of a week before its block counterpart. Nothing is stacked
      against itself.

   INTENSITY: top triple at RIR 4, one notch under week 1's RIR 3, then two back-off
   triples about 5% lighter. That is genuinely working - 240x3 on the box squat is a real
   set - while leaving the week-1 numbers untouched for Monday. It also gives the block a
   clean opening progression: RIR 4 here, RIR 3 in week 1.

   WHAT IS DELIBERATELY ABSENT.
   - No testing. The Aug 6-8 window banked all of it.
   - No hard-aerobic target. Friday's class will produce whatever it produces; programming
     intervals on a detrained aerobic system four days before a 12-week block is the wrong
     trade. Base first. A PZ Max on Wednesday is offered, not prescribed.
   - No velocity or plyometric work. That is gated on readiness inside the block and has no
     business in a re-entry week.
   - No makeup work. His boundary, 2026-08-10: "I don't want to try to cram it in. I don't
     want to feed my instinct to make things up." Every day still has a floor, and nothing
     in this week can be failed.

   Kickboxing Friday 6:30 and BJJ Sunday are untouched - they are the two sessions his own
   log says he reliably keeps, and the week is built around them rather than over them. */
const ONRAMP=[
 {d:"2026-08-11",b:1,t:"Tue · box squat + first ride back",floor:"The top triple. Fifteen minutes if that is all there is.",items:[
  ["Warm-up \u2014 GMB tissue prep + hooklying 3 \u00d7 10","Eight minutes. Hooklying is never scored against you."],
  ["Box squat \u2014 top triple @ RIR 4 \u00b7 ~240 lb","Belt on \u2014 the reason this lift is at home. Real work, one notch under Monday's 250 at RIR 3. Stop at 4 in reserve even if it is moving well; the block starts in six days."],
  ["Box squat \u2014 2 \u00d7 3 back-off @ ~230 lb","Same bar speed, less load. This is the pattern the whole block is built on."],
  ["Zone 2 ride \u2014 45 min, PZ Endurance","117\u2013137 bpm. First real ride in eight weeks. Ride it easy enough that it is boring \u2014 if you are pushing, it is not Zone 2."],
  ["Markow Wk1 D1 pattern","Pelvic Magic Zero + Split Squat Isometric."]]},
 {d:"2026-08-12",b:1,t:"Wed · the long ride",floor:"Any ride at all, even 20 minutes.",items:[
  ["Zone 2 ride \u2014 60 min, PZ Endurance","The week's aerobic centrepiece. Your own data says a ride cannot balloon: 0 of 39 rides ever overran their class by >15 min, while 32 of 82 lifts ran past 90."],
  ["Optional \u2014 PZ Max instead, if legs feel good","Offered, not prescribed. Base is the priority this week and intervals on a detrained aerobic system four days out from the block is the wrong trade. If you take it, log the minutes above 160."],
  ["Markow Wk1 D2 pattern","Rolling for hip rotation + hip rotation CARs."],
  ["No lifting today","Deliberate. Tuesday's squat and Thursday's bench both need the room."]]},
 {d:"2026-08-13",b:1,t:"Thu · bench + upper",floor:"One working set of pressing.",items:[
  ["Warm-up \u2014 shoulders, cuff, band pull-aparts",""],
  ["Bench \u2014 top triple @ RIR 4 \u00b7 ~205 lb","Six days before D2 on Wed the 19th. Real, not maximal."],
  ["Bench \u2014 2 \u00d7 3 back-off @ ~195 lb",""],
  ["Dynamic-effort bench \u2014 6 \u00d7 3 @ 125 lb","50% of 251, 45 s rest. Bar speed is the whole point; the load is deliberately trivial. Here so it is familiar on Aug 19."],
  ["Rows + rear delts + cuff, 2\u20133 sets each","Rear delt is the standing structural hole. Cheap to keep, expensive to ignore."],
  ["Optional Zone 2 \u2014 30 min","Only if the press felt easy."]]},
 {d:"2026-08-14",b:1,t:"Fri · kickboxing, as normal",floor:"Attend class.",items:[
  ["Kickboxing 6:30","Untouched. Your most reliable session \u2014 68% of Fridays start before 9am, median 06:47."],
  ["Pre-class \u2014 ballistic leg swings, submaximal, 5 min","The correct and only use of the Luke Thomas ballistic material."],
  ["Morpheus strap ON","Second clean read on where kickboxing actually sits against 160 bpm. Log the DAY total, all blocks summed \u2014 Aug 7 was two blocks and scored separately that reads as two failures."],
  ["No lift today","No box squat or trap bar at the MMA gym \u2014 you would have to bring the belt."]]},
 {d:"2026-08-15",b:1,t:"Sat · trap bar + ride",floor:"The top triple.",items:[
  ["Warm-up \u2014 full lower, hooklying, ankle work",""],
  ["Trap bar \u2014 top triple @ RIR 4 \u00b7 ~270 lb","Lift BEFORE the ride so the bar is the clean signal. Five days before D3 on Thu the 20th."],
  ["Trap bar \u2014 2 \u00d7 3 back-off @ ~255 lb",""],
  ["Zone 2 ride \u2014 45 min","Third ride of the week, ~2.5 h of Z2 total. That is a real re-entry dose off a near-zero base."],
  ["Booty Sprout, 2 sets","Log band config and reps."],
  ["Markow Wk1 D3 pattern","Pelvic Magic Cross Connect."],
  ["Sprint \u2014 mechanics only","A-skips, wall drills, acceleration posture. No build-ups, no strides, no timed runs \u2014 velocity work is readiness-gated inside the block and does not belong here."]]},
 {d:"2026-08-16",b:1,t:"Sun · BJJ + close the week out",floor:"Read Monday. Even if you train nothing else, the week succeeded.",items:[
  ["BJJ as normal, 13:41","Your most reliable day \u2014 87% of Sundays produce training. Sleeve, not the chest strap; it will not survive grappling."],

        one set (core, plyos, throws, carries); 2-set rows stay. Down-week outranks it (down-week already
        cuts core to two easy sets and skips plyos), so the two never stack.
     3. Side plank 2×30 s/side on MONDAY — report: single most efficient lateral exercise (QL 54% MVC
        intramuscular, TrA ratio 1.95, Tier-1 glute-med force). Credited to the gmed bucket at 0.5/set
        (1 set/wk) when Monday core is ticked — INFERENCE, the app's usual fraction.
     4. Eccentric cue on roll-outs and hanging knee/leg raises: controlled ~3 s lowering (report Part 4). */
const SIDE_PLANK="Side Plank — 2×30s/side (toes; QL + glute med, Tier-1)";
const SIDE_PLANK_GMED=0.5;   /* [INF] credit per set to the glute-med bucket */
const BIRDDOG={n:"Bird-dog — 2×6/side, 5 s hold",cue:"Hold a slight arch (postural lordosis) — the report's cue that raises deep multifidus without waking the long erectors. Reach long through heel and fingertips; nothing moves but the limbs."};
/* Trim one set from any row that prescribes 3 or more. "3×8" -> "2×8", "4×15" -> "3×15", "2×20s" untouched. */
function trimRow(t){return t.replace(/(\d+)(×)(?=\d)/g,(m,n,x)=>Number(n)>=3?String(Number(n)-1)+x:m);}   /* every "N×" in the row, so multi-item plyo rows trim each item */
function coreTrimOn(w,dISO){return isDeloadWeek(w)&&!isDown()&&((readyEff(dISO)||5)>2);}
function coreItems(k,w,dISO){
  const p=corePhase(w);let items=CORE[k].ph[p].slice();
  if(k==="mon")items.push(SIDE_PLANK);
  items=items.map(t=>/Roll-out|Hanging/.test(t)?t+" · lower ~3 s":t);
  if(coreTrimOn(w,dISO))items=items.map(t=>{const u=trimRow(t);return u!==t?u+" · wk-6 trim":t;});
  return items;
}
/* Sets removed from CORE by the week-6 trim, across the week's core days — so the Volume tab reflects it. */
function coreTrimSets(w){
  if(!isDeloadWeek(w))return 0;const p=corePhase(w);let n=0;
  Object.keys(CORE).forEach(k=>{const rows=CORE[k].ph[p].concat(k==="mon"?[SIDE_PLANK]:[]);
    rows.forEach(t=>{[...t.matchAll(/(\d+)×(?=\d)/g)].forEach(m=>{if(Number(m[1])>=3)n++;});});});
  return n;
}

/* ============ v11.32: WARM-UP RAMP for the three main lifts ============
   Robert, 2026-09-15: log the warm-up sets, or be given recommended ones, so a screenshot of
   the card is a complete session record for Whoop's screenshot-based strength logging.
   The ramp is a generic five-step climb to the top set (empty bar, 50 / 65 / 75 / 85 % of
   the TOP-SET load — not of e1RM), rounded to 5 lb. BEST-PRACTICE GUIDANCE, not from a named
   source: it is the shape a powerlifting warm-up takes and nothing in Biolayne prescribes one.
   Each row is loggable; "Log as suggested" writes all five in one tap. Warm-up sets are NOT
   counted anywhere — not in volume, not as exposures, not in e1RM. */
/* v11.34 — EDITABLE, AND DEFAULTS TO HIS OWN LAST RAMP. Every row carries sets, reps and weight
   (Z.lifts[d][ex+"_wu"+i] = {w,reps,sets}; old {w,reps} records read as one set). The default
   suggestion is his LAST LOGGED RAMP FOR THAT LIFT, scaled to today's top set — the week-1 export
   showed his ramps climb to 93–98% of the top set (box squat 18·54·82·90·98%, bench 21·66·88·93·98%,
   trap bar 30·54·72·86·93%), so any generic table undershoots him; and his trap-bar first row is 85 lb,
   not the bare bar, so the bar row is a default, not a rule. The table below is only the no-history
   fallback. Evidence, full text (Ribeiro et al. 2020, PMID 32971729): in trained men a specific warm-up
   ending near the working load (80% of the training load; progressive 40%→80% for bench) produced
   better force outputs than a low-load-only warm-up — it supports FINISHING NEAR THE WORK, not this
   particular five-step spacing, which is best-practice shape and NOT from a named source. Never Norton's. */
const WARMUP=[["Bar",null,8],["50%",0.50,5],["70%",0.70,3],["80%",0.80,2],["90%",0.90,1]];
const BAR_LB={bsq_top:45,bp_top:45,tb_top:65};   /* v11.34: trap bar 65 lb, stated by Robert 2026-09-16 (was an assumed 60) */
const EZ_BAR_LB=35;                               /* v11.34: EZ bar 35 lb, stated by Robert 2026-09-16 */
/* Most recent day before `beforeISO` on which this lift's warm-up rows were logged, with that day's top-set load. */
function lastRamp(exKey,beforeISO){
  const ks=Object.keys(Z.lifts).sort().filter(k=>k<beforeISO);
  for(let i=ks.length-1;i>=0;i--){const L=Z.lifts[ks[i]];
    const rows=WARMUP.map((_,j)=>L[exKey+"_wu"+j]).map(r=>r&&r.w?{w:Number(r.w),reps:r.reps!=null?Number(r.reps):null,sets:r.sets!=null?Number(r.sets):1}:null);
    if(rows.some(Boolean))return {date:ks[i],rows,top:(L[exKey]&&Number(L[exKey].w))||null};}
  return null;
}
function warmupRamp(exKey,topLb,beforeISO){
  const last=beforeISO?lastRamp(exKey,beforeISO):null;
  const ratio=(last&&last.top&&topLb)?topLb/last.top:1;
  return WARMUP.map(([lab,f,reps],i)=>{
    const bar=BAR_LB[exKey]||45;
    const tbl={lb:f==null?bar:(topLb?Math.round(topLb*f/5)*5:null),reps,sets:1,src:"table"};
    const lr=last&&last.rows[i];
    if(!lr)return {lab,i,...tbl};
    const lb=i===0?Math.max(bar,Math.round(lr.w*ratio/5)*5):Math.round(lr.w*ratio/5)*5;
    return {lab,i,lb,reps:lr.reps!=null?lr.reps:reps,sets:lr.sets||1,src:"last",from:last.date,scaled:ratio!==1};
  });
}
function setWu(dISO,exKey,i,field,val){Z.lifts[dISO]=Z.lifts[dISO]||{};const k=exKey+"_wu"+i;Z.lifts[dISO][k]=Z.lifts[dISO][k]||{};
  const v=(val===""||val==null)?null:Number(val);if(v==null)delete Z.lifts[dISO][k][field];else Z.lifts[dISO][k][field]=v;
  if(Z.lifts[dISO][k].w==null&&Z.lifts[dISO][k].reps==null&&Z.lifts[dISO][k].sets==null)delete Z.lifts[dISO][k];save();render();}
function logWarmups(dISO,exKey,topLb){const r=warmupRamp(exKey,topLb,dISO);Z.lifts[dISO]=Z.lifts[dISO]||{};
  r.forEach(x=>{if(x.lb!=null)Z.lifts[dISO][exKey+"_wu"+x.i]={w:x.lb,reps:x.reps,sets:x.sets||1};});save();render();}

   still guessing by RPE. Answer through v11.1 was: still guessing. Now it suggests.

     %1RM = 1 / (1 + (reps + RIR)/30)

   8 @ RIR 2 -> 75.0% vs 74.0%; 12 @ RIR 3 -> 66.7% vs 65.0%. Close enough to open a set on.

const MAINLIFT={bsq_top:"boxsq",bsq_bo:"boxsq",bp_top:"bench",bp_bo:"bench",tb_top:"trap",tb_bo:"trap"};

/* Rolling e1RM. Every logged top set is itself an e1RM estimate:

/* ================= v11.23: LAYOFF DECAY =================

   in eccentric torque and high-velocity measures. Same basis as RX_GRACE. EVIDENCE.

   lifters at two months off. Chosen deliberately on the conservative side because the
   errors are asymmetric: under-prescribing costs one easy session that self-corrects the
   same day, over-prescribing at 84% onto a deconditioned back costs a re-injury.

   DECAY_FLOOR — 15%. Past roughly twelve weeks out the number is fiction and should stop
   implying precision.

   WHY IT IS NOT SELF-TUNING. He asked whether the rate should be learned from his own
   layoff/return pairs. It should not, and the reason is a bias, not a shortage of data:
   a return session is deliberately conservative and may be pain-inhibited, so the logged
   set understates true strength and the model would read that as decay. A 250 lb capacity
   ridden at 235 for safety reads as −6% loss when the true loss is zero. With 0–2 pairs
   per block, a known directional bias, and the estimate feeding the prescription that
   generates the next observation, a self-tuning rate would drift invisibly. Instead the
   pairs are RECORDED and DISPLAYED (Z.layoffObs, Test tab) so the rate can be recalibrated
   deliberately, under his eye. Same discipline as Z.aeroZ5: observe, display, gate nothing.

   SELF-CORRECTING. workingE1 takes the max, so the first logged top set back overwrites
   the decayed figure upward immediately. An over-aggressive decay costs exactly one
   submaximal session — which is the whole reason erring conservative is cheap. */
const DECAY_GRACE=14, DECAY_RATE=0.015, DECAY_FLOOR=0.15;
/* Days since this lift's own clock last reset. PER-LIFT ON PURPOSE: a lumbar episode kills
   D1 and D3 while D2 bench keeps running, and bench preserves nothing about a trap bar.
   Confirmed by him 2026-08-23. Any completed strength session on that day-key resets that
   lift's clock, logged load or not — the ledger should hold, not punish, and he should
   never be decayed for training without logging. */
function lastLiftDay(dkey,base,dISO){
  let last=(Z.base||{}).date||null;

     ignored, so backdated days before the block still read the observation clock. */
  const anc=decayAnchor();

    if(k>dISO)return;

    if(k>dISO)return;

function decayFactor(dkey,base,dISO){

const TOPKEY={boxsq:"bsq_top",bench:"bp_top",trap:"tb_top"};
const ISO_RE=/^\d{4}-\d{2}-\d{2}$/;
function workingE1(base,dISO){

     figure rather than below it — so after any long layoff the app kept prescribing off
     a number that could be months old and had never been re-earned.

     WAVE (he returns to week 3's RIR scheme, not week 7's); it never touches the

    if(!wt)return;
    const d=new Date(k+"T00:00:00"), wk=Math.floor((d-new Date(progStart()+"T00:00:00"))/6048e5);
    const dk={boxsq:"d1",bench:"d2",trap:"d3"}[base];

   top set below 80%, executing it correctly would have been scored as a miss.
   Empirically it never does — all 36 prescribed top sets across 12 weeks come out 81-88% —
   but the rule should not depend on that luck.

   A session is a heavy exposure if EITHER:
     (a) it reached >=80% of the working e1RM (the MED threshold), OR

function exposureClass(dISO,dkey){
  const b={d1:"boxsq",d2:"bench",d3:"trap"}[dkey];

  const W=workingE1(b,dISO); if(!W)return "unlogged";

/* ============ v11.1: EXPOSURE LEDGER ============
   Robert's objection, 2026-08-03, and it was correct: grading the week does not
   stop the LOAD running ahead. RX[] was indexed purely on calendar week, so week 8
   prescribed week-8 loads whether or not weeks 5-7 happened.

   The resolution is that these are two different clocks and conflating them was
   the bug:
     THE CALENDAR is calendar-driven — week 8 arrives on week 8, nothing repeats,
     nothing is owed. That protects him from the felt-failure spiral.
     THE LOAD is exposure-driven — the weight on the bar reflects how many heavy
     exposures that lift has actually had.
   Grace of 1 week because 1-2 weeks off produces no measurable 1RM loss
   (Hortobagyi 1993) — the ledger should hold, not punish. */
const RX_GRACE=1;
function liftExposures(dkey,dISO){
  let n=0;const start=new Date(progStart()+"T00:00:00"),end=new Date(dISO+"T00:00:00");
  for(let d=new Date(start);d<end;d.setDate(d.getDate()+1)){
    const k=iso(d);
    if(DKEY[dayIdx(d)]!==dkey)continue;
    if((Z.done[k]||{}).str)n++;
  }
  return n;
}
/* Returns the RX row this lift has EARNED, plus how far behind the calendar it is. */
function rxWeek(dkey,w,dISO){
  if(!dISO||dISO==="preview")return {i:w,lag:0,exp:w,cal:w};
  const exp=liftExposures(dkey,dISO);
  const i=Math.max(0,Math.min(w,exp+RX_GRACE));
  return {i,lag:w-i,exp,cal:w};
}

/* ---- Aerobic qualification. Absolute bpm, never Whoop zone labels — Whoop

/* ---- LAYER 3. The only layer that answers "am I getting the adaptation."

   stimulus but can never verify it, and no app purchase changes that.

const BENCH_WEEKS=[1,4,8,12];

/* ---- v11.20 — THE ZONE CEILING. Robert, 2026-08-14:

   (other than zone 7 with no ceiling) you can't get any further output."

   prescribes a zone, and every zone below 7 has an upper bound as a % of FTP. Riding
   harder means leaving the zone, i.e. not doing the class. So output is not free to rise
   no matter how fit he gets — it is PINNED BY THE PRESCRIPTION.

   That does not break the benchmark. It reclassifies it. This is a FIXED-WORKLOAD
   SUBMAXIMAL HR TEST: hold a known power, read the heart rate. Output is the CONTROL
   VARIABLE, not the signal. Lower HR at the same watts is the adaptation. That is a
   long-standing and legitimate method.

   if output really was constant. If output drifted, an HR difference is confounded and

/* ============ v11.34: CARDIO — sources in groups, instrument ON THE SESSION, Zone 2 as its own card ============
   SOURCES (Robert, 2026-09-16). Two groups plus Other. Existing keys keep their meaning and their label; the
   09-19 tennis record stays `hiit` ("Other HIIT") — NOTHING IS RE-TAGGED, ever. A Zone 2 source may not carry
   hard minutes: aeroAdd refuses it, because the per-modality rollup answers "which activity gets hard" and a
   Zone 2 tag on hard minutes would be a wrong answer stored on purpose.
   INSTRUMENT. Was stored per DAY only (Z.aeroSrc[date]) — the defect v11.28 fixed for `mode` and left
   half-done, and it is now visible in live data: 09-20 holds a BJJ on the H10 and an unidentified hiit
   under one day tag `whoop`, which read literally downgrades a measurement to a floor. The instrument
   now lives on the SESSION; the day tag remains the fallback for session-less days, exactly as
   aeroByMode() does for mode. The 09-20 record is NOT re-tagged and no migration guesses an instrument. */
const AERO_GROUP={hard:["kick","bjj","bag","pzmax","pz","pelhiit","bball","tennis","lift","hiit"],z2:["pzend","z2other"],other:["other"]};
const AERO_INST={heartgraph:"Heart Graph (H10)",whoop:"Whoop sleeve",wrist:"Whoop band (wrist)",other:"Other"};
function aeroGroupOf(mode){return AERO_GROUP.z2.indexOf(mode)>=0?"z2":(AERO_GROUP.hard.indexOf(mode)>=0?"hard":"other");}
/* Instrument for a session record: its own, else the day tag (fallback for pre-v11.34 records). */
function sessInst(r){return r.inst||((Z.aeroSrc||{})[r.date])||null;}
/* Zone 2 HR calibration (Robert's choice): sessions record average HR; once ≥Z2_MIN_RIDES rides exist on ONE
   instrument, the card shows his observed Zone 2 HR range for that instrument — median and IQR. Sleeve, wrist
   and strap averages are never mixed. */
const Z2_MIN_RIDES=4;
function z2Calib(){
  const by={};
  aeroLogAll().forEach(({r})=>{if(!(Number(r.z2)>0)||!(Number(r.hr)>0))return;const i=sessInst(r)||"unknown";(by[i]=by[i]||[]).push(Number(r.hr));});
  const out={};Object.keys(by).forEach(i=>{const a=by[i].slice().sort((x,y)=>x-y),n=a.length;
    out[i]={n,med:median(a),q1:n>=Z2_MIN_RIDES?a[Math.floor((n-1)*0.25)]:null,q3:n>=Z2_MIN_RIDES?a[Math.ceil((n-1)*0.75)]:null,ready:n>=Z2_MIN_RIDES};});
  return out;
}

/* ============ v11.34: SEATED CHEST-PASS TEST — the only objective read on the upper ballistic work ============
   Canonical protocol: database/logs/chest-pass-test.md. Seated, back on the wall, legs straight, 20 lb slam
   ball, thrown down the long axis of the basement, flat release, measured to FIRST CONTACT from the wall face.
   Three attempts, best of three, full recovery between; a short fixed warm-up recorded with the result.
   Ball identity and venue are part of the protocol (the gym's ball rolled on 2026-09-20; his does not). All
   three attempts are stored — the only way his own repeatability spread ever gets measured (precision is
   currently an arithmetic ±10% [INF]). Test weeks 1 / 7 / 12 (week 6 is the deload). Week 1 has no in-app
   record and never will (the 09-20 throw is a pilot), so "due" keys off the RECORD LIST, never the week
   number. Logged through obsDate(); never reads the cursor. Compared only against himself. */
const THROW_WEEKS=[1,7,12];
function throwList(){return (Z.throws||[]).filter(r=>r&&ISO_RE.test(r.date||"")).slice().sort((a,b)=>a.date<b.date?-1:1);}
function throwDue(w){if(THROW_WEEKS.indexOf(w+1)<0)return false;return !throwList().some(r=>calWeekOf(r.date)===w);}
function throwAdd(){
  const g=id=>{const e=document.getElementById(id);return e?String(e.value||"").trim():"";};
  const num=id=>{const v=g(id);return v===""?null:Number(v);};
  const obs=obsDate("thDate");if(!obs)return;
  const a=[num("thA1"),num("thA2"),num("thA3")].map(x=>(x!=null&&isFinite(x)&&x>0)?x:null);
  const best=Math.max(...a.filter(x=>x!=null),0)||null;
  if(!best){alert("Enter at least one attempt, in feet (decimals are fine: 12 ft 7 in = 12.6).");return;}
  const rec={date:obs,ball:g("thBall")||"own 20 lb slam ball",venue:g("thVenue")||"home basement",seat:g("thSeat")||"legs straight",wall:g("thWall")||"back on wall",shoes:g("thShoes"),spot:g("thSpot"),warm:g("thWarm"),a1:a[0],a2:a[1],a3:a[2],best,entered:todayISO()};
  Z.throws=Z.throws||[];Z.throws.push(rec);save();render();
}
function throwDel(i){const L=throwList();const r=L[i];if(!r)return;Z.throws=(Z.throws||[]).filter(x=>x!==r);save();render();}
function throwCard(w){
  const L=throwList(),last=L[L.length-1]||null,due=throwDue(w);
  const spread=r=>{const a=[r.a1,r.a2,r.a3].filter(x=>x!=null);return a.length>1?(Math.max(...a)-Math.min(...a)).toFixed(1):null;};
  let h=`<div class="card spine ${due?"t2":""}"><h3>Chest-pass distance${due?` <span class="tiertag T2">due</span>`:""}</h3>
  <div class="meta">Seated, back on the wall, 20 lb slam ball, flat release, <b>to first contact, from the wall face</b>. Three attempts, best of three, full rest between. Test weeks ${THROW_WEEKS.join(" / ")}${due?` — <b>week ${w+1} is one and nothing is logged for it yet</b>`:""}.</div>
  <div class="mini why" style="margin-bottom:6px"><b>What it is for.</b> The only objective read on whether the upper ballistic throws did anything; everything else added for them is logged effort. Three numbers across twelve weeks answer "was this worth the minutes". <b>What it measures:</b> how fast you apply force through the press pattern with the trunk braced — a throw releases the load, so nothing is lost to braking, which is the gap dynamic-effort bench cannot fill. A field proxy, compared only against yourself; no correlation figure is claimed. Precision with a flat release is on the order of ±10% (inference, arithmetic not observation) — read week 7 coarsely. If the ball rolls: tape every 12 in along the line, phone on the floor, read first contact off the video — <code>database/logs/chest-pass-test.md</code>.</div>`;
  if(last)h+=`<div class="banner teal"><b>Last setup — reproduce it exactly.</b> ${fmtD(last.date)} · ${last.ball} · ${last.venue} · ${last.seat} · ${last.wall}${last.shoes?` · ${last.shoes}`:""}${last.spot?` · spot: ${last.spot}`:""}${last.warm?` · warm-up: ${last.warm}`:""}</div>`;
  h+=`<div class="grid2">
   <div><label class="f">Date thrown</label>${obsDateInput("thDate",' style="width:100%"')}</div>
   <div><label class="f">Ball (identity, weight)</label><input id="thBall" type="text" value="${last?esc(last.ball):"own 20 lb slam ball"}"></div>
   <div><label class="f">Venue</label><input id="thVenue" type="text" value="${last?esc(last.venue):"home basement"}"></div>
   <div><label class="f">Seated position</label><input id="thSeat" type="text" value="${last?esc(last.seat):"legs straight"}"></div>
   <div><label class="f">Back on wall?</label><input id="thWall" type="text" value="${last?esc(last.wall):"back on wall"}"></div>
   <div><label class="f">Shoes</label><input id="thShoes" type="text" value="${last?esc(last.shoes||""):""}"></div>
   <div><label class="f">Spot</label><input id="thSpot" type="text" value="${last?esc(last.spot||""):""}" placeholder="where you sat"></div>
   <div><label class="f">Warm-up (fixed, short)</label><input id="thWarm" type="text" value="${last?esc(last.warm||""):""}" placeholder="e.g. 5 easy throws"></div>
   <div><label class="f">Attempt 1 (ft)</label><input id="thA1" type="number" inputmode="decimal" step="0.1"></div>
   <div><label class="f">Attempt 2 (ft)</label><input id="thA2" type="number" inputmode="decimal" step="0.1"></div>
   <div><label class="f">Attempt 3 (ft)</label><input id="thA3" type="number" inputmode="decimal" step="0.1"></div>
  </div>
  <div style="margin-top:8px"><button onclick="throwAdd()">Save test</button> <span class="mini">Best is computed. One attempt is enough to save; three is what the spread needs.</span></div>`;
  if(L.length){
    h+=`<div class="mini" style="margin:10px 0 4px"><b>Logged tests</b></div>`;
    L.forEach((r,i)=>{const sp=spread(r);
      h+=`<div class="row"><div class="nm">${fmtD(r.date)} · wk ${calWeekOf(r.date)!=null?calWeekOf(r.date)+1:"—"}<div class="sup">${r.ball} · ${r.venue}${r.a1!=null?` · ${[r.a1,r.a2,r.a3].filter(x=>x!=null).join(" / ")} ft`:""}${sp!=null?` · spread ${sp} ft`:""}</div></div><div class="rx"><b>${r.best}</b> ft</div><button onclick="throwDel(${i})" class="mini">×</button></div>`;});
    if(L.length>=2){const a=L[0],b=L[L.length-1];const d=b.best-a.best;const same=a.ball===b.ball&&a.venue===b.venue;
      h+=`<div class="mini" style="margin-top:6px">${fmtD(a.date)} → ${fmtD(b.date)}: <b>${d>0?"+":""}${d.toFixed(1)} ft</b> (${(d/a.best*100).toFixed(0)}%).${same?"":" <b>Ball or venue differ — not comparable.</b>"} Under about 10% is inside the test's own noise.</div>`;}
  } else h+=`<div class="mini" style="margin-top:8px">No test logged. The 2026-09-20 gym throw (12 ft 7 in, gym ball, rolled) is a pilot and is deliberately not entered.</div>`;
  return h+`</div>`;
}

/* ============ v11.34: WHOOP + ELITE HRV — two instruments, two jobs ============
   Whoop stays the gate (composite score, thresholds from his own 12-month distribution). Elite HRV (morning,
   before getting up, his own routine — no protocol checklist) is logged as its own series in its own units:
   a 0–100 score derived from ln(RMSSD), NOT milliseconds. Never averaged with Whoop, never on one axis.
   Elite does not overrule Whoop yet — decided 2026-09-18: at week 7 test which one tracks session RPE.
   Heart Graph morning resting HR (mean and range over 10 min; it reports no HRV) is the other optional field.
   RESTING HR (30-day) leaves the daily card: it is the calibration constant hrThreshold() uses to compute the
   160/178 boundaries set on the strap; changing it mid-block makes every logged minute non-comparable. It
   lives on the Cardio tab, read-only, reviewed at the week-12 test.
   POPULATION PANEL: Nunan 2010 (PMID 20663071) and Ortega 2023 (PMID 37755550) were both checked 2026-09-20
   and NEITHER is available in full text through PubMed Central; project rule says metadata is not enough to
   hardcode a number, so the panel shows his OWN trend only and says so. It also could not honestly map a
   proprietary Elite score to RMSSD norms even with them. */
function setElite(dISO,v){Z.elite=Z.elite||{};if(v===""||v==null)delete Z.elite[dISO];else Z.elite[dISO]=Number(v);save();render();}
function setHgRHR(dISO,k,v){Z.hgrhr=Z.hgrhr||{};Z.hgrhr[dISO]=Z.hgrhr[dISO]||{};
  if(v===""||v==null)delete Z.hgrhr[dISO][k];else Z.hgrhr[dISO][k]=Number(v);
  if(!Object.keys(Z.hgrhr[dISO]).length)delete Z.hgrhr[dISO];save();render();}
const ELITE_WIN=14, ELITE_MIN=7;
/* Trailing ELITE_WIN-day mean of the Elite series ending on `endISO`; null under ELITE_MIN readings. */
function eliteWindow(endISO){
  const s=new Date(endISO+"T00:00:00");s.setDate(s.getDate()-(ELITE_WIN-1));const from=iso(s);
  const vals=Object.keys(Z.elite||{}).filter(k=>k>=from&&k<=endISO&&isFinite(Z.elite[k])).map(k=>Z.elite[k]);
  if(vals.length<ELITE_MIN)return {n:vals.length,mean:null,sd:null,lo:null,hi:null};
  const m=vals.reduce((a,b)=>a+b,0)/vals.length,sd=Math.sqrt(vals.reduce((a,b)=>a+(b-m)*(b-m),0)/(vals.length-1));
  return {n:vals.length,mean:m,sd,lo:Math.min(...vals),hi:Math.max(...vals)};
}
const ELITE_WEEKS=[1,6,12];
function eliteCard(){
  const pts=ELITE_WEEKS.map(wk=>{const d=new Date(progStart()+"T00:00:00");d.setDate(d.getDate()+(wk-1)*7+6);const e=iso(d);return {wk,end:e,win:eliteWindow(e),future:e>todayISO()};});
  const now=eliteWindow(todayISO());const all=Object.keys(Z.elite||{}).length;
  let h=`<div class="card"><h3>Elite HRV — your own trend</h3>
  <div class="meta">Trailing ${ELITE_WIN}-day mean of the morning score (minimum ${ELITE_MIN} readings), read at weeks ${ELITE_WEEKS.join(" / ")}. Score is 0–100 from ln(RMSSD), not milliseconds; Whoop's HRV is milliseconds from sleep — <b>never on this chart</b>.</div>
  <div class="row"><div class="nm">Now (to ${fmtD(todayISO())})</div><div class="rx">${now.mean!=null?`<b>${now.mean.toFixed(1)}</b> · sd ${now.sd.toFixed(1)} · ${now.lo}–${now.hi} · n ${now.n}`:`${now.n} of ${ELITE_MIN} readings`}</div></div>
  ${pts.map(p=>`<div class="row"><div class="nm">Week ${p.wk}<div class="sup">window ends ${fmtD(p.end)}</div></div><div class="rx">${p.future?"not yet":(p.win.mean!=null?`<b>${p.win.mean.toFixed(1)}</b> · sd ${p.win.sd.toFixed(1)} · n ${p.win.n}`:`${p.win.n} of ${ELITE_MIN} readings`)}</div></div>`).join("")}
  <div class="mini" style="margin-top:6px">${all} reading${all===1?"":"s"} logged on the Today card. <b>No population reference is shown.</b> The two normative sources (Nunan 2010; Ortega 2023) were not retrievable in full text on 2026-09-20 and the project does not hardcode a figure from an abstract; and a proprietary 0–100 score cannot be honestly placed on an RMSSD-in-ms distribution anyway. A percentile is not a health verdict either way. What this card can do: show whether your own mean moves across the block, in one instrument's units.</div>
  <div class="mini why" style="margin-top:6px">Week-7 test, when the time comes: does Whoop recovery or the Elite score track your logged session RPE better? Both series and the RPE now exist; nothing overrides the gate until that has been looked at.</div></div>`;
  return h;
}

/* ============ v11.34: AUDIO — a media-element fallback for the iPad ============
   Robert's report (2026-09-16): iPhone fine; iPad, NOT muted, no Bluetooth, silent in BOTH modes. So it is
   not the ringer switch. Root cause is unknown and cannot be reproduced here; the two candidates are an
   AudioContext that never reaches "running" on that device (suspended/interrupted after a resume), and an
   iPadOS build without navigator.audioSession. Both are checkable, so the fix makes them checkable and
   provides a second path: pre-rendered WAV beeps generated in JS and played through an <audio> element
   whenever the Web Audio path cannot confirm `running`. Test sound prints all three facts.
   iOS gives a web page NO control over the output route — a "Bluetooth" mode would behave identically to
   Mix, so there is none; the card says so instead of pretending. */
let lastAudioPath="none";
const WAV_CACHE={};
function makeWavURI(n,freq){
  const key=n+"@"+freq;if(WAV_CACHE[key])return WAV_CACHE[key];
  const sr=8000,beat=0.22,gap=0.06,total=n*(beat+gap);const N=Math.round(sr*total);
  const buf=new Uint8Array(44+N);const dv=new DataView(buf.buffer);
  const wstr=(o,s)=>{for(let i=0;i<s.length;i++)buf[o+i]=s.charCodeAt(i);};
  wstr(0,"RIFF");dv.setUint32(4,36+N,true);wstr(8,"WAVE");wstr(12,"fmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true);dv.setUint32(28,sr,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);wstr(36,"data");dv.setUint32(40,N,true);
  for(let i=0;i<N;i++){const t=i/sr,ph=t%(beat+gap);const on=ph<beat;const env=on?Math.min(1,ph/0.015,(beat-ph)/0.03):0;
    const v=env*(0.7*Math.sin(2*Math.PI*freq*t)+0.3*Math.sin(2*Math.PI*freq*2*t));buf[44+i]=128+Math.round(110*v);}
  let s="";for(let i=0;i<buf.length;i++)s+=String.fromCharCode(buf[i]);
  return WAV_CACHE[key]="data:audio/wav;base64,"+btoa(s);
}
function mediaBeep(n,freq){
  try{let el=document.getElementById("beepEl");
    if(!el){el=document.createElement("audio");el.id="beepEl";el.setAttribute("playsinline","");document.body.appendChild(el);}
    el.src=makeWavURI(n,freq);el.volume=1;const p=el.play();if(p&&p.catch)p.catch(()=>{});lastAudioPath="media";return true;}
  catch(e){return false;}
}

/* ============ v11.34: SUNDAY SOCIAL LIFT — log the unprogrammed volume ============
   SUNBLOCK covers only the programmed add-on; the partner-led portion was deliberately unmodelled, so weekly
   volume could be wrong in the one direction that matters (too high, unseen). Free entry: exercise, sets,
   reps, load, muscle by a PICKER not by parsing. Feeds the Volume tab as LOGGED, in a distinct colour, never
   merged into the programmed model. Screenshot-friendly summary for Whoop's screenshot import. */
const SUNLOG_MUS=[["chest","Chest"],["back","Back"],["sdelt","Side/front delt"],["rdelt","Rear delt"],["bicep","Biceps"],["tri","Triceps"],["quad","Quads"],["ham","Hamstrings"],["glute","Glutes"],["calf","Calves"],["abs_ant","Anterior core"],["abs_post","Posterior core"]];
function sunLogAdd(dISO){
  const g=id=>{const e=document.getElementById(id);return e?String(e.value||"").trim():"";};
  const n=g("slName"),sets=Number(g("slSets")),reps=g("slReps"),lb=g("slLb"),mus=g("slMus");
  if(!n||!(sets>0)||!mus){alert("Exercise, sets and a muscle are needed. Reps and load are optional.");return;}
  Z.sunLog=Z.sunLog||{};Z.sunLog[dISO]=Z.sunLog[dISO]||[];Z.sunLog[dISO].push({n,sets,reps,lb,mus});save();render();
}
function sunLogDel(dISO,i){if(Z.sunLog&&Z.sunLog[dISO]){Z.sunLog[dISO].splice(i,1);if(!Z.sunLog[dISO].length)delete Z.sunLog[dISO];save();render();}}
/* Logged (not programmed) sets per muscle for program week w. */
function loggedVolume(w){
  const tot={};Object.keys(MUS).forEach(k=>tot[k]=0);
  const s=new Date(progStart()+"T00:00:00");s.setDate(s.getDate()+w*7);

    L.forEach(x=>{if(tot[x.mus]!=null)tot[x.mus]+=Number(x.sets)||0;});}

function sunLogCard(dISO,editable){
  const L=(Z.sunLog||{})[dISO]||[];
  let h=`<div class="card spine"><h3>Sunday lift — what you actually did <span class="tiertag T3">log</span></h3>
  <div class="meta">The partner-led part of the session, free entry. <span class="why">Counted on the Volume tab as <b>logged</b>, in its own colour, never mixed into the programmed model — so the programmed numbers stay clean and the real total stops being invisible.</span></div>`;
  if(L.length){
    h+=`<div class="sumblock">${L.map((x,i)=>`<div class="row"><div class="nm">${esc(x.n)}</div><div class="rx">${x.sets}×${esc(x.reps||"—")}${x.lb?` · ${esc(x.lb)} lb`:""}</div>${editable?`<button class="mini" onclick="sunLogDel('${dISO}',${i})">×</button>`:""}</div>`).join("")}</div>`;
  }
  if(editable)h+=`<div class="grid2" style="margin-top:8px">
   <div style="grid-column:1/-1"><input id="slName" type="text" placeholder="Exercise"></div>
   <div><input id="slSets" type="number" inputmode="numeric" placeholder="sets"></div>
   <div><input id="slReps" type="text" placeholder="reps (e.g. 8–10)"></div>
   <div><input id="slLb" type="text" inputmode="decimal" placeholder="load (lb), optional"></div>
   <div><select id="slMus"><option value="">muscle…</option>${SUNLOG_MUS.map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></div>
  </div><div style="margin-top:6px"><button class="btn sm" onclick="sunLogAdd('${dISO}')">Add</button></div>`;
  return h+`</div>`;
}
/* Screenshot summary of a strength day: exercise · sets×reps · load, no prose. For Whoop's screenshot import. */
function sessionSummary(w,dkey,dISO){
  const R=rxWeek(dkey,w,dISO);const exs=EX[dkey],rx=RX[R.i][dkey];const rows=[];
  exs.forEach((e,i)=>{if(e.sup)return;const [s,r,rir]=rx[i];const rec=(Z.lifts[dISO]||{})[e.k];
    let sets=s;if(i===1&&HEAVY_BO_DAYS.includes(dkey))sets=Math.max(1,s-hboTrade(R.i));
    rows.push(`<div class="row"><div class="nm">${e.n}</div><div class="rx">${sets}×${r}${rec&&rec.w?` · ${rec.w} lb`:""}</div></div>`);
    if(i===0&&HEAVY_BO_DAYS.includes(dkey)){const HB=heavyBO(R.i,dkey);const hk=e.k.replace("_top","_hbo");const hr=(Z.lifts[dISO]||{})[hk];
      rows.push(`<div class="row"><div class="nm">${e.n.replace("Top Set","Heavy Back-offs")}</div><div class="rx">${HB.sets}×${HB.reps}${hr&&hr.w?` · ${hr.w} lb`:""}</div></div>`);}
    if(i===1&&dkey==="d2"&&Z.de){const dv=(Z.lifts[dISO]||{}).bp_de;rows.push(`<div class="row"><div class="nm">Bench — Dynamic Effort</div><div class="rx">${DE.sets}×${DE.reps}${dv&&dv.w?` · ${dv.w} lb`:""}</div></div>`);}
  });

}

/* ============ v11.34: FRIDAY PRE-KICK CARD ============

/* ---- Reference selection logic (pure; reads Z, GMB, GMB_AUTO, progStart, dayIdx from the app) ----
   Robert, 2026-09-16: follow the Praxis order; once a class runs out, repeat its hardest version.
   A class advances only when a session of THAT class was done (Praxis behaviour: "next session").
   Done = Z.gmb["on_"+day]===true (Today toggle, what he actually uses) or Z.done[day].gmb (timer).
   Class done that day = Z.gmb.ov[day] || GMB_AUTO[dow]. Counted from block start, strictly before
   the day being shown, so the day's own tick never changes that day's version.
   Local dates on purpose: the app's iso() uses toISOString (UTC) and shifts after 8 pm ET. */
function gmbLocalISO(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function gmbDoneBefore(cls,dISO){
  /* v11.34 (Robert, 2026-09-18): a class advances on a COMPLETION — the Today tick or a finished timer run —
     never on the plan toggle alone, except for days before GMB_TICK_FROM, where the toggle is all the history
     there is (he confirmed he ran all four toggled days). The host defines GMB_TICK_FROM (the app: the Monday
     v11.34 shipped) and, when it has one, gmbClassFor(day) — the date-aware auto-pick with override. */
  let n=0;const e=new Date(dISO+"T00:00:00");
  for(let d=new Date(progStart()+"T00:00:00");d<e;d.setDate(d.getDate()+1)){
    const k=gmbLocalISO(d);
    const done=!!(Z.done&&Z.done[k]&&Z.done[k].gmb);
    const planned=!!(Z.gmb&&Z.gmb["on_"+k]===true);
    if(!(done||(planned&&k<GMB_TICK_FROM)))continue;
    const c=(typeof gmbClassFor==="function")?gmbClassFor(k):((Z.gmb&&Z.gmb.ov&&Z.gmb.ov[k])||GMB_AUTO[dayIdx(d)]);
    if(c===cls)n++;
  }
  return n;
}
function gmbVersion(cls,dur,dISO){
  const p=GMB_PROG[cls];
  if(!p||!p.v.length)return {c:GMB[cls][dur],i:null,pos:null,n:0,of:0,hardest:false};
  const n=gmbDoneBefore(cls,dISO),hardest=n>=p.v.length,i=hardest?p.hard[dur]:n;
  return {c:p.v[i][dur],i,pos:p.pos[i],n,of:p.v.length,hardest};
}

/* ============ v11.34: GMB — completion, progression, ratings, and the Get Flex & Chill routines ============
   COMPLETION (item 14). Today's GMB card carried only a PLAN toggle (Z.gmb.on_<date>); the only writer of
   Z.done[d].gmb was a finished timer run, and GMB appeared in no scoring path. Now: a separate completion
   tick beside the plan toggle; GMB in EXPECT on all seven days at T3 (chaosWeek never fires off it); a
   BLK label; an honest MEAS entry (the class length he set, not an estimate). Domain credit — Robert's
   choice (c): a separate low-stakes RESTORATION row shared with yin, counting GMB + yin sessions per week,
   target 5+, shown as a count not a pass/fail, labelled inference. It never feeds the hip/ROM count —
   that count's own citation (Alizadeh 2023) says bodyweight-only work does not raise ROM.
   PROGRESSION (item 13). Classes follow the Praxis Mobility track (GMB_PROG, pasted from the GMB capture);
   the hardest version repeats after run-out. A class advances per COMPLETED session — the completion tick
   or a finished timer run — never per calendar week and never on the day's own tick. EXCEPTION, decided
   2026-09-18: for days before GMB_TICK_FROM the plan toggle is all the history there is, and he confirmed
   he ran GMB on all four toggled days (09-14/16/17/18), so those seed the progression. From GMB_TICK_FROM
   a bare plan toggle advances nothing.
   RATING (item 16): same one-per-day control, keyed g_<class>_<dur>, carrying the version index. */
const GMB_TICK_FROM="2026-09-21";   /* first day the plan toggle stops counting as a completion (Mon of week 2, the v11.34 build) */
/* v11.34 — the auto-class is DATE-AWARE. Robert, 2026-09-20: the Get Flex & Chill kicking routine replaces
   Friday GMB Hips as tissue prep before the 6:30 class, from FF_FROM. Switching GMB_AUTO[4] globally would
   silently reassign the 2026-09-18 Hips completion to the kicking routine and drop the four-session Hips seed
   to three, so the switch is on a dated boundary. Sunday keeps Rotation & Sidebending as the pre-BJJ class;
   the grappling routine runs AFTER BJJ as its own card (ffCard). */
const FF_FROM="2026-09-25";
function gmbAutoFor(dISO,dowHint){const d=new Date(dISO+"T00:00:00");const dow=isNaN(d.getTime())?dowHint:dayIdx(d);
  if(dow==null)return GMB_AUTO[0];
  if(dow===4&&(isNaN(d.getTime())||dISO>=FF_FROM))return "FF Kicking";   /* a preview (no real date) shows the current design */
  return GMB_AUTO[dow];}
function gmbClassFor(dISO,dowHint){return (Z.gmb&&Z.gmb.ov&&Z.gmb.ov[dISO])||gmbAutoFor(dISO,dowHint);}
/* gmbDoneBefore: defined in the pasted GMB/app-gmb-progression.js (v11.34 completion-only rule); it reads GMB_TICK_FROM and gmbClassFor from here. */
function isFF(cls){return !!FF_ROUTINES[cls];}
/* Version label for a class on a day. FF classes have no Praxis versions. */
function gmbVersionLabel(cls,dur,dISO){
  if(isFF(cls))return `${cls} · Get Flex &amp; Chill · ${FF_ROUTINES[cls].len[String(dur)]==="full"?"full protocol":"prep variant"}`;
  const v=gmbVersion(cls,dur,dISO);
  if(v.i==null)return `${cls}`;
  return v.hardest?`${cls} · hardest version (Praxis #${v.pos}), repeating`:`${cls} · version ${v.i+1} of ${v.of} (Praxis #${v.pos})`;
}
/* The rows the timer and the list use for a class on a day. */
function gmbRowsFor(cls,dur,dISO){
  if(isFF(cls))return ffRows(cls,dur);
  return gmbVersion(cls,dur,dISO).c;
}
function gmbThumbFor(base){
  if(FF_THUMB[base])return FF_THUMB[base];
  const id=GMB_THUMB_NAME[base];return id?GMB_THUMB[id]:null;
}
function thumbImg(base,style){const src=gmbThumbFor(base);return src?`<img class="thumb" alt="" src="${src}"${style?` style="${style}"`:""}>`:"";}
/* Weekly restoration count: GMB completions + yin completions + the Sunday grappling cool-down. */
const RESTORE_TARGET=5;   /* [INF] display target, sessions per week, count not pass/fail */
function weeklyRestore(dISO){const days=weekBounds(dISO);let g=0,y=0,f=0;
  days.forEach(k=>{const c=Z.done[k]||{};if(c.gmb)g++;if(c.yin)y++;if(c.ffg)f++;});return {gmb:g,yin:y,ff:f,total:g+y+f};}

/* ============ v11.34: GET FLEX & CHILL — kicking (Friday prep) and grappling (Sunday cool-down) ============
   Robert's decisions, 2026-09-20 (drafts/get-flex-chill-proposal-2026-09-20.md): kicking routine replaces
   Friday GMB Hips as tissue prep before the pre-kick drills, PREP variant by default (one round, final hold
   20 s); grappling routine runs AFTER Sunday BJJ as the FULL protocol; Sunday's pre-BJJ class stays
   Rotation & Sidebending; Neck Combined Motions included, no thumbnail, with a written how-to.
   Stretch lists and the protocol are from the GMB chart PDFs; key points from the FF library. The prep
   variant's 20 s final hold is under the 60 s per-bout threshold at which isolated maximal strength falls
   (Warneke & Lohmann 2024, full text; jumping/sprinting/throwing unaffected at any duration), and the
   pre-kick drills after it are the "subsequent dynamic activity" that counteracts the deficit anyway.
   Round counts for the FULL variant are FITTED to GMB's stated follow-along lengths (21 / 25 min) because
   the videos were not downloaded (standing call): kicking 2 rounds, grappling 3 rounds. [INF]
   Once a week these routines will not move range on their own (GMB asks for 2×/wk minimum); that is not
   what they are scheduled for. Range stays Markow's and GMB Hips'. */
const FF_PROTO={hold:10,contr:12,final:{prep:20,full:30},exit:4};
const FF_ROUTINES={
 "FF Kicking":{stretches:[["Full Pancake",0],["Frog",0],["Kneeling Lunge A",1],["Kneeling Lunge B",1],["Modified Pigeon",1]],
   rounds:{prep:1,full:2},len:{"15":"prep","30":"full","45":"full"},
   why:"GMB's kicking routine: adductors, hip flexors, hip rotators. Tissue prep before the pre-kick drills and the 6:30 class — your experience, not GMB's positioning (they never call these warm-ups). Replaces Friday GMB Hips from "+"2026-09-25"+"."},
 "FF Grappling":{stretches:[["Seated Forward Fold",0],["Camel",0],["Spinal Combined Motions",1],["Neck Combined Motions",1]],
   rounds:{prep:1,full:3},len:{"15":"prep","30":"full","45":"full"},
   why:"GMB's grappling / groundwork routine: spine flexion, extension, sidebending and neck. Runs after BJJ as a cool-down, full protocol — GMB's own placement for a routine after a session."}
};
/* Key points, verbatim from the FF library (GMB/literature/focused-flexibility-plus). Every stretch in the two
   routines, because five of them are new to him. */
const FF_HOWTO={
 "Full Pancake":["Hamstrings, hip adductors, back extensors","Bring legs as far apart as you can. Back straight and chest up — bend the knees if that is what it takes. Hinge forward at the hips.","Press the heels into the ground and contract as though bringing the feet toward each other (without moving the legs), while extending the chest up and forward as you move in and out of the stretch."],
 "Frog":["Hip adductors","Careful about possible knee strain — adjust the knee/calf angle as needed.","Squeeze the knees together into the ground."],
 "Kneeling Lunge A":["Hip flexors, quadriceps, hip internal rotators","Flattened lumbar spine (posterior pelvic tilt). Front foot far enough out that the knee is comfortable when you shift forward. Hips and shoulders square.","Either straighten the back knee and lengthen the heel backwards with the upper body still, or engage the hip flexors by pulling the back knee into the ground."],
 "Kneeling Lunge B":["Hip flexors, quads, hip internal rotators","Same position as Lunge A.","Lateral motion and rotation of the back leg, finding your areas of restriction."],
 "Modified Pigeon":["Hip rotators, hip extensors","Front leg bent, shin parallel to the hips (90° knee). Chest up, hinge forward at the hip and pull the body over the leg.","Push the side of the lower leg into the ground."],
 "Seated Forward Fold":["Hamstrings, back extensors, calves","Arched back; legs bent enough to allow the torso position.","Push the heels down into the ground."],
 "Camel":["Hip flexors, abdominals, chest, anterior shoulders, biceps","Kneel in front of a stable elevated surface, on the balls of the feet or the insteps. Reach back with palms facing forward. Push the hips forward, chest high.","Push the hips forward, lift the chest, push down through the hands."],

/* ================= v11.26 — THE DATE CURSOR =================
   Robert asked to be able to log a previous or future day: "even though I'm not supposed to,
   if I decide to make up a little bit of a previous day ... I want to be able to log what I do."

   THE STORAGE ALREADY SUPPORTED THIS. `Z.done` has always been keyed by ISO date and
   `tog(dISO,id)` has always taken the date as a parameter. Every card in dayStack() already
   receives `dISO` and writes through it. What was hardcoded was the VIEW: rToday() called
   todayISO() and there was no way to hand it anything else. So this is a cursor, not a
   migration — no new shape, no data moved, nothing renamed.

   `Z.view` is null in the normal case and holds an ISO date when the cursor is moved. It is
   deliberately NOT persisted as "the current day" in any other sense: nothing outside the
   Today tab reads it, and it resets to today on demand.

   WHAT THE CURSOR GOVERNS, and what it does not — this boundary is load-bearing:
     GOVERNED  day-logging on Today. Session checkboxes, readiness, GMB, the on-ramp toggles.
               These are all "what did I do on that day", and they were already date-keyed.
     NOT       measurement stamps on the Test/Cardio tabs — a banked e1RM, a screen row, an
               FTP date, a benchmark ride. Those record WHEN THE MEASUREMENT WAS TAKEN, and
               backdating them would put a dated observation in the ledger on a day it was not
               observed. That is the one thing the layoff-decay logic must be able to trust.
               They keep calling todayISO() on purpose. Do not "make them consistent".

   The exposure ledger is safe in both directions and needs no guard: rxWeek() is
   min(calendarWeek, completedExposures+1), so logging a future day cannot run the load ahead
   of the calendar, and backfilling a past day can only ever return the ledger to where honest
   completion would have put it. ============================================================ */
/* VALIDATES ON READ, not only on write. viewSet() already rejects a bad value, but a stored
   one reaches this function without ever passing through it — a hand-edited backup, a partial
   restore, an older build. qa26 §7 caught exactly that: `Z.view="not-a-date"` produced an
   Invalid Date, dayIdx() returned NaN, and tonightCard threw on YIN[undefined][0], taking the
   whole Today tab down with it. A cursor is a navigation control; it must never be able to
   make the day unrenderable. */
function viewISO(){
  const v=Z&&Z.view;
  return (v&&ISO_RE.test(v)&&!isNaN(new Date(v+"T00:00:00").getTime()))?v:todayISO();
}
function viewOff(){return viewISO()!==todayISO();}
function viewSet(v){

function viewShift(n){

function viewToday(){Z.view=null;save();render();}

function lastLoad(exKey,beforeISO){

function lastLoads(exKey,beforeISO,n){

/* ---- v10 helpers ---- */
/* ===== Booty Sprout =====
   Bands on hand: 45 lb and 70 lb nominal. Exact count of each is unknown, so the
   picker takes a quantity of each rather than assuming an inventory.
   IMPORTANT: the printed rating is NOMINAL. A band delivers its rated tension only
   at one stretch length; on a Sprout, lockout tension is far above bottom tension.
   So this number is an ORDINAL marker for progression, not a real load. It is
   deliberately kept out of barbell tonnage and out of the volume model's load math.
   Sets still count normally toward the horizontal glute vector. */
const BS_BANDS=[45,70];
function bsLoad(c){return (c.b45||0)*45+(c.b70||0)*70;}
function bsLabel(c){const p=[];if(c.b45)p.push(`${c.b45}×45`);if(c.b70)p.push(`${c.b70}×70`);
  return p.length?p.join(" + ")+` = ${bsLoad(c)} lb nominal`:"no bands set";}

  return ks.length?Z.bs[ks[ks.length-1]]:null;}

/* Progression order is the author's: reps first, then tempo and pauses, then band tension. */
function bsNextStep(cur,prev){
  if(!prev)return "First logged session. Establish a rep baseline before changing anything.";
  const dL=bsLoad(cur)-bsLoad(prev);
  if(dL>0)return `Tension went up (${bsLoad(prev)} → ${bsLoad(cur)} nominal). Hold here and rebuild reps before adding more.`;
  const pr=parseInt(prev.reps)||0,cr=parseInt(cur.reps)||0;
  if(cr>pr)return "Reps are climbing. Keep going on reps until they stall.";
  if(cr&&cr<=pr&&!cur.pause)return "Reps have stalled. Next lever is tempo or a pause at lockout, not more band.";
  if(cr&&cr<=pr&&cur.pause)return `Reps stalled with a pause already in. Now add tension: next step up is ${bsLoad(cur)+45} or ${bsLoad(cur)+70} nominal.`;
  return "Log reps to get a progression call.";
}

/* ================= v11.27 — SESSION-LEVEL AERO LOGGING, ANY DATE =================
   Robert: "The Cardio tab logging function needs to be able to log single cardio
   high-intensity sessions and indicate the date that they were done so that if I don't log it
   immediately after the session, I can do it retrospectively. It will compile over the week to
   meet the floor or progression requirements."

   What already existed, and why it was not enough: the "Log a different day" block has been on
   this card since v11.13, but it is a grid over `weekBounds(dISO)` — SEVEN FIXED ROWS, the
   current week only. A session from ten days ago had nowhere to go, and neither did a session
   he wanted to enter before the week it belongs to came round. Retrospective entry was
   possible for six days and impossible on the seventh.

   THE DAY REMAINS THE UNIT OF THE FLOOR, and this is the constraint that shapes everything
   below. `weekScore()` counts DAYS that clear 13 min; two sessions on one day that are scored
   separately are two failures, whereas summed they clear — that is not hypothetical, it is
   Aug 7 (two kickboxing blocks, ~9 and ~8 min over threshold), and the card has warned about
   it in prose since v11.13. So a session entry ADDS INTO the day's total rather than standing
   beside it. Sessions compile into days; days compile into the week. Both of his sentences.

   `Z.aero[date]` therefore stays exactly what it was — the single number the floor reads, and
   still directly editable. Nothing about `weekScore`, `aeroQualify`, `aeroZ5Bad` or the
   week grid changes, and there is no migration.

   `Z.aeroLog` is an APPEND-ONLY RECORD OF WHAT WAS ENTERED AND WHEN. It computes nothing.
   Same pattern and same rule as `Z.layoffObs` — a ledger that observes rather than drives, so
   that an absurd value in it cannot move a prescription. If it and the day total disagree
   (because a day total was hand-edited in the grid, which is still allowed), the card SAYS SO
   and offers to reconcile. It does not silently fix it: two places holding one fact is how
   this project has been bitten before, and the honest resolution is to show the drift.
   ================================================================================= */

function aeroAdd(date,mins,z5,mode,z2,inst,hr,rpe){

/* ================= v11.31 — ONE DATED-OBSERVATION PRIMITIVE =================
   Robert: "Seems to make sense that the benchmark ride, the FTP, the kick height screen —
   really anything that I log, I'm able to control the date, doesn't it?"

   Yes. v11.30 solved this for ONE card and left three with the same gap. The wrong way to
   finish the job is four more bolt-on date boxes: the input is the easy part and the GUARDS
   are the hard part, and four copies of a guard is four chances to get one wrong and no way to
   tell which. So there is one validator and one control, and every measurement logger calls it.

   THE SPLIT THAT MATTERS, and it is now the whole model — two mechanisms, no third:
     DAY-LOGGING     follows the date cursor. Session ticks, readiness, GMB, on-ramp toggles,
                     cardio sessions. Nothing is typed; the cursor is the date.
     MEASUREMENTS    carry an EXPLICIT TYPED date, defaulting to today. Never read the cursor.
                     A stamp that moves because a navigation control moved is the bug; a date
                     he typed on purpose is not.

   `obsDate()` refuses the future outright — a measurement cannot have been observed tomorrow,
   which is exactly where the day cursor's deliberate permissiveness would be wrong — and
   refuses anything that is not a real ISO date, because several of these dates are read back
   as the head of a clock (`Z.base.date` -> `lastLiftDay()` -> the layoff decay) where an
   Invalid Date propagates silently. ============================================== */
function obsDate(inputId){
  const el=document.getElementById(inputId);

  if(!ISO_RE.test(v)||isNaN(new Date(v+"T00:00:00").getTime())){

  if(v>todayISO()){

function obsAgo(d){return Math.floor((new Date(todayISO()+"T00:00:00")-new Date(d+"T00:00:00"))/86400000);}

/* ================= v11.30 — THE OBSERVATION CARRIES ITS OWN DATE =================
   Robert, having logged Thursday's bench triple and come back to it on Saturday: "I think now

   Not quite, and the gap he found is real. The date cursor governs day-logging; measurement
   stamps deliberately ignore it, and that rule stands (see below). But `rebankTriple` stamped
   `todayISO()` with no way to say otherwise — so the rationale behind the rule, "record when
   the measurement was actually TAKEN", was being violated by the card itself the moment he
   logged late. Which, by his own account, is the normal case.

   THIS IS NOT THE CHANGE THE v11.26 HANDOFF FORBIDS. That one is measurement stamps
   *silently* following the cursor, where a stamp moves because a navigation control moved and
   nobody typed anything. This is the opposite: an explicit, visible, typed date, defaulting to
   today, which makes the observation date deliberate instead of assumed. `viewISO()` is NOT
   read here and must not be — qa26 §11 asserts the field defaults to today even with the
   cursor parked on another day.

   `Z.base.date` as its starting point:

       where the day cursor's deliberate permissiveness would be wrong.
     - OLDER THAN THE CURRENT BANK -> warned in the confirm. Banking a stale observation over a
       newer one silently moves the decay clock BACKWARDS and re-ages a lift that is current.
     - OLDER THAN THE 42-DAY WINDOW -> warned. Outside `E1_WINDOW` the rolling e1RM would not
       have looked at it anyway, so banking it as the baseline is probably not what was meant.

function rebankTriple(k){

  if(!(w>0)){alert("Enter the weight you actually lifted.");return;}
  if(!(rir>=0&&rir<=5)){alert("Enter reps in reserve, 0 to 5. If you genuinely had none left, enter 0.");return;}
  const obs=obsDate("trid_"+k);            /* v11.31 — shared validator; was inline */
  if(!obs)return;

  const age=Math.floor((new Date(todayISO()+"T00:00:00")-new Date(obs+"T00:00:00"))/86400000);
  if(age>E1_WINDOW)warn+=`\n\nWARNING: that was ${age} days ago, outside the ${E1_WINDOW}-day rolling window. The e1RM would not have been reading it anyway.`;

  if(!confirm(msg))return;

     tab's ledger is where those accumulate. It is an OBSERVATION — nothing computes from it.

     `entered` records when it was TYPED, so a late entry is distinguishable from a same-day
     one without either date having to lie about the other. */
  Z.layoffObs=Z.layoffObs||[];

/* ---- v11.25 — FTP. The app still calculates no FTP; Peloton owns the number. What it does
   now is REMEMBER it, date it, and notice when it moves — because an FTP change silently
   invalidates the Layer 3 benchmark comparison, and that is the one failure mode that
   poisons data rather than obviously breaking it. ---- */
function setFTP(){
  const el=document.getElementById("ftpNew");
  const v=Number(el&&el.value);
  if(!(v>0)){alert("Enter the new FTP in watts.");return;}
  const obs=obsDate("ftpDate");                           /* v11.31 — the day Peloton got it */
  if(!obs)return;
  const prev=(Z.ftp&&Z.ftp.w)||null;
  /* Backdating an FTP RE-PARTITIONS the benchmark history: every ride logged on or after this
     date is now treated as having been ridden on the new number. That is usually the point —
     he enters the FTP in Peloton on one day and records it here later — but it is destructive
     if the date is set earlier than the change actually happened, and it fails silently
     because nothing about a ride's stored figures says which FTP produced them. */
  const affected=(Z.aeroBench||[]).filter(r=>r.date>=obs).length;
  if(obs!==todayISO()&&affected){
    if(!confirm(`Dating this FTP ${obs}${obsLateNote(obs)}.\n\n${affected} benchmark ride${affected===1?" is":"s are"} logged on or after that date. ${affected===1?"It":"They"} will now be read as having been ridden on the NEW number.\n\nOnly do this if Peloton actually had the new FTP by then.\n\nContinue?`))return;
  }
  Z.ftp={w:v,date:obs,prev,entered:todayISO()};
  save();
  if(prev&&v!==prev&&(Z.aeroBench||[]).length){
    if(confirm(`FTP ${prev} → ${v} W.\n\nPower Zone targets are a percentage of FTP, so every benchmark ride logged at the old FTP was ridden at different watts. Comparing across the change measures the FTP move, not adaptation.\n\nStart a new Layer 3 baseline here?`))
      benchNewBaseline();

}
