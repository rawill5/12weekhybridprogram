/* ============ v11: WEEKLY MED SCORECARD ============
   Counts INTENSITY-QUALIFIED exposures, not sessions. A heavy triple at 85%
   counts; four sets at 70% does not. Protected compounds are D1 box squat,
   D2 bench, D3 trap bar — Robert's call 2026-08-03. D4 machine/hypertrophy is
   the flex day and is made up at the Sunday social lift. */
const COMPOUND=["d1","d2","d3"];
function weekBounds(dISO){const d=new Date(dISO+"T00:00:00");const off=(d.getDay()+6)%7;
  const s=new Date(d);s.setDate(d.getDate()-off);const out=[];
  for(let i=0;i<7;i++){const x=new Date(s);x.setDate(s.getDate()+i);out.push(iso(x));}return out;}
function weekScore(dISO){
  const days=weekBounds(dISO);
  let heavy=0,heavyV=0,heavyU=0,d4=0,aero=0,hipD=0,skill=0,plyo=0,drills=0;
  days.forEach(k=>{
    const c=Z.done[k]||{};
    const dowK=dayIdx(new Date(k+"T00:00:00")), wK=calWeekOf(k);
    const dk=DKEY[dowK];
    if(c.str&&dk&&COMPOUND.includes(dk)){
      const cl=exposureClass(k,dk);
      if(cl==="heavy")heavyV++;          /* verified >=80% */
      else if(cl==="unlogged")heavyU++;  /* no load logged — counted, but not verified */
      if(cl!=="light")heavy++;           /* a logged sub-80% session does NOT count as heavy */
    }
    if(c.str&&dk==="d4")d4++;
    if(c.sunlift)d4++;                        /* D4 made up at the Sunday social lift — his call 2026-08-03 */
    if(c.markow)hipD++;
    if(c.kick)skill++; if(c.bjj)skill++;
    /* v11.34 — a drill-phase Saturday is a DRILL session, not 60 foot contacts (Moran 2024 is jump and
       sprint research). Mon/Thu plyos and Build/Peak Saturday accelerations still count as a block. */
    if(c.plyo){if(dowK===5&&wK!=null&&sprintPhase(wK,k).B.drill)drills++;else plyo+=60;}
    if(aeroQualify((Z.aero||{})[k]))aero++;
  });
  const restore=weeklyRestore(dISO), throws=weeklyThrows(dISO);
  const st={strength:medStatus("strength",heavy),aerobic:medStatus("aerobic",aero),
            hip:medStatus("hip",hipD),power:medStatus("power",plyo),skill:medStatus("skill",skill)};
  /* Tier. HELD is the literature's maintenance floor — hitting it means you
     provably lost nothing, which is a real thing to be told on a bad week. */
  let tier="MISSED";
  if(heavy>=3&&aero>=2&&skill>=2)tier="FULL";
  else if(heavy>=2&&aero>=1&&skill>=1)tier="SOLID";
  else if(heavy>=1)tier="HELD";
  return {days,heavy,heavyV,heavyU,d4,aero,hipD,skill,plyo,drills,restore,throws,st,tier,
          counts:{strength:heavy,aerobic:aero,hip:hipD,power:plyo,skill:skill}};
}
const TIERTXT={
 FULL:["Full week","3 compound days, 2 hard aerobic, 2 skill. Everything progressing."],
 SOLID:["Solid week","Above the maintenance floor everywhere that matters. This is a good week, not a compromise."],
 HELD:["Held","At least one heavy exposure. Per the evidence you lost nothing measurable — 1-2 weeks at this level costs no 1RM at all."],
 MISSED:["Below floor","No heavy exposure this week. One heavy triple at 80% is 12 minutes and fixes it."]};

/* ---- Adaptive layer. Replaces \"repeat the week\" with \"change next week.\"
   Weeks never repeat — progression is calendar-driven by design. What adapts is
   the prescription. ---- */
/* v11.25 — THE PRE-BLOCK WEEKS ARE NOT FAILURES.
   This walked back three calendar weeks and scored each one with no regard for whether
   the block had opened. On Aug 24 that read the layoff week (Aug 17-23, the week the app
   itself renders as "Nothing is owed") and the on-ramp week (Aug 10-16, a different
   structure that scores nothing) as two consecutive strength zeros, and adaptations()
   announced that strength had been below its maintenance floor three weeks running and
   would be cut to the MED — on the opening morning of the block, off two weeks the app
   had declared owed nothing.

   `domainDrift` already had exactly this guard (`if(d<progStart())continue`). This
   function did not. Same failure family as the v11.22 gap bug: a mechanism reading dates
   before the block as if they were block weeks.

   A week counts only if its MONDAY is on or after the block start, so a partial first
   week cannot count either. adaptations() requires tr.length===3, so no adaptation can
   fire until three real block weeks exist. That is the intended behaviour, not a side
   effect: three weeks of evidence means three weeks of the block.

   NOT to be confused with the e1RM decay clock, which is a different mechanism answering
   a different question and self-clears the moment a lift is trained. See qa23 section 5. */
function domainTrend(dISO,dom,weeks){
  const out=[];
  for(let i=0;i<weeks;i++){
    const k=isoBack(dISO,i*7);
    if(weekBounds(k)[0]<progStart())continue;
    out.push(weekScore(k).st[dom]);
  }
  return out;}
function adaptations(dISO){
  const A=[];
  ["strength","aerobic","hip","skill"].forEach(dom=>{
    const tr=domainTrend(dISO,dom,3);
    if(tr.length===3&&tr.every(x=>x===0))
      A.push({dom,act:"floor",msg:`<b>${MED[dom].n}</b> has been below its maintenance floor 3 weeks running. Next week this domain drops to the MED only — <i>${MED[dom].maintain.v} ${MED[dom].maintain.u}</i> — and the intensity is protected. Prescribing volume that is not happening is what makes a block feel like failure.`});
    else if(tr.length===3&&tr.every(x=>x===2))
      A.push({dom,act:"raise",msg:`<b>${MED[dom].n}</b> has been at its progression dose 3 weeks running. Room to add.`});
  });
  return A;
}
function scoreCard(dISO){
  const w=weekScore(dISO);
  /* v11.13: MISSED means "the week happened and nothing heavy was in it". On Monday and
     Tuesday the week has not happened yet, so the same state is just an empty scorecard.
     Calling it "Below floor" on the morning the block starts is both wrong and dispiriting.
     w.tier is untouched — only the wording — so nothing downstream of it moves. */
  const dw=(new Date(dISO+"T00:00:00").getDay()+6)%7;
  const early=w.tier==="MISSED"&&dw<=1&&!w.heavy&&!w.aero&&!w.skill;
  const T=early?["Week just started","Nothing logged yet \u2014 that is what a Monday looks like. The target is 3 compound days, 2 hard aerobic, 2 skill."]:TIERTXT[w.tier];
  const cls=early?"":(w.tier==="FULL"?"teal":(w.tier==="SOLID"?"teal":(w.tier==="HELD"?"amber":"red")));

  h+=`<div class="row"><div class="nm"><span style="color:${w.restore.total>=RESTORE_TARGET?"var(--ok,#3a7)":"var(--dim,#777)"}">\u25cf</span> Restoration — GMB + yin
      <div class="sup">${w.restore.gmb} GMB · ${w.restore.yin} yin${w.restore.ff?` · ${w.restore.ff} grappling`:""} · target ${RESTORE_TARGET}+ a week [INF], a count not a pass/fail. Never feeds the hip count.</div></div><div class="rx">${w.restore.total}</div></div>`;
  h+=`<div class="row"><div class="nm"><span style="color:var(--dim,#777)">\u25cf</span> Upper ballistic throws<div class="sup">Wed throws + Thu rotational + Fri slams, reps per week. No floor [INF]; never foot contacts.</div></div><div class="rx">${w.throws}</div></div>`;
  if(w.drills)h+=`<div class="row"><div class="nm"><span style="color:var(--dim,#777)">\u25cf</span> Sprint drill sessions<div class="sup">Saturday drill-phase sessions. Counted here, not as plyometric contacts.</div></div><div class="rx">${w.drills}</div></div>`;
  h+=`<div class="mini" style="margin-top:8px">D4 this week: ${w.d4?"done":"not done \u2014 fold it into Sunday\u2019s social lift. That is the designed makeup, not a failure."}</div>`;
  const A=adaptations(dISO);
  if(A.length)h+=A.map(a=>`<div class="banner amber" style="margin-top:8px">${a.msg}</div>`).join("");
  h+=`<div class="mini" style="margin-top:8px"><b>Weeks never repeat.</b> Progression is calendar-driven. When a domain stalls, the prescription changes \u2014 the calendar does not.</div></div>`;
  return h;
}
/* ---- v11.25 — the Today STRIP. One line, and it is the whole of Layer 1 and Layer 2's

/* ---- v11.34 — ZONE 2, its own card. Definition is METABOLIC (Attia): the highest output at which lactate
   stays under about 2 mmol/L; practical proxy the talk test — full sentences, but you would rather not.
   Bike prescription: Peloton Power Zone 2 (56–75% FTP) plus the talk test. The 117–137 bpm band (60–70%
   HRmax) is demoted to a guide: a heart-rate zone that likely under-reads metabolic Zone 2. HR calibration,
   his choice: Zone 2 sessions record average HR and, once ≥4 rides exist on one instrument, the card shows
   his own observed Zone 2 HR range (median, IQR) for that instrument. Sleeve, wrist and strap never mix. ---- */
function z2Card(dISO){
  const B=z2Band(),wk=weekBounds(dISO),z2w=wk.reduce((a,k)=>a+((Z.z2||{})[k]||0),0),cal=z2Calib();
  const F=Z.ftp;const lo=F?Math.round(F.w*0.56):null,hi=F?Math.round(F.w*0.75):null;
  let h=`<div class="card spine t2" style="border-left-color:var(--z2)"><h3>Zone 2 — metabolic <span class="chip teal">base</span></h3>
  <div class="meta"><b>Definition:</b> the highest steady output at which lactate stays under ~2 mmol/L. <b>Proxy:</b> the talk test — full sentences, but you would rather not. <b>On the bike:</b> Peloton Power Zone 2${F?` = <b>${lo}–${hi} W</b> at FTP ${F.w}`:" (56–75% of FTP — record FTP above to see watts)"}, held where the talk test still passes. Tue + Sat, 90 min, protected; never gated.</div>
  <div class="row"><div class="nm">This week</div><div class="rx"><b>${z2w}</b> min</div></div>
  <div class="mini why" style="margin-top:6px">The old ${B.lo}–${B.hi} bpm band (60–70% of your ${HRMAX} max) is a heart-rate <i>guide</i> only; it likely under-reads metabolic Zone 2 for you. Log the ride's average HR on each session and the range below becomes yours.</div>`;
  const insts=Object.keys(cal);
  if(insts.length){
    h+=`<div class="mini" style="margin:8px 0 4px"><b>Your observed Zone 2 heart rate</b> — per instrument, never mixed</div>`;
    insts.forEach(i=>{const c=cal[i];h+=`<div class="row"><div class="nm">${AERO_INST[i]||i}<div class="sup">${c.n} ride${c.n===1?"":"s"} with an average HR</div></div><div class="rx">${c.ready?`<b>${c.med}</b> bpm · IQR ${c.q1}–${c.q3}`:`median ${c.med} · needs ${Z2_MIN_RIDES-c.n} more`}</div></div>`;});
  } else h+=`<div class="mini" style="margin-top:6px">No Zone 2 session carries an average HR yet. Four on one instrument give you a personal range.</div>`;
  return h+`</div>`;
}
/* ---- v11.34 — the 30-day resting HR is a CALIBRATION CONSTANT, not a daily input. ---- */
function rhrCard(){

/* ---- v11.19 LAYER 3 CARD — adaptation readout. Lives on the Test tab because it is

function benchCard(w){
  const L=benchList(), D=benchDelta(), due=benchDue(w);
  const n1=v=>v==null?"—":(Math.round(v*10)/10);
  const cn=benchClassName(), off=benchOffClass();
  let h=`<div class="card spine t1"><h3>Layer 3 · Adaptation readout${due?` <span class="tiertag T1">due</span>`:""}</h3>
  <div class="meta">Benchmark ride at weeks ${BENCH_WEEKS.join(", ")}. <b>Same Peloton class every time.</b> Three numbers, four times in the block.</div>
  <div class="banner ${due?"teal":""}" style="${due?"":"background:transparent;border:1px dashed var(--dim,#555)"}">
  <b>${due?`Week ${w+1} is a benchmark week.`:`Next benchmark: week ${BENCH_WEEKS.find(x=>x>w+1)||12}.`}</b>
  Heart rate during a session is an <i>input</i> — it records what you asked of the body, not what the body became. Adaptation is <b>more work at the same heart rate</b>, so it needs a work measurement. The bike has one. Kickboxing never will: it can deliver the stimulus but can never verify it.</div>`;

  /* ---- The pinned class. Set once, shown every time, auto-filled on entry. ---- */
  if(cn){

    <button onclick="benchClearClass()" class="mini" style="margin-left:6px">Change</button></div></div>`;
  } else {
    h+=`<div class="card" style="margin:8px 0 0;padding:10px 12px;background:transparent;border:1px solid var(--t2,#c93)">
    <div class="klabel" style="color:var(--t2)">No benchmark class chosen yet</div>
    <div class="mini" style="margin:4px 0 6px"><b>Pick one before the week-1 ride.</b> Without it there is no baseline, and Layer 3 sits dead for the whole block. Pick a class you would happily ride four times and <b>save it to a Peloton collection</b> so you are not hunting for it in October.</div>
    <input id="bnPin" type="text" placeholder="e.g. 45 min Power Zone Endurance — Matt Wilpers">
    <div style="margin-top:6px"><button onclick="benchSetClass()">Pin this class</button></div></div>`;
  }
  h+=`<details style="margin-top:8px"><summary class="mini"><b>How to choose the class</b></summary>
  <div class="mini" style="margin-top:6px">
  <b>Power Zone Endurance, 30–45 min.</b> Not PZ Max, and for a specific reason: the instructor pins your targets to your FTP, so <b>the class determines your output</b> — which leaves heart rate as the free variable. Adaptation shows up as the <i>same watts at a lower heart rate</i>, which is far cleaner than &ldquo;how hard did I decide to go today.&rdquo;<br><br>
  <b>The zone ceiling is the point, not a flaw.</b> Every zone below 7 has an upper bound as a percentage of FTP, so output <i>cannot</i> rise however fit you get — riding harder means leaving the zone and not doing the class. That makes this a <b>fixed-workload submaximal heart-rate test</b>, which is a long-standing method: hold a known power, read the heart rate, watch it fall. Output is the control variable. Heart rate is the measurement.<br><br>
  <b>What it costs you.</b> With output pinned, the &ldquo;more work at the same cost&rdquo; channel is unavailable here, and the whole signal rests on heart rate — which is noisy day to day (sleep, heat, caffeine, stress). So keep the conditions boring and repeatable, and do not over-read a single 2 bpm move. The uncapped channel needs Zone 7 / PZ Max work, which arrives with Layer 2.<br><br>
  <b>It should not be a hard session.</b> The measurement is meant to cost you nothing from the fatigue budget, and an endurance ride doubles as base volume — which you are currently short on after the on-ramp delivered about two-thirds of its planned Zone 2.<br><br>
  <b>Keep it repeatable.</b> Similar time of day, similar sleep, same strap every time. A Whoop-sleeve average and an H10 average are not the same quantity and must never be mixed in one trend.</div></details>`;

  if(off.length){
    h+=`<div class="banner amber" style="margin-top:8px"><b>${off.length} logged ride${off.length===1?" was":"s were"} on a different class</b> (${off.map(r=>r.date).join(", ")}). Those are not comparable to the rest — different structure, different output, for reasons unrelated to fitness. Either re-ride the pinned class or start a new baseline below.</div>`;
  }

      <div class="rx">${r.kj??"—"} kJ · ${r.hr??"—"} bpm${o!=null?` · <b>${n1(o)}</b> kJ/bpm`:""}${r.hrr!=null?` · HRR60 ${r.hrr}`:""}</div>
      <button onclick="benchDel(${i})" class="mini">×</button></div>`;});
  }
  if(D){
    const dr=benchDrift();
    /* HR FALLING at matched output is the signal. Note the sign: dHR negative is good. */

    const valid=!dr||dr.ok;
    h+=`<div class="banner ${!valid?"amber":(better?"teal":"amber")}" style="margin-top:8px">
    <b>${D.first.date} → ${D.last.date}</b><br>
    Avg HR <b>${D.dHR==null?"—":(D.dHR>0?"+":"")+n1(D.dHR)+" bpm"}</b> at

    ${D.dHRR==null?"":` · HRR60 ${(D.dHRR>0?"+":"")+n1(D.dHRR)} bpm`}
    <br><span class="mini">${

    if(valid)h+=`<div class="mini" style="margin-top:6px"><b>Note the ceiling.</b> Output barely moved because it <i>cannot</i> — every Power Zone below 7 has an upper bound, so riding harder means leaving the zone. That is by design here: output is the <b>control</b>, heart rate is the <b>signal</b>. The &ldquo;more work at the same cost&rdquo; channel needs a session with no ceiling (Zone 7 / PZ Max), which arrives with Layer 2.</div>`;
  } else if(L.length===1){
    h+=`<div class="mini" style="margin-top:8px">One benchmark logged. That is your baseline — the readout starts at the second.</div>`;
  }
  h+=`<div class="mini" style="margin-top:10px"><b>Log a benchmark</b>${cn?` — class auto-fills as <b>${cn}</b>, leave it blank`:""}</div>

   <div><label class="f">Avg HR (bpm)</label><input id="bnHR" type="number" inputmode="decimal"></div>
   <div><label class="f">HRR60 (bpm dropped)</label><input id="bnHRR" type="number" inputmode="decimal"></div>
  </div>
  <div style="margin-top:6px"><button onclick="benchAdd()">Save benchmark</button></div>
  <details style="margin-top:10px"><summary class="mini"><b>Where each number comes from</b></summary>
  <div class="mini" style="margin-top:6px">
  <b>Total Output (kJ)</b> — the post-ride summary screen, and in the CSV from your Peloton profile (Workouts → Download Workouts). <b>Per-interval watts are not exported</b> — the CSV carries Length, Type, Total Output and Avg Watts only, whole-ride. That is exactly why this is built on a repeated fixed class: identical structure makes whole-ride output comparable without needing splits.<br><br>
  <b>Avg HR</b> — same summary screen if the strap is paired, otherwise off the strap app. Use the <b>same instrument every time</b>; a Whoop-sleeve average and a chest-strap average are not the same quantity and must never be mixed in one trend.<br><br>
  <b>HRR60</b> — note HR the moment you stop the last hard effort, and again exactly 60 s later. Enter the <i>drop</i>. Costs you one minute of standing still. Faster recovery tracks aerobic fitness and is independent of the output measure, which is what makes it worth the minute.<br><br>
  <b>Same class, warm, similar time of day, similar sleep.</b> The comparison is only as good as the repeat. If you have to change class, start a new baseline rather than pretending the old one carries over.</div></details>

   Every item below is either WEEK-INDEXED (derived through calWeekOf/progStart, so it moves

const DUE_REG=[

   why:"Re-fits the readiness gate. The gate reads recovery live off the device every day, so this is not urgent — it only re-checks whether your p10 and median bands have moved enough to change where the gate fires."},

   why:"Re-fits planned session durations against what the sessions actually take, once there is a real block to measure. One checkpoint, not a recurring job."}

function dueStamp(k){return (Z.due||{})[k]||null;}

/* Days since the stamp, or null if never stamped. Elapsed-days items with no stamp are due
   on sight — "never backed up" is the strongest possible case for backing up. */
function dueAge(k,dISO){
  const s=dueStamp(k); if(!s)return null;
  return Math.round((new Date(dISO+"T00:00:00")-new Date(s+"T00:00:00"))/86400000);
}
function dueIsDue(it,dISO,w){
  if(it.weeks){                                  /* week-indexed */
    if(w==null||it.weeks.indexOf(w+1)<0)return false;
    const s=dueStamp(it.k);                      /* done already IN THIS WEEK? */
    return !(s&&calWeekOf(s)===w);
  }
  const a=dueAge(it.k,dISO);                     /* elapsed-days */
  return a===null||a>=it.every;
}
function dueList(dISO,w){return DUE_REG.filter(it=>dueIsDue(it,dISO,w));}

   whole version removing. */
function dueCard(dISO){
  const w=calWeekOf(dISO);

  if(!due.length){
    const nxt=DUE_REG.map(it=>{
      if(it.weeks){const n=it.weeks.find(x=>w!=null&&x>w+1);return n?`${it.n} · week ${n}`:null;}
      const a=dueAge(it.k,dISO); return a===null?null:`${it.n} · ${it.every-a}d`;
    }).filter(Boolean);
    return `<div class="card" style="padding:10px 12px;background:transparent;border:1px dashed var(--ok,#3a7)">
    <div class="klabel">Nothing due ✓</div>
    ${nxt.length?`<div class="mini" style="margin-top:4px">Next: ${nxt.join(" · ")}.</div>`:""}</div>`;
  }

  <div class="meta">Recurring work that does not belong to a training day, so nothing else on this tab would ever surface it.</div>`;
  due.forEach(it=>{
    const a=dueAge(it.k,dISO), s=dueStamp(it.k);
    const when=it.weeks?`week ${(w??0)+1}`
      :(a===null?"never done":`${a} days since ${fmtD(s)}`);
    h+=`<div class="row" style="align-items:flex-start"><div class="nm">${it.n}
      <div class="sup">${it.what}</div>

      <div class="sup" style="margin-top:3px"><b>${when}</b></div></div>
      <button class="btn sm" onclick="dueMark('${it.k}')">Done</button></div>`;
  });
  h+=`<div class="mini" style="margin-top:8px">“Done” stamps ${viewOff()?`<b>${fmtD(viewISO())}</b> — the date the cursor is on, not today`:"today"} and the item goes quiet until it comes round again.</div></div>`;

function setLoad(dISO,exKey,val){
  /* v11.23 — capture the layoff/return pair BEFORE the set is written, because writing it
     resets the decay clock and the prediction becomes unrecoverable.

     He asked whether the decay rate should learn from his own data. This is the honest
     version of that: RECORD the pairs, DISPLAY them, tune NOTHING. A self-fitting rate
     would train on 0-2 confounded observations per block — a return session is
     deliberately conservative and may be pain-inhibited, so the logged set understates
     capacity and reads as decay — and the estimate would feed the prescription that
     generates the next observation. Recorded, he can see whether 1.5%/wk ran fast or slow
     and change it deliberately. Same discipline as Z.aeroZ5: observe, display, gate nothing. */
  const base=MAINLIFT[exKey];
  if(base&&val!==""&&val!=null&&!isNaN(Number(val))&&ISO_RE.test(dISO)){
    const dk={boxsq:"d1",bench:"d2",trap:"d3"}[base];
    const D=decayFactor(dk,base,dISO);
    const already=(Z.layoffObs||[]).some(o=>o.date===dISO&&o.lift===base);
    const isTop=TOPKEY[base]===exKey;
    if(isTop&&D.days>DECAY_GRACE&&!already){
      const W=workingE1(base,dISO);                       /* the decayed prediction */
      const cal=calWeekOf(dISO), dkey2=DKEY[dayIdx(new Date(dISO+"T00:00:00"))];
      let actual=null;
      if(cal!=null&&dkey2===dk){
        const [,r,rir]=RX[Math.max(0,Math.min(11,cal))][dk][0];
        actual=Number(val)/pct1RM(r,rir);                 /* what the set actually says */
      }
      Z.layoffObs=Z.layoffObs||[];
      Z.layoffObs.push({date:dISO,lift:base,days:D.days,since:D.since,
        predicted:W?Math.round(W.e1):null, actual:actual?Math.round(actual):null,
        banked:(Z.base||{})[base]||null, lb:Number(val)});
    }
  }
  Z.lifts[dISO]=Z.lifts[dISO]||{};
  Z.lifts[dISO][exKey]=Z.lifts[dISO][exKey]||{};Z.lifts[dISO][exKey].w=val;save();}
/* v11.23 — the layoff/return ledger. Every row is one natural experiment the decay rule
   made a prediction about. It is DISPLAY ONLY: no code reads Z.layoffObs to compute
   anything, and qa23 asserts that changing these rows leaves every prescription identical.
   If a future session is tempted to fit DECAY_RATE to this table, read the caveat below
   first — the bias is structural, not noise. */
function layoffObsCard(){
  const obs=(Z.layoffObs||[]).filter(o=>o.predicted&&o.actual);
  if(!obs.length)return `<div class="card"><h3>Layoff calibration</h3>
    <div class="meta">Empty, which is the good outcome. Every time you log a top set after more than ${DECAY_GRACE} days off that lift, the row lands here: how long you were out, what the decay predicted, and what the bar actually said.</div>
    <div class="mini" style="margin-top:6px">The −${(DECAY_RATE*100).toFixed(1)}%/week rate is <b>inference, not a published figure</b>. This table is how it earns its keep or gets changed.</div></div>`;
  const rows=[...obs].reverse().map(o=>{
    const err=o.actual-o.predicted, pct=(err/o.predicted*100);
    const verdict=Math.abs(pct)<2?"about right":(pct>0?"decayed too fast":"decayed too slow");
    return `<div class="row"><div class="nm">${LIFTNAME[o.lift]||o.lift} · ${o.date}
      <div class="sup">${o.days} d out (since ${o.since}) · predicted <b>${o.predicted}</b> · actual <b>${o.actual}</b> from ${o.lb} lb — <b>${verdict}</b></div></div>
      <div class="rx" style="color:${Math.abs(pct)<2?"var(--ok,#3a7)":"var(--t2)"}">${pct>0?"+":""}${pct.toFixed(1)}%</div></div>`;}).join("");
  const mean=obs.reduce((a,o)=>a+(o.actual-o.predicted)/o.predicted,0)/obs.length*100;
  return `<div class="card"><h3>Layoff calibration <span class="chip">${obs.length} observation${obs.length===1?"":"s"}</span></h3>
  <div class="meta">What the decay predicted vs what the bar said, on every return from more than ${DECAY_GRACE} days off.</div>
  ${rows}
  <div class="mini" style="margin-top:8px">Mean error <b>${mean>0?"+":""}${mean.toFixed(1)}%</b>. Positive means you came back stronger than the rule assumed and −${(DECAY_RATE*100).toFixed(1)}%/week is too aggressive.</div>
  <div class="mini" style="margin-top:6px;opacity:.75"><b>Read these with the confound in front of you.</b> A first session back is deliberately submaximal and may be pain-inhibited, so <b>actual</b> systematically understates what you could have done — which makes the rule look more accurate than it is. Two or three clean observations are worth more than ten hurried ones. <b>This table changes nothing on its own; it is here so you can change the rate on purpose.</b></div></div>`;
}

function decorateCards(h,dISO){
  const parts=h.split('<div class="card');
  return parts.map((seg,i)=>{
    if(i===0)return seg;
    const doneM=seg.match(/class="ck on" data-ck="([^"]+)"/);
    const id=doneM?doneM[1]:null;
    const hasWhy=/class="[^"]*\bwhy\b/.test(seg);
    const open=id&&UI.open[dISO+":"+id];
    const why=UI.why[dISO+":"+i];
    let cls="";
    if(id&&!open)cls+=" collapsed";
    if(why)cls+=" showwhy";
    const hi=seg.indexOf("</h3>");
    if(hi>=0){
      const btns=(hasWhy?`<button class="cardbtn whybtn" onclick="event.stopPropagation();toggleWhy('${dISO}',${i})">${why?"hide why":"why"}</button>`:"")
                +(id?`<button class="cardbtn" onclick="event.stopPropagation();toggleCard('${dISO}','${id}')">${open?"collapse":"✓ done · open"}</button>`:"");
      seg=seg.slice(0,hi)+btns+seg.slice(hi);
    }
    return '<div class="card'+cls+seg;
  }).join("");
}

      absent. So the "audible + vibration alarms" line in the UI was simply false on the one
      device he uses, and the vibration fallback that was supposed to cover a failed beep
      could never have fired. Copy corrected; a VISUAL flash added as the real fallback.

      way. It was being created lazily inside beep(), which on the first call is inside the
      Start handler and should unlock — but nothing ever called resume(), so any later
      suspension (backgrounding, screen lock, iPadOS reclaiming audio) was permanent and
      silent. Now unlocked explicitly on Start and resumed before every cue.

      Control Centre mute silence it with no error and no indication.

   discovered mid-session: there is now a Test sound button, and it reports the context state
   rather than pretending. */

/* ===== v11.18 → v11.32: the ringer switch versus the music =====
   v11.18 beat the iOS ringer switch by forcing the page onto the PLAYBACK audio category —
   `navigator.audioSession.type="playback"` plus a looping near-silent <audio> element. It
   worked, and it had a cost that only showed up once music was involved (2026-09-14, first
   session of the block): PLAYBACK is a NON-MIXABLE category. Claiming it pauses whatever
   else is playing on the phone, and because a home-screen web app never fully unloads, iOS
   re-asserted the claim every time the app came back to the foreground — which is why
   OPENING the app killed the music, not only starting a timer.

   v11.32: the default is AMBIENT — mixes with other audio, never interrupts it, and is set
   on load and again on every pageshow/visibilitychange so a stale claim cannot survive a
   backgrounding. The silent-loop element is DELETED, not disabled: it was the mechanism
   that forced PLAYBACK, and a paused media element still counts toward the category.

  (()=>{const any=Object.keys(LG).some(k=>LG[k]>0);if(!any)return "";
   return `<div class="card"><h3>Logged, not programmed — Sunday lift, week ${w+1} <span class="chip" style="border-color:var(--warn);color:var(--warn)">logged</span></h3>

   ${Object.keys(LG).filter(k=>LG[k]>0).map(k=>`<div class="volrow"><div class="t"><span class="n">${MUS[k][0]}</span><span class="s">${LG[k]} logged sets · programmed ${tot[k].toFixed(1)}</span></div><div class="bar"><div class="fill" style="width:${Math.min(100,100*LG[k]/(MUS[k][3]*1.25))}%;background:var(--warn)"></div></div></div>`).join("")}</div>`;})()+
  (()=>{const gv=gluteVectors(w);const tot3=gv.V+gv.H+gv.L||1;const P=gmedProgrammed();const okL=gv.L>0,okH=gv.H>0;
   return `<div class="card"><h3>Glute vectors — Week ${w+1} <span class="chip ghost">Contreras</span></h3>
   <div class="meta">Three vectors, from the source read 2026-09-16: vertical (squat/lunge/hinge), horizontal (thrust/bridge), lateral/rotary (abduction in both planes + external rotation, one vector). Vertical is Biolayne's and is programmed; horizontal is the Booty Sprout plus the Monday frog pump; lateral/rotary is counted <b>only when ticked</b>, so a zero here means unticked, not unprogrammed.</div>
   ${[["Vertical / hinge",gv.V],["Horizontal / thrust",gv.H],["Lateral / rotary",gv.L]].map(([n,x])=>`<div class="volrow"><div class="t"><span class="n">${n}</span><span class="s">${x.toFixed(1)} sets</span></div><div class="bar"><div class="fill" style="width:${Math.min(100,100*x/tot3)}%;background:var(--z2)"></div></div></div>`).join("")}
   <div class="mini" style="margin:-4px 0 8px 12px">↳ abduction ${gv.abd.toFixed(1)} logged / ${P.abd} programmed · external rotation ${gv.er.toFixed(1)} / ${P.er} · side plank ${gv.plank.toFixed(1)} / ${P.plank} (0.5 per set [INF])</div>
   <div class="banner ${okL&&okH?"teal":""}" style="${okL&&okH?"":"background:transparent;border:1px dashed var(--dim,#555)"}"><b>Target for this block [INF]:</b> vertical is Biolayne's; horizontal and lateral/rotary <b>exist and are non-zero every week</b> — roughly 2–6 sets each, from the Booty Sprout, the pumpers, the activators, the band ER and the side plank. Contreras' 12/12/12 is a glute-specialisation template and is not the goal here; this is a small band, not a number pulled from the air.${okL&&okH?" Met this week.":" Not yet this week."}</div>
   <div class="mini why">Activators (Mon/Thu warm-up), pumpers (Mon frog pump, Thu banded abduction) and band ER (Mon/Thu) count 2 sets each when ticked. Pumpers are well short of failure by definition and are kept out of the glute-max bucket above. Copenhagen, lateral bounds and Markow side-lying work are deliberately not credited here.</div></div>`;})();
}

/* ---- Night tab: v11.24 — yin primary, kinstretch complement ---- */
function rNight(){
  const el=document.getElementById("v_night");
  const dow=dayIdx(today()),dISO=todayISO(),w=curWeek();
  const r=readyEff(dISO);   /* v11.34 */

  let gate="";
  if(isDown()||isDeloadWeek(w))gate=`<div class="banner teal"><b>${isDown()?"Down-week":"Deload-week"} gate:</b> Sleep + Breath tonight — down-regulate, don't chase range.</div>`;
  else if(r!==null&&r<=2)gate=`<div class="banner amber"><b>Readiness gate (≤2):</b> switched to Sleep + Breath — the yin habit survives a bad day, the intensity does not.</div>`;
  const picks=yinPicks(pool,3),pk=picks[0],alts=picks.slice(1);
  const hist=Z.yinHist||{};
  const row=(k,primary)=>{const v=YIN[k];const on=hist[k]===dISO;
    return `<div class="vlink"><span>${primary?"★ ":""}${v[0]} <span class="mini">~${v[1]}m${hist[k]&&!on?` · last ${hist[k]}`:""}</span></span>
    <span><a href="${v[2]}" target="_blank">Play ▸</a>
    <button class="btn sm ${on?"on":""}" onclick="togYin('${dISO}','${k}')">${on?"✓ done":"did it"}</button></span>${on?vRate('y_'+k):""}</div>`;};
  let h=gate;
  h+=`<div class="card spine t2"><h3>Yin — ${YIN_POOL_LABEL[pool]} <span class="tiertag T3">T3</span>${(Z.done[dISO]||{}).yin?' <span class="chip ghost">done tonight ✓</span>':''}</h3>
  <div class="meta">The nightly down-regulation slot (pliability replacement). Rotation moves only when you mark a video done — an unwatched pick stays first in line, so nothing repeats often enough to memorize. 1 primary + 2 alternates.</div>
  ${row(pk,true)}${alts.map(a=>row(a,false)).join("")}</div>`;
  if(YIN_LONG_DAYS.includes(dow)&&pool!=="sleep"){

    ${lp.map((k,i)=>row(k,i===0)).join("")}</div>`;

  const cat=kinComplement(dow,w,r);

  const poolK=TP[cat].vids.filter(k=>!usedThisWeek.has(k));
  const all=TP[cat].vids;

  const pick=poolK.length?poolK[seed]:all[0];
  const kalts=(poolK.length?poolK:all).filter(k=>k!==pick).slice(0,2);
  const vrow=(k,primary)=>{const v=V[k];const dd=usedThisWeek.has(k);
    return `<div class="vlink ${dd?"dedupe":""}"><span>${primary?"★ ":""}${v[0]}${dd?" · in this week's Markow rotation":""}</span><a href="${v[1]}" target="_blank">Play ▸</a></div>`;};
  h+=`<div class="card"><h3>Kinstretch pick — ${cat} <span class="chip ghost">~${TP[cat].min} min · optional</span></h3>
  <div class="meta">Complements tonight's yin region and is biased away from the week's most-loaded tissue — kinstretch is challenging, so it avoids what is already trained. Never owed; skip freely.</div>
  ${vrow(pick,true)}${kalts.map(a=>vrow(a,false)).join("")}
  <div style="margin-top:10px">${ckHTML(dISO,"night")}<span class="mini" style="margin-left:8px">Did the kin work</span></div></div>`;
  h+=`<div class="card"><h3>Yin library — go find something different</h3>
  ${["hips","lower","back","upper","global","sleep","long"].map(p=>`<details><summary>${YIN_POOL_LABEL[p]} <span class="mini">${(YIN_POOLS[p]||[]).length} sessions</span></summary>${(YIN_POOLS[p]||[]).map(k=>row(k,false)).join("")}</details>`).join("")}
  <div class="mini">"Lower Folds (unlabeled)" is the one video with no screenshot — identified from its frames only. Marking any library video done counts as tonight's yin and advances its rotation.</div></div>
  <div class="card"><h3>Kinstretch library by category</h3>
  ${Object.keys(TP).map(c=>`<details><summary>${c} <span class="mini">~${TP[c].min} min</span></summary>${TP[c].vids.map(k=>vrow(k,false)).join("")}</details>`).join("")}
  <div class="mini">GMB classes live in the GMB tab and count as Global work.</div></div>`;
  el.innerHTML=h;
}

/* ---- Testing / PRs ---- */
function rTest(){
  const el=document.getElementById("v_test");
  const s=mergedScreen();          /* v11.12: per-field, not last-record */
  const pv=latestScreen()||{};
  const gap=(a,p)=>(a!=null&&p!=null)?(p-a):null;
  const gL=gap(s.airL,s.irL),gR=gap(s.airR,s.irR);
  const L=loLast("L"),R=loLast("R");
  /* v11.12: kick height split. CAPACITY (kcap*) is the north star — best effort against a
     fixed marker. WORKING (kwrk*) is the habitual bag mark. They are different quantities
     and were being conflated; 45 in on the bag and a best-effort max are not comparable. */
  const kc=[...Z.screen].reverse().find(x=>x.kcapL!=null||x.kcapR!=null)||{};
  const kw=[...Z.screen].reverse().find(x=>x.kwrkL!=null||x.kwrkR!=null)||{};
  const bat=[...Z.screen].reverse().find(x=>x.flexL!=null||x.hamL!=null||x.addL!=null)||{};
  const best={};Z.prs.forEach(p=>{if(!best[p.lift]||p.e1>best[p.lift].e1)best[p.lift]=p;});
  const row=(lbl,val,sub)=>`<div class="row"><div class="nm">${lbl}${sub?`<div class="sup">${sub}</div>`:""}</div><div class="rx">${val}</div></div>`;
  const f=(id,lbl,v)=>`<div><label class="f">${lbl} (deg)</label><input type="number" id="${id}" inputmode="decimal" value="${v??""}"></div>`;
  const fk=(id,lbl,v)=>`<div><label class="f">${lbl}</label><input type="number" id="${id}" inputmode="decimal" value="${v??""}"></div>`;
  const w=curWeek();
  /* Retest every 4 weeks. This also keeps the tab week-aware — qa.js flags a tab that
     renders identically across all 12 weeks as "renders but never progresses". */
  const nextDue=[4,8,12].find(x=>w+1<=x)||12;

  const boundary=w>=10;
  el.innerHTML=`
  ${due?`<div class="banner teal"><b>Week ${w+1} — screen week.</b> Kick height (capacity), active and passive rotation, and the <b>F4F battery</b> — hip flexion, hamstring, adductor. Ankle DF only every 12 weeks now. About twenty minutes, <b>no barbell</b>.
       <span class="mini"><b>No strength retest MID-BLOCK.</b> Your programmed top sets already are the test — every one you log is an e1RM estimate, and the suggestions have been tracking it all along. Adding max attempts on top of a high-volume block buys a number you already have, at a fatigue cost you cannot afford. <b>Scoped 2026-08-24:</b> this rule previously extended to every week of the year, which also ruled out the case it was never arguing against — a re-test in a gap week, with no block volume to compete with, after a layoff has made the banked figure an extrapolation rather than an observation. That is what on-ramp 2 is for, and the fatigue argument does not reach it.</span></div>`
       :`<div class="mini" style="margin-bottom:8px">Week ${w+1}. Next screen: <b>week ${nextDue}</b>${nextDue-(w+1)>0?` — ${nextDue-(w+1)} week${nextDue-(w+1)===1?"":"s"} out`:""}. Measurements only, ~15 min, <b>no barbell</b>. <b>No strength retest MID-BLOCK</b> — the programmed top sets already are the test, and max attempts on top of a high-volume block buy a number you already have at a fatigue cost you cannot afford. <b>Scoped 2026-08-24:</b> a re-test in a gap week after a layoff is a different case and is not covered by this rule.</div>`}
  ${boundary?`<div class="banner amber"><b>Block boundary.</b> Weeks 11&ndash;12 already prescribe the heaviest top sets of the block (2&times;3 @ RIR 1&ndash;2, 88% of e1RM). <b>Those are your end-of-block numbers</b> — log them and the block closes itself out. Screen plus a kick-height check on top. No FTP test at the block boundary — a fresh FTP here would move the Power Zones underneath your last benchmark ride and make the two ends of the block incomparable. Re-test it between blocks, not inside one.</div>`:""}
  ${(w+1)===6?`<div class="banner amber"><b>Week 6 decision point.</b> If passive IR has not moved, stop spending the block chasing range — the lift-off number is the one that matters, and it can climb while passive ROM sits still.</div>`:""}
  <div class="card spine t1"><h3>Where you stand</h3>
  ${row("Kick height — the north star",(kc.kcapL!=null||kc.kcapR!=null)?`L ${kc.kcapL??"—"} / R ${kc.kcapR??"—"} in`:"not measured yet",
     "<b>Capacity</b> — best effort, fixed marker, warm, 3 attempts a side. Everything else is a proxy for this.")}
  ${(kw.kwrkL!=null||kw.kwrkR!=null)?row("Kick height — working",`L ${kw.kwrkL??"—"} / R ${kw.kwrkR??"—"} in`,
     `Habitual height on the bag · ${kw.date}. Centroid of many kicks on a surface that leans away, so it reads low. A floor, not a target.`):""}
  ${row("Lift-off — usable range",(L||R)?`L ${L?L.wt+"lb\u00d7"+L.reps:"—"} / R ${R?R.wt+"lb\u00d7"+R.reps:"—"}`:"nothing logged yet",
     "Logged as an exercise on Markow days, not here \u2014 like any lift. Ankle weight \u00d7 controlled reps.")}

  ${row("Bench e1RM",Math.round((workingE1("bench",todayISO())||{}).e1||0)||"—",(workingE1("bench",todayISO())||{}).src||"")}
  ${row("Trap bar e1RM",Math.round((workingE1("trap",todayISO())||{}).e1||0)||"—",(workingE1("trap",todayISO())||{}).src||"")}

  ${row("Hip rotation — active",s.airL!=null?`IR ${s.airL}/${s.airR} \u00b7 ER ${s.aerL??"—"}/${s.aerR??"—"}`:"not measured yet","")}
  ${(gL!=null||gR!=null)?row("<b>Active/passive gap</b>",`L ${gL??"—"}\u00b0 / R ${gR??"—"}\u00b0`,

  ${bat.date?row("F4F battery",`Flex ${bat.flexL??"—"}/${bat.flexR??"—"} \u00b7 Ham ${bat.hamL??"—"}/${bat.hamR??"—"} \u00b7 Abd ${bat.addL??"—"}/${bat.addR??"—"}`,`Live candidate limiters \u00b7 ${bat.date}`):""}
  ${row("Ankle DF",s.ankL!=null?`L ${s.ankL}\u00b0 / R ${s.ankR}\u00b0`:"—",

  <div class="mini" style="margin:4px 0 8px;opacity:.85">The date defaults to today and <b>will not accept a future one</b>. It is here because logging a session two days later should not date the observation two days late — that date starts the layoff-decay clock. It is typed on purpose and is <b>not</b> moved by the day cursor on Today.</div>

  <b>${inOnramp(todayISO())?"On-ramp 2 is the re-test window.":"Use this after a layoff, not mid-block."}</b>
  Box squat ${fmtD("2026-08-25")} &middot; bench ${fmtD("2026-08-27")} &middot; trap bar ${fmtD("2026-08-29")}, each a top triple at <b>RIR 1&ndash;2</b>.
  <span class="mini"><b>Not a 3RM.</b> Stop with one or two genuinely in reserve. A clean triple writes a perfectly good e1RM; a grinding one buys precision you do not need at a risk you do not have to take, a week after a lumbar recurrence. If the back objects, take RIR 3 and bank a smaller honest number — the rolling e1RM takes the best of your trailing 42 days <i>or</i> the baseline, so a conservative bank cannot cost you anything.</span></div>

    <div class="row" style="align-items:flex-end">

  <div class="mini" style="margin-top:8px"><b>This is a PREDICTED 1RM, not a demonstrated one \u2014 and that distinction matters.</b>

  <br><br><b>But the headline number does not set your loads \u2014 it cancels out.</b> The prescription is your test weight \u00d7 [pct(reps,RIR&nbsp;prescribed) \u00f7 pct(reps,RIR&nbsp;tested)]. For a week-1 triple at RIR 3 off a triple at RIR 2 that is \u00d70.972 regardless of formula: box squat 255\u2192248, bench 215\u2192209. Whether your true single is 251 or 235 changes neither. <b>The only input that actually matters is whether your RIR call was honest</b>, and the rolling e1RM re-derives itself from logged sets within two weeks either way.
  <br><br><b>Why these differ from the handoff numbers.</b> Box squat 255×3 and trap bar 285×3, both at RPE 8. Scored as Epley on reps performed that is 280 and 313 — which is how the bench was banked at 236. But every top set you <i>log</i> is scored on effective reps, reps + RIR, which for the same lifts gives <b>298, 333 and 251</b>. Two scales for one quantity, and a floor on the wrong scale is not a floor. These sit on the app’s own live scale. Day-one consequence: 248 lb on the box squat instead of 233, against a lift you just tripled at 255.</div>

  <div class="grid2">${f("irL","Hip IR — Left")}${f("irR","Hip IR — Right")}${f("erL","Hip ER — Left")}${f("erR","Hip ER — Right")}</div>
  <div class="klabel" style="margin-top:12px">Hip rotation \u2014 active</div>

  <div class="mini" style="margin-bottom:4px"><b>Reinstated 2026-08-09.</b> It was demoted for testing hip flexion, ER, hamstring and adductor when the limiter was assumed to be hip IR. Three findings since have inverted that reasoning: ankle DF is clear at 37/38\u00b0, there is no passive\u2013active gap at the hip, and the kick asymmetry runs the wrong way for a support-leg rotation story — the better-rotating right hip supports the <i>lower</i> kick. Those four measures are now the live candidates.</div>

  <div class="mini" style="margin-top:4px;opacity:.8">Defaults to today. Set it back if you are entering a screen you took earlier — the trend is read off these dates.</div>
  <button class="btn" style="margin-top:10px" onclick="saveScreen()">Save screen</button>
  <div class="mini" style="margin-top:6px">Leave anything blank that you did not measure.</div>
  </div>

  ${throwCard(w)}
  ${eliteCard()}
  ${layoffObsCard()}

  <div class="card"><h3>History</h3>
  <div class="meta">Newest first. <b>Never mix methods in one trend</b> — a self-measure and a PT measure are not the same number, and yours differed by 14&deg; on the right.</div>
  ${Z.screen.length?[...Z.screen].reverse().slice(0,8).map(x=>{
    const arc=(a,b)=>(a!=null&&b!=null)?`${a+b}\u00b0`:"—";
    return `<div class="row"><div class="nm">${x.date} <span class="chip">${x.method==="pt"?"PT":"self"}</span>
      <div class="sup">${x.irL!=null?`IR ${x.irL}/${x.irR}`:""}${x.erL!=null?` \u00b7 ER ${x.erL}/${x.erR}`:""}${x.airL!=null?` \u00b7 active IR ${x.airL}/${x.airR}`:""}${x.ankL!=null?` \u00b7 ankle ${x.ankL}/${x.ankR}`:""}${x.kickL!=null?` \u00b7 kick ${x.kickL}/${x.kickR}`:""}${x.kwrkL!=null?` \u00b7 working kick ${x.kwrkL}/${x.kwrkR}`:""}${x.flexL!=null?` \u00b7 F4F flex ${x.flexL}/${x.flexR}`:""}</div></div>
      <div class="rx">${(x.irL!=null&&x.erL!=null)?`arc ${arc(x.irL,x.erL)} / ${arc(x.irR,x.erR)}`:""}</div></div>`;}).join("")
    :`<div class="mini">No screens recorded yet.</div>`}
  </div>

  ${benchCard(w)}

  <div class="card"><h3>How to measure</h3>
  <details><summary><b>Hip rotation \u2014 passive and active</b></summary>
  <div class="mini" style="margin-top:6px">
  <b>Position.</b> Face down, one knee bent to 90&deg;, shin vertical, both hip bones flat. Prone, not seated \u2014 the standing-leg pivot happens near hip neutral, which is what prone tests. Seated tests a different capsular position; never compare across.<br><br>
  <b>Why record the whole arc.</b> <b>IR and ER trade off</b> around a total rotational range, so an IR number read alone is ambiguous — a small IR with a large ER is a distribution, not a restriction. Your PT measured the full arc for exactly this reason: 70&deg; left, 75&deg; right, with ER normal at 50&deg; bilaterally.<br><br>
  <b>Passive IR.</b> Let the shin fall <i>outward</i>, away from the midline. Loop a strap around the ankle and pull with steady tension until you meet a firm stop \u2014 a stop, not a stretch. <b>Do not use gravity alone</b>; it under-reads a firm end-feel by an unpredictable amount, which is why the self-measure and the PT differed by 14&deg; on the right.<br>
  <b>Passive ER.</b> Same setup, shin falls <i>inward</i>, across the midline.<br><br>
  <b>Active.</b> Identical positions, but <b>no strap and no hands</b>. Move the shin as far as you can under your own power and hold it there. That is your active range.<br><br>
  <b>Reading it.</b> Phone flat on the shin, angle off vertical. Book flat across the sacrum as a pelvic-lift alarm \u2014 if it shifts, the rep is void. Tripod photo at the stop, measure afterward.<br><br>
  <b>What the gap means.</b> Passive 50&deg; / active 30&deg; = 20&deg; you own but cannot command. That is end-range strength, and the loaded Markow work is the right answer. Passive 50&deg; / active 48&deg; = you are already using everything you have, and the ceiling is structural.</div></details>
  <details><summary><b>Kick height</b></summary>
  <div class="mini" style="margin-top:6px">Rear-leg chambered roundhouse against a wall, warm. Mark the highest clean contact where the chamber holds and the standing foot pivots properly. <b>Do not mark a kick you had to lean away from to make.</b> Photograph the mark. Film ten reps from behind at ~45&deg; \u2014 what your good kicks do differently is more informative than the number.</div></details>
  <details><summary><b>Ankle dorsiflexion</b></summary>
  <div class="mini" style="margin-top:6px">Weight-bearing lunge, barefoot, facing a wall, second toe in line with the knee. Drive the knee to the wall; <b>the heel must stay flat</b>. Slide the foot back until the knee only just reaches. Phone flat on the shin, angle off vertical. Single leg \u2014 do not let the back leg push you forward. This is the <b>weight-bearing lunge test</b>, the version the research uses; passive seated DF measures something you never use.<br><br>Worth the attention: ankle range responds to training better than any other joint, and eccentric-emphasis work carries the strongest effect of any modality (<b>g = 1.12</b>). Markow gives ankle and foot its own day from week 6.</div></details>
  <details><summary><b>What weight do I actually use?</b></summary>
  <div class="mini" style="margin-top:6px">Once the on-ramp gives you e1RMs, every main-lift row on Today shows a <b>suggested opening load</b> \u2014 e.g. &ldquo;start ~245 lb (86% of 285)&rdquo; \u2014 computed from your e1RM and that set&rsquo;s prescribed reps and RIR.<br><br>
  <b>It updates as you get stronger. You do not wait for a retest.</b> Every top set you log is itself an e1RM estimate (weight &divide; the %1RM that set represents), so a good day on week 3 raises the suggestions for week 4. The app takes the best of the last 6 weeks, floored at your on-ramp number \u2014 a light day never drags it down, because e1RM is a statement about capacity, not about average effort. <b>So there is no strength retest at all</b> &mdash; not at week 4, 8 or 12. Max or AMRAP attempts on top of an already high-volume block would cost real fatigue to produce a number the log already contains. Weeks 4/8/12 are <b>screen weeks</b>: kick height, rotation, ankle DF. Fifteen minutes, no barbell.<br><br>
  <b>Why you can&rsquo;t be marked down for following the program.</b> A session counts as a heavy exposure if it hit either &ge;80% of your working e1RM <i>or</i> &ge;97% of what the block prescribed that day. As written every top set here lands at 81&ndash;88%, so the two agree \u2014 but if the program ever prescribed lighter, doing it correctly would still count.<br><br>
  <b>It is a starting point, not a command.</b> RIR still governs the set: if 3 &times; 5 @ RIR 2 turns out to be RIR 0, the weight was wrong for today and the number in the app does not know that. Autoregulation is the design, and it is how the 4D Hybrid source is written.<br><br>
  Accessories get no suggestion \u2014 there is no e1RM for a machine row, and inventing one would be false precision.<br><br>
  <b>One consequence worth knowing:</b> the weekly scorecard now checks the load you log against 80% of e1RM before counting a session as a heavy exposure. A logged set under 80% does not count. That is the intensity rule with teeth rather than a slogan.</div></details>
  <details><summary><b>Strength \u2014 why a triple and not a max</b></summary>
  <div class="mini" style="margin-top:6px">Work to one hard triple at RPE 7\u20138 \u2014 a set of 3 with 1\u20132 clearly left. Epley: e1RM = weight &times; 1.1. That is accurate enough to program from at a fraction of the risk of a true max on a system with no scheduled deloads.</div></details>
  <details><summary><b>Conditioning</b></summary>
  <div class="mini" style="margin-top:6px">No FTP calculation in this app \u2014 removed 2026-08-03. Use Peloton and the Power Zone pack; they do it better and you already trust the number.<br><br>
  <b>Three layers, three different questions</b> (restructured 2026-08-14, because one number was being asked to do all three jobs and could only do the first):<br>
  <b>Layer 1 \u2014 maintenance floor.</b> Two days a week of \u226513 min above ${hrThreshold().t4} bpm, on Today. Hickson's dose. Tells you whether you <i>lost</i> anything. It cannot tell you whether you gained, and it was reading as a target when it is a floor.<br>
  <b>Layer 2 \u2014 stimulus delivery.</b> Three interval sessions a week for 3\u20136 weeks, on Today, dormant until switched on. Scored completed / not completed. Not scored on minutes, because time above a HR threshold is an unreliable proxy for time near VO2max and the error flips direction depending on whether you are running or cycling.<br>
  <b>Layer 3 \u2014 adaptation readout.</b> The benchmark ride above. The only one that answers whether any of it worked.</div></details>
  </div>

  <div class="card"><h3>Why the north star changed</h3>
  <div class="mini">It was passive hip IR. It is now <b>kick height</b>, with lift-off and the rear-view video as diagnostics.
  <details style="margin-top:6px"><summary>The four findings</summary>
  <div style="margin-top:6px">
  <b>1.</b> Opening the <i>entire</i> hip capsule in cadavers did not meaningfully increase internal rotation \u2014 only cam bone resection did (Ng 2019). The capsule restrains ER; bone and the ischiofemoral ligament restrain IR.<br>
  <b>2.</b> The hip &ldquo;capsular pattern&rdquo; is empirically invalid across 368 subjects (Bijl 1998, Kl&auml;ssbo 2003) \u2014 one study found 68 to 138 different patterns.<br>
  <b>3.</b> Minimum detectable change for hip IR is 6\u20139&deg; in a lab and 11\u201316&deg; with a phone. The gain you were chasing sits at or below the noise floor.<br>
  <b>4.</b> No literature establishes that passive hip IR limits a roundhouse at all. The kicking hip loads in flexion, abduction and external rotation.<br><br>
  Your X-ray showed no obvious bony lesion, but plain films cannot measure femoral version \u2014 that needs axial CT or MRI. The active-vs-passive gap answers the useful question without imaging: it measures the <i>trainable</i> part regardless of what the bone is doing.</div></details></div></div>`;
}
function rLog(){
  const el=document.getElementById("v_log");
  const ks=Object.keys(Z.readiness).sort().slice(-14);
  let spark="";
  if(ks.length>1){
    const vs=ks.map(k=>Z.readiness[k]);
    const pts=vs.map((v,i)=>`${(i/(vs.length-1)*300).toFixed(1)},${(42-(v-1)/4*38).toFixed(1)}`).join(" ");
    spark=`<svg class="spark" viewBox="0 0 300 44"><polyline points="${pts}" fill="none" stroke="#E0A458" stroke-width="2"/></svg>`;
  }
  /* this week's compliance vs tiers */
  const s=new Date(Z.start+"T00:00:00");s.setDate(s.getDate()+curWeek()*7);
  let t1=0,t1max=0,t2=0,t2max=0;
  for(let i=0;i<7;i++){
    const d=new Date(s);d.setDate(d.getDate()+i);const k=iso(d);const dn=Z.done[k]||{};
    if([0,2,3,4].includes(i)){t1max++;if(dn.str)t1++;}
    if(i===4){t1max++;if(dn.kick)t1++;}
    if(i===6){t1max++;if(dn.bjj)t1++;}
    if([0,1,3,5].includes(i)){t2max++;if(dn.markow)t2++;}   /* v11.32: Mon/Tue/Thu/Sat */
    if(i===1||i===5){t2max++;if(dn.cond_tue||dn.cond_sat)t2++;}
    if([0,2,3,4].includes(i)){t2max++;if(dn.core)t2++;}
    if(i===6){t2max++;if(dn.kotg)t2++;}
  }
  el.innerHTML=`
  <div class="card"><h3>Program</h3>
  <label class="f">Week 1 start date (Monday)</label>
  <input type="date" value="${Z.start}" onchange="setStart(this.value)">
  <div class="mini" style="margin-top:6px">${
    todayISO()<progStart()
      ? `Block has not opened yet — Week 1 begins <b>${fmtD(progStart())}</b>.`
      : `Currently <b>Week ${curWeek()+1} of 12</b>.`
  } This date drives the whole app: the Today card, the week grid, the exposure ledger, the benchmark-ride weeks and the week-4/8/12 screens. Nothing else holds a start date.</div>
  <div class="mini" style="margin-top:6px">Moving it <b>preserves everything you have logged</b> — readiness, lifts, HR, benchmarks are all keyed by calendar date. What resets is the periodization: which week the wave thinks you are in. Sessions logged before the new start date fall outside the block and stop counting toward the ledger, which is what you want after a layoff.</div>
  <div class="mini" style="margin-top:6px;opacity:.7">Set to a <b>Monday</b>. Any other weekday shifts the whole D1–D4 pattern off the week and the day-of-week prescriptions will not line up.</div>
  <label class="f">Decay anchor</label>
  <div class="mini">${decayAnchor()?`The e1RM layoff-decay clock for all three lifts cannot start before <b>${decayAnchor()}</b> (your instruction, 2026-09-14: reset all decay for the block). Banked test dates are unchanged. <button class="btn sm sec" style="margin-left:6px" onclick="Z.decayAnchor=null;save();render()">Clear anchor</button>`
    :`No anchor — the decay clock reads the last tested or logged date. <button class="btn sm sec" style="margin-left:6px" onclick="Z.decayAnchor=progStart();save();render()">Anchor at block start</button>`}</div>
  <label class="f">Today tab</label>
  <div class="mini">${isCompact()?"<b>Compact</b> — rationale prose hidden; each card has a <i>why</i> button.":"<b>Full text</b> — every card shows its rationale."} <button class="btn sm sec" style="margin-left:6px" onclick="toggleCompact()">Switch</button></div></div>
  <div class="card"><h3>Body weight</h3>
  <div class="meta">Feeds the protein line on Today (0.8 g/lb — inside the 1.6–2.4 g/kg range in the body-recomposition report). A measurement: dated, never moved by the day cursor.</div>
  <div class="grid2"><div><label class="f">Weight (lb)</label><input type="number" id="bwLb" inputmode="decimal" placeholder="lb"></div><div><label class="f">Date weighed</label>${obsDateInput("bwDate",' style="width:100%"')}</div></div>
  <div style="margin-top:6px"><button class="btn sm" onclick="addBodyWeight()">Save</button></div>
  ${(()=>{const H=((Z.nut||{}).hist||[]).filter(x=>x&&x.bw>0).slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,6);return H.length?H.map(x=>`<div class="row"><div class="nm">${fmtD(x.date)}</div><div class="rx">${x.bw} lb</div><button class="mini" onclick="delBodyWeight('${x.date}')">×</button></div>`).join(""):`<div class="mini" style="margin-top:6px">Nothing recorded yet.</div>`;})()}</div>
  <div class="card"><h3>Readiness — last 14 logged days</h3>${spark||'<div class="mini">Log readiness on the Today tab.</div>'}
  ${ks.slice().reverse().map(k=>`<div class="row"><div class="nm">${k}</div><div class="rx">${Z.readiness[k]} / 5</div></div>`).join("")}</div>
  <div class="card"><h3>This week's compliance</h3>
  <div class="grid2">
  <div class="stat"><div class="v">${t1}/${t1max}</div><div class="l">T1 — never cut</div></div>
  <div class="stat"><div class="v">${t2}/${t2max}</div><div class="l">T2 — protect</div></div></div>
  <div class="mini" style="margin-top:8px">End-of-week rule of thumb: advance at ≥3/4 strength + both anchors + ≥1 Z2 + avg readiness ≥3. Details on the Week tab.</div></div>
  <div class="card"><h3>Data</h3>
  <div class="mini">State lives in localStorage under <code>hybrid_v6_state</code>. Pushing a new <code>index.html</code> to the same GitHub Pages repo is safe — same origin, log intact.</div>
  <div class="banner amber" style="margin-top:8px"><b>There is no copy of this anywhere else.</b><br>
  <span class="mini">One phone, one browser, one origin. Safari clearing site data, a new phone, a repo rename or a custom domain each take the lot. <b>Copy the JSON and file it</b> — the archive is <code>database/logs/raw/</code>, and it has been empty since July.</span></div>
  <div class="mini" style="margin-top:6px"><b>Restoring:</b> paste a backup and it replaces what is here, so export the current state first if it holds anything you want. <i>Undo restore</i> holds exactly one step.</div>
  <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn sm sec" onclick="copyBackup()">Copy backup JSON</button>
    <button class="btn sm sec" onclick="restoreBackup()">Restore from backup</button>
    ${Z.rollback?`<button class="btn sm" onclick="undoRestore()">Undo restore</button>`:""}
  </div>
  <div class="mini" style="margin-top:8px">Weekly ritual, unchanged: copy the JSON on a Sunday and file it at <code>database/logs/raw/</code>. A restore is a recovery path, not a substitute for the archive.</div></div>`;
}

/* ================= v11.25 — BACKUP / RESTORE =================
   The app has always had a "Copy backup JSON" button and NO WAY BACK IN. An export with no
   import is an archive, not a recovery path, and it had been shipping like that since v9.

   No migration prompted this — the app is on GitHub Pages and always has been. What prompted
   it: `database/logs/raw/` has been EMPTY since 2026-07-27, so the weekly export ritual has
   never once run, and a single Safari storage clear would have taken every logged day with
   no way to put it back. The gap was real whether or not a host ever changed.

   Design rules, because this function can destroy the whole log:
     - It NEVER writes without an explicit confirm that names what is being replaced.
     - It stashes the pre-restore state at Z.rollback first, so one bad paste is undoable.
     - It validates the SHAPE before touching anything. A truncated clipboard paste is the
       expected failure mode here, not a hostile one.
     - It accepts either wrapper — {v9:{...}} as the export button writes it, or a bare
       state object — because the difference is invisible on a phone screen. */
function stateStats(v9){
  const n=o=>o&&typeof o==="object"?Object.keys(o).length:0;
  const days=new Set([...Object.keys(v9.done||{}),...Object.keys(v9.aero||{}),...Object.keys(v9.readiness||{}),...Object.keys(v9.lifts||{})]);
  const sorted=[...days].filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
  return {days:sorted.length, first:sorted[0]||null, last:sorted[sorted.length-1]||null,
          lifts:n(v9.lifts), screens:(v9.screen||[]).length, prs:(v9.prs||[]).length,
          bench:(v9.aeroBench||[]).length, start:v9.start||null};
}
function copyBackup(){
  const payload=JSON.stringify(S);
  const s=stateStats(S.v9||{});
  const done=()=>alert(`Copied ${payload.length.toLocaleString()} characters.\n\n${s.days} days logged`+
    (s.first?` (${s.first} → ${s.last})`:"")+`\n${s.lifts} lift days · ${s.screens} screens · ${s.bench} benchmark rides`+
    `\n\nPaste it somewhere durable before you close this.`);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(payload).then(done,()=>prompt("Copy this:",payload));
  } else prompt("Copy this:",payload);
}
function restoreBackup(){
  const raw=prompt("Paste the backup JSON copied from the OLD url.\n\nThis REPLACES everything currently logged here.");
  if(raw==null)return;
  const txt=raw.trim();
  if(!txt){alert("Nothing pasted. Nothing changed.");return;}
  let parsed;
  try{parsed=JSON.parse(txt);}
  catch(e){alert("That is not valid JSON — most likely the paste was truncated.\n\n"+e.message+"\n\nNothing was changed.");return;}
  /* Accept either wrapper. */
  const v9=(parsed&&typeof parsed==="object"&&parsed.v9&&typeof parsed.v9==="object")?parsed.v9:parsed;
  if(!v9||typeof v9!=="object"||Array.isArray(v9)){alert("That JSON is not an app state object. Nothing was changed.");return;}
  /* Shape check. Every real export carries at least one of these, and a state with none of
     them is either the wrong file or a fragment — refuse rather than wipe the log for it. */
  const marks=["done","aero","readiness","lifts","screen","prs","start"].filter(k=>k in v9);
  if(!marks.length){alert("That object has none of the app's state keys (done / aero / readiness / lifts / screen / prs / start).\n\nNothing was changed.");return;}
  const inc=stateStats(v9), cur=stateStats(Z);
  const msg=`RESTORE — this replaces the log on this device.\n\n`+
    `Incoming:  ${inc.days} days`+(inc.first?` (${inc.first} → ${inc.last})`:"")+`\n`+
    `           ${inc.lifts} lift days · ${inc.screens} screens · ${inc.bench} benchmark rides\n`+
    `           block start ${inc.start||"—"}\n\n`+
    `On this device now:  ${cur.days} days`+(cur.first?` (${cur.first} → ${cur.last})`:"")+`\n`+
    `           ${cur.lifts} lift days · ${cur.screens} screens · ${cur.bench} benchmark rides\n\n`+
    (cur.days>inc.days?`WARNING: this device currently holds MORE logged days than the backup. Restoring will lose the difference.\n\n`:"")+
    `Proceed?`;
  if(!confirm(msg))return;
  const rollback=JSON.parse(JSON.stringify(Z));   /* deep copy, so the undo cannot alias */
  S.v9=v9; localStorage.setItem(KEY,JSON.stringify(S));
  /* Reload so the init block runs over the imported state: it fills defaults for keys added
     since the export, and the migration ladder moves an old start date forward exactly once.
     Doing it in place would leave newer keys undefined. */
  try{
    const S2=JSON.parse(localStorage.getItem(KEY));
    S2.v9.rollback=rollback; localStorage.setItem(KEY,JSON.stringify(S2));
  }catch(e){}
  alert("Restored. Reloading.");
  location.reload();
}
function undoRestore(){
  if(!Z.rollback){alert("Nothing to undo.");return;}
  if(!confirm("Put back the state that was here before the restore?\n\nThe restored data will be discarded."))return;
  const back=Z.rollback; delete back.rollback;
  S.v9=back; localStorage.setItem(KEY,JSON.stringify(S));
  alert("Rolled back. Reloading.");
  location.reload();
}

buildTabs();render();
