<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1216">
<title>Hybrid Training</title>
<style>
:root{
  --bg:#0F1216; --panel:#161B21; --panel2:#1E252D; --line:#2A323C;
  --ink:#E8E4DA; --mut:#8A93A0; --dim:#5B6572;
  --t1:#E5484D; --t2:#E0A458; --t3:#5B6572;
  --z2:#4FA3A5; --good:#6BBF7B; --warn:#E0A458;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-bottom:40px}
.hdr{padding:calc(env(safe-area-inset-top) + 10px) 16px 6px}
.hdr .brand{font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;font-weight:700}
.hdr h1{margin:2px 0 0;font-size:26px;font-weight:800;letter-spacing:-.01em}
.hdr .sub{color:var(--mut);font-size:13px;margin-top:2px}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--mut)}
.chip.red{color:#fff;background:var(--t1);border-color:var(--t1)}
.chip.amber{color:#171308;background:var(--t2);border-color:var(--t2)}
.chip.teal{color:#06211f;background:var(--z2);border-color:var(--z2)}
.chip.ghost{color:var(--mut)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 12px;position:sticky;top:0;
  background:linear-gradient(var(--bg) 85%,transparent);z-index:50;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
  color:var(--mut);font-weight:700;font-size:13px;cursor:pointer;user-select:none}
.tab.on{background:var(--ink);color:#12161B;border-color:var(--ink)}
.view{display:none;padding:0 16px}
.view.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.spine{border-left:4px solid var(--t3)}
.card.spine.t1{border-left-color:var(--t1)}
.card.spine.t2{border-left-color:var(--t2)}
.card h3{margin:0 0 2px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .meta{color:var(--mut);font-size:12.5px;margin-bottom:8px}
.klabel{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800;margin:10px 0 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .nm{flex:1;font-size:14.5px}
.row .nm .sup{color:var(--dim);font-size:12px}
.row .rx{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.done .nm{color:var(--dim);text-decoration:line-through}
.win{width:62px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:6px 6px;font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
.ck{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel2);
  display:flex;align-items:center;justify-content:center;color:transparent;font-weight:900;flex:0 0 auto;cursor:pointer}
.ck.on{background:var(--good);border-color:var(--good);color:#0c1a10}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
  color:var(--mut);font-weight:800;font-size:15px;cursor:pointer}
.seg button.on{background:var(--ink);color:#12161B;border-color:var(--ink)}
.banner{border-radius:12px;padding:11px 13px;font-size:13.5px;margin-bottom:12px;border:1px solid}
.banner.red{background:rgba(229,72,77,.12);border-color:rgba(229,72,77,.5)}
.banner.amber{background:rgba(224,164,88,.12);border-color:rgba(224,164,88,.5)}
.banner.teal{background:rgba(79,163,165,.12);border-color:rgba(79,163,165,.5)}
.banner b{display:block;margin-bottom:2px}
.btn{display:inline-block;padding:10px 16px;border-radius:11px;background:var(--ink);color:#12161B;
  font-weight:800;font-size:14px;border:none;cursor:pointer}
.btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.red{background:var(--t1);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
input[type=number],input[type=date],select,input[type=text]{background:var(--panel2);border:1px solid var(--line);
  color:var(--ink);border-radius:10px;padding:9px 11px;font-size:15px;width:100%}
label.f{display:block;font-size:12px;color:var(--mut);font-weight:700;margin:10px 0 4px}
a{color:var(--z2);text-decoration:none;font-weight:600}
.vlink{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:10px}
.vlink:last-child{border-bottom:none}
.vlink.dedupe{opacity:.35;pointer-events:none}
.bar{height:14px;border-radius:7px;background:var(--panel2);position:relative;overflow:hidden;border:1px solid var(--line)}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--dim);opacity:.8}
.volrow{margin-bottom:11px}
.volrow .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.volrow .t .n{font-weight:700}
.volrow .t .s{color:var(--mut);font-variant-numeric:tabular-nums}
#tCard[data-flash]{animation:flashPulse .6s ease-out}
#tCard[data-flash="go"]{--fl:#3a7}
#tCard[data-flash="stop"]{--fl:#c93}
#tCard[data-flash="section"]{--fl:#49f}
@keyframes flashPulse{0%{box-shadow:0 0 0 0 var(--fl,#3a7);background:color-mix(in srgb,var(--fl,#3a7) 22%,transparent)}100%{box-shadow:0 0 0 14px transparent;background:transparent}}
.timerBig{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:6px 0}
.timerMove{text-align:center;font-size:20px;font-weight:800;min-height:28px}
.timerNext{text-align:center;color:var(--mut);font-size:13px;min-height:18px}
.timerPhase{text-align:center}
.tprog{height:6px;background:var(--panel2);border-radius:3px;margin:14px 0;overflow:hidden}
.tprog .f{height:100%;background:var(--z2)}
.trow{display:flex;gap:10px;justify-content:center;margin-top:14px}
details{margin-bottom:10px}
details summary{cursor:pointer;font-weight:800;padding:10px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"›";color:var(--dim);transform:rotate(90deg);font-size:18px}
details[open] summary:after{transform:rotate(-90deg)}
.mini{font-size:12.5px;color:var(--mut)}
.tinylist{font-size:13px;color:var(--mut);padding-left:16px;margin:4px 0}
.spark{width:100%;height:44px}
.assume li{margin-bottom:6px;font-size:13.5px}
.tiertag{font-size:10px;font-weight:900;letter-spacing:.08em;padding:1px 6px;border-radius:5px}
.tiertag.T1{background:var(--t1);color:#fff}
.tiertag.T2{background:var(--t2);color:#171308}
.tiertag.T3{background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.hr{height:1px;background:var(--line);margin:12px 0}
.wksel{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.wksel button{flex:0 0 auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--mut);font-weight:800;cursor:pointer}
.wksel button.on{background:var(--ink);color:#12161B}
.daysel{display:flex;gap:6px;margin-bottom:10px}
.daysel button{flex:1;padding:8px 0;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);font-weight:800;font-size:12px;cursor:pointer}
.daysel button.on{background:var(--ink);color:#12161B}
</style>
</head>

/* ============ RE-ENTRY ON-RAMP, Aug 11-16. Rewritten 2026-08-10. ============
   Six days of real training before the block opens Mon Aug 17. Not a taper, not a
   rehearsal, and no habit-coaching — he asked for training and this is training.

   TWO JOBS, in priority order.

   1. GET BACK ON THE BIKE. This is the domain furthest from baseline. Whoop shows one ride
      in the last eight weeks (Aug 4, 45 min) against a spring pattern of 65-95 min rides,
      and the handoff already records him at the bottom of his FTP post-layoff. Three Z2
      rides here, ~2.5 h total, is a real re-entry dose off a near-zero base without
      spiking it. Z2 is also the lowest-interference modality against lower-body strength —
      concurrent-training interference comes overwhelmingly from high-intensity and from
      high-eccentric running, not from steady-state cycling. So the aerobic work can be
      genuine without costing Monday anything.

   2. LIFT THE THREE MAINS ONCE EACH, FOR REAL, SEQUENCED BACKWARD OFF WEEK 1.
      DKEY puts D1 box squat on Mon, D2 bench on Wed, D3 trap bar on Thu. So:
        box squat Tue 11 -> D1 Mon 17   (6 days)
        bench     Thu 13 -> D2 Wed 19   (6 days)
        trap bar  Sat 15 -> D3 Thu 20   (5 days)
      Each lift gets most of a week before its block counterpart. Nothing is stacked
      against itself.

   INTENSITY: top triple at RIR 4, one notch under week 1's RIR 3, then two back-off
   triples about 5% lighter. That is genuinely working - 240x3 on the box squat is a real
   set - while leaving the week-1 numbers untouched for Monday. It also gives the block a
   clean opening progression: RIR 4 here, RIR 3 in week 1.

   WHAT IS DELIBERATELY ABSENT.
   - No testing. The Aug 6-8 window banked all of it.
   - No hard-aerobic target. Friday's class will produce whatever it produces; programming
     intervals on a detrained aerobic system four days before a 12-week block is the wrong
     trade. Base first. A PZ Max on Wednesday is offered, not prescribed.
   - No velocity or plyometric work. That is gated on readiness inside the block and has no
     business in a re-entry week.
   - No makeup work. His boundary, 2026-08-10: "I don't want to try to cram it in. I don't
     want to feed my instinct to make things up." Every day still has a floor, and nothing
     in this week can be failed.

   Kickboxing Friday 6:30 and BJJ Sunday are untouched - they are the two sessions his own
   log says he reliably keeps, and the week is built around them rather than over them. */
const ONRAMP=[
 {d:"2026-08-11",t:"Tue · box squat + first ride back",floor:"The top triple. Fifteen minutes if that is all there is.",items:[

  <div class="mini" style="margin-top:6px"><b>Record:</b> ankle weight in lb (0 if bodyweight) and the number of controlled reps you can hold the lift-off for. Left and right separately \u2014 they will not match and the difference is information.</div></div>`;
}

/* ============ v11.1: EXPOSURE LEDGER ============
   Robert's objection, 2026-08-03, and it was correct: grading the week does not
   stop the LOAD running ahead. RX[] was indexed purely on calendar week, so week 8
   prescribed week-8 loads whether or not weeks 5-7 happened.

   The resolution is that these are two different clocks and conflating them was
   the bug:
     THE CALENDAR is calendar-driven — week 8 arrives on week 8, nothing repeats,
     nothing is owed. That protects him from the felt-failure spiral.
     THE LOAD is exposure-driven — the weight on the bar reflects how many heavy
     exposures that lift has actually had.
   Grace of 1 week because 1-2 weeks off produces no measurable 1RM loss
   (Hortobagyi 1993) — the ledger should hold, not punish. */
const RX_GRACE=1;
function liftExposures(dkey,dISO){
  let n=0;const start=new Date(PROGRAM_START+"T00:00:00"),end=new Date(dISO+"T00:00:00");
  for(let d=new Date(start);d<end;d.setDate(d.getDate()+1)){
    const k=iso(d);
    if(DKEY[dayIdx(d)]!==dkey)continue;
    if((Z.done[k]||{}).str)n++;
  }
  return n;
}
/* Returns the RX row this lift has EARNED, plus how far behind the calendar it is. */
function rxWeek(dkey,w,dISO){
  if(!dISO||dISO==="preview")return {i:w,lag:0,exp:w,cal:w};
  const exp=liftExposures(dkey,dISO);
  const i=Math.max(0,Math.min(w,exp+RX_GRACE));
  return {i,lag:w-i,exp,cal:w};
}

/* ---- Aerobic qualification. Absolute bpm, never Whoop zone labels — Whoop
   recalibrated its max-HR estimate around Q1 2025 and the zone boundaries moved
   under 6 quarters of data. Karvonen off the CURRENT 30-day RHR so an elevated
   resting HR does not silently lower the bar. ---- */
const HRMAX=195;                  /* Whoop-derived. The observed 203 was a motion
                                     artifact: avg HR 138, only 3% of session in Z5. */
function hrThreshold(){const rhr=(Z.rhr||77);
  return {t4:Math.round(rhr+0.70*(HRMAX-rhr)), t5:Math.round(rhr+0.85*(HRMAX-rhr)), rhr:rhr};}
const AERO_MIN=13;                /* minutes above t4 for a session to qualify */
function aeroQualify(mins){return (mins||0)>=AERO_MIN;}
/* v11.13: Zone 2, logged but NOT gated.
   Band is 60-70% of max HR, a %max definition, deliberately NOT Karvonen. Karvonen at 60-70%
   of heart-rate RESERVE lands at 149-160 here, which collides with the hard threshold (160) —
   two different intensities would share a boundary and Z2 would stop meaning easy.
   These numbers will not match Morpheus's own Zone 2 readout (133-151 on Fri Aug 7): that band
   is recovery-adjusted and floats daily. Same disagreement as the High band, same reason.
   No weekly target is set here. The block uses Z2 strategically for aerobic base and recovery
   support; inventing a dose would be making one up. Log it, total it, decide later with data. */
function z2Band(){return {lo:Math.round(0.60*HRMAX), hi:Math.round(0.70*HRMAX)};}
/* ---- v11.21: minutes above 90% of max HR, and WHICH ACTIVITY produced them.
   Robert, 2026-08-14: log it on the high-intensity possibilities — BJJ, kickboxing, bag
   rounds, PZ and PZ Max — not on Zone 2 rides. Correct: a Z2 ride by definition never
   reaches here, so a Z5 box on it is a box that is always empty or always wrong.

   This is an OBSERVATION, not a gate, and must never become one. Time above 90% HRmax
   ranks interval protocols in the WRONG ORDER (Fleckenstein 2025, PMID 39835194: short
   intervals scored 50% higher on this metric while delivering LESS time above 90% VO2max),
   and it errs in the direction that flatters kickboxing — exactly the session we are least
   able to verify. It is logged because it answers a descriptive question nothing else can:
   does his combat work reach near-VO2max intensity AT ALL, and which modality gets there.
   BJJ in particular has been "unknown" in this project since July. ---- */
function z5Threshold(){return Math.round(0.90*HRMAX);}   /* 176 at HRMAX 195 */
const AERO_MODE={kick:"Kickboxing",bjj:"BJJ",bag:"Bag rounds",pz:"Power Zone",pzmax:"PZ Max",hiit:"Other HIIT"};
/* Minutes above 176 are a SUBSET of minutes above 160. If z5 > hard, one of the two was
   misread — flag it rather than storing a contradiction. */
function aeroZ5Bad(dISO){const hh=(Z.aero||{})[dISO], z=(Z.aeroZ5||{})[dISO];
  return (hh!=null&&z!=null&&z>hh);}
function median(a){if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y),m=Math.floor(s.length/2);
  return s.length%2?s[m]:(s[m-1]+s[m])/2;}
/* Per-modality rollup. Median, not mean — n is small and one outlier session should not
   move the answer to "does BJJ ever get hard." */
function aeroByMode(){
  const out={};
  Object.keys(AERO_MODE).forEach(k=>out[k]={n:0,hard:[],z5:[]});
  Object.keys(Z.aeroMode||{}).forEach(d=>{
    const k=Z.aeroMode[d]; if(!out[k])return;
    const hh=(Z.aero||{})[d], z=(Z.aeroZ5||{})[d];
    if(hh==null&&z==null)return;
    out[k].n++;
    if(hh!=null)out[k].hard.push(hh);
    if(z!=null)out[k].z5.push(z);
  });
  Object.keys(out).forEach(k=>{out[k].mHard=median(out[k].hard);out[k].mZ5=median(out[k].z5);});
  return out;}
function bagBlocks(minsSoFar){const d=Math.max(0,AERO_MIN-(minsSoFar||0));
  return d===0?0:d+2;}            /* 1 min hard / 1 min light; +2 for the ramp */

/* ============ v11.19 — THE THREE-LAYER AEROBIC MODEL ============
   Robert, 2026-08-14: "the 13-minute mark doesn't actually create an adaptation. It's
   just for maintenance, and what I'm looking to do is progress." Correct, and the app
   had been letting a maintenance floor read as a target. Three layers now, on three
   different jobs:

     LAYER 1  AERO_MIN / aeroQualify   maintenance floor    "did I lose anything"
     LAYER 2  VO2_PROTO / vo2*         stimulus delivery    "did I do the work"
     LAYER 3  BENCH_* / bench*         adaptation readout   "did it change anything"

   ---- LAYER 2. Scored COMPLETED / NOT COMPLETED. Never on minutes. ----
   Because time-above-a-HR-threshold is an unreliable proxy for time near VO2max AND
   the direction of the error flips with modality:
     Fleckenstein 2025, runners, PMID 39835194 — 30-s intervals gave 50% MORE time
       above 90% HRmax while giving LESS time above 90% VO2max than 3-min intervals.
     Almquist 2020, cyclists, PMID 32267032 — 30-s intervals gave MORE of both.
   A metric that changes sign with the vehicle cannot be a score. Prescribe structure,
   verify completion, measure adaptation separately in Layer 3.

   Intensity anchors to POWER ZONES, not %HRmax. Threshold-anchored prescription beat
   percentage-anchored prescription for VO2max gain in controlled comparison. Peloton
   Power Zones are FTP-anchored, so the vehicle he already owns is already the correct
   anchor, and the app still calculates no FTP of its own.

   Protocol is HIS choice, not the app's — the literature does not settle it, and the
   two best-evidenced options disagree BY MODALITY, which is a real fork rather than a
   gap to paper over. Both are offered with their evidence attached. */
const VO2_PROTO={
 "4x4":{n:"4 × 4 min — Norwegian",
   sess:"4 × 4 min @ PZ 5–6, 3 min active @ PZ 2 between",
   mins:25, work:"16 min of work",
   ev:"Hov 2023, PMID 36314990 — 48 well-trained men, 8 wk, 3×/wk, randomised. VO2max <b>+6.5%</b> vs +3.3% for 8×20 s and non-significant for 10×30 s. Stroke volume (O2-pulse) +8.1%. The best-validated aerobic-HIIT format there is. <b>Running study</b> — its SIT comparators were supramaximal (150–175% of maximal aerobic speed), so it does not test the 30/15 option below.",
   cue:"Interval 1 will not reach target HR however hard you ride — that is HR kinetics, not effort. Judge the session on intervals 2–4."},
 "30/15":{n:"30/15 short intervals — Rønnestad",
   sess:"3 sets × 13 × (30 s @ PZ 6 / 15 s @ PZ 2), 3 min easy between sets",
   mins:30, work:"19.5 min of work",
   ev:"Rønnestad 2015, PMID 24382021 — 10 wk, effort-matched, trained <b>cyclists</b>. VO2max <b>+8.7%</b> vs +2.6% for long intervals, ES 0.86–1.54 across power tests. Almquist 2020, PMID 32267032 — 14% higher mean power and 54% more time above 90% VO2max than 5-min intervals at matched RPE. Small n (9 v 7).",
   cue:"<b>Not all-out.</b> The 15 s recovery is deliberately too short to let VO2 fall — that IS the mechanism. Pace set 1 so set 3 is still complete. Blowing up in set 2 means you rode it as a sprint, which is the protocol Hov found inferior."},
 "pzmax":{n:"Peloton PZ Max — as programmed",
   sess:"Any PZ Max class; the class owns the structure",
   mins:30, work:"varies by class",
   ev:"No protocol-specific trial. Chosen for adherence, and because the Power Zone pack is FTP-anchored — the prescription method that outperformed percentage-anchoring. <b>Labelled best-practice, not evidence-matched.</b>",
   cue:"Read the class structure first. Efforts of 30–60 s make it a 30/15 analogue; 3–5 min efforts make it a 4×4 analogue. Either qualifies. A class that is mostly PZ 4 does not."}};
const VO2_SESS=3, VO2_WKMIN=3, VO2_WKMAX=6;
function vo2On(){return !!(Z.vo2&&Z.vo2.on);}
function vo2Proto(){return (Z.vo2&&VO2_PROTO[Z.vo2.proto])?Z.vo2.proto:"4x4";}
function vo2Done(){return (Z.vo2&&Z.vo2.done)?Z.vo2.done:{};}
function vo2WeekCount(dISO){const D=vo2Done();
  return weekBounds(dISO).reduce((a,k)=>a+(D[k]?1:0),0);}
function vo2BlockWeek(dISO){
  if(!vo2On()||!Z.vo2.start)return null;
  const d=Math.floor((new Date(dISO+"T00:00:00")-new Date(Z.vo2.start+"T00:00:00"))/864e5);
  return d<0?null:Math.floor(d/7)+1;}

/* ---- LAYER 3. The only layer that answers "am I getting the adaptation."
   Session heart rate is an INPUT: it records what you asked of the system, not what
   the system became. Adaptation is more work at the same heart rate, which requires a
   WORK measurement. The bike has one. Kickboxing never will — it can deliver the
   stimulus but can never verify it, and no app purchase changes that.

   Built on a REPEATED FIXED CLASS because Peloton does not export per-interval watts
   (the CSV carries Length, Type, Total Output, Avg Watts — whole-ride only). Same
   class every time makes Total Output comparable without needing splits.
   Four entries across 12 weeks, three fields each. ---- */
const BENCH_WEEKS=[1,4,8,12];
function benchDue(w){return BENCH_WEEKS.indexOf(w+1)>=0;}
function benchAll(){return (Z.aeroBench||[]).slice().sort((a,b)=>a.date<b.date?-1:1);}
/* Only records at or after the current baseline count toward the trend. Everything
   before it is still stored and still shown — it is history, not an error. */
function benchList(){const b=Z.benchBase;
  return benchAll().filter(r=>!b||r.date>=b);}
function benchClassName(){return (Z.benchClass&&Z.benchClass.name)?Z.benchClass.name:null;}
/* A record ridden on a DIFFERENT class than the pinned one is not comparable. Flag it
   rather than silently averaging it into the trend. */
function benchOffClass(){const n=benchClassName();if(!n)return [];
  return benchList().filter(r=>r.cls&&r.cls.trim()&&r.cls.trim()!==n.trim());}

/* ---- v11.20 — THE ZONE CEILING. Robert, 2026-08-14:
   "there's a ceiling to output in PZ classes because if you're at the top of your zone
   (other than zone 7 with no ceiling) you can't get any further output."

   Correct, and it changes what this measurement IS. In a Power Zone class the instructor
   prescribes a zone, and every zone below 7 has an upper bound as a % of FTP. Riding
   harder means leaving the zone, i.e. not doing the class. So output is not free to rise
   no matter how fit he gets — it is PINNED BY THE PRESCRIPTION.

   That does not break the benchmark. It reclassifies it. This is a FIXED-WORKLOAD
   SUBMAXIMAL HR TEST: hold a known power, read the heart rate. Output is the CONTROL
   VARIABLE, not the signal. Lower HR at the same watts is the adaptation. That is a
   long-standing and legitimate method.

   But it has a hard precondition the earlier framing hid: the comparison is only valid
   if output really was constant. If output drifted, an HR difference is confounded and
   means nothing. So we check, rather than assume.

   Consequence worth stating: with output pinned, output-per-beat degenerates to a
   restatement of heart rate. The "more work" channel needs a session with NO ceiling —
   Zone 7 / PZ Max — which is what Layer 2 provides once it is running. ---- */
const BENCH_DRIFT_PCT=5;   /* [INF] judgment call, not a published threshold. Same class
                              ridden honestly still varies a few % on cadence/resistance
                              choices; beyond ~5% the workload was materially different. */
function benchDrift(){
  const L=benchList(); if(L.length<2)return null;
  const a=L[0], b=L[L.length-1];
  if(a.kj==null||b.kj==null||!a.kj)return null;
  const pct=(b.kj-a.kj)/a.kj*100;
  return {pct:pct, ok:Math.abs(pct)<=BENCH_DRIFT_PCT};}
function benchOPB(r){return (r&&r.kj!=null&&r.hr)?(r.kj/r.hr):null;}
function benchDelta(){
  const L=benchList(); if(L.length<2)return null;
  const a=L[0], b=L[L.length-1], oa=benchOPB(a), ob=benchOPB(b);
  return {first:a,last:b,n:L.length,
    dKJ :(a.kj !=null&&b.kj !=null)? (b.kj-a.kj)   : null,
    dHR :(a.hr !=null&&b.hr !=null)? (b.hr-a.hr)   : null,
    dOPB:(oa!=null&&ob!=null)      ? ((ob-oa)/oa*100) : null,
    dHRR:(a.hrr!=null&&b.hrr!=null)? (b.hrr-a.hrr) : null};}

/* ---- Whoop readiness gate. Thresholds from HIS OWN 12-month distribution
   (recovery p10 = 28, median 57), not Whoop's generic bands, so the brake fires
   at ~10% of days rather than whatever Whoop's colour scheme implies. ---- */
const REC_GATE=28, REC_GREEN=57;
function whoopReady(dISO){const r=(Z.whoop||{})[dISO];return r&&r.rec!=null?r.rec:null;}
function velocityGated(dISO){const r=whoopReady(dISO);
  if(r!=null)return r<REC_GATE;              /* real data wins */
  const s=readiness(dISO); return isDown()||(s!==null&&s<=2);}  /* fall back to self-report */

/* ---- v10 additions ---- */
Z.mkMode=Z.mkMode||{};         /* dateISO -> 'full'|'med' for that day's Markow session */
if(Z.avail===undefined)Z.avail=null;

Z.whoop=Z.whoop||{};           /* v11 dateISO -> {rec, hrv, z4min} from the Whoop export */

Z.lo=Z.lo||{};                 /* v11.1 dateISO -> {L:{wt,reps},R:{wt,reps}} hip IR lift-offs */
if(Z.rhr===undefined)Z.rhr=79; /* v11.12 rolling 30-day resting HR, recomputed from the
                                  2026-08-09 export (median 79, mean 79.3 over 31 days). */

   Karvonen at rhr 77 gives t4 160.6, at rhr 79 gives 160.2, both round to 160. */
if(!Z.rhrMig1){if(Z.rhr===77)Z.rhr=79;Z.rhrMig1=true;}
Z.vrate=Z.vrate||{};           /* videoKey -> {r:1..5, date, n} difficulty rating */

if(!Z.seed0){

  /* PT-measured, passive with overpressure, full rotational arc. THIS is the baseline. */

/* v11.7: dynamic-effort bench. Agreed 2026-07-28, appears in the on-ramp, and was
   NEVER WIRED INTO THE BLOCK — Z.de was declared and read by nothing. Now on by default
   on D2, per Robert 2026-08-04.
   Westside-style speed work: 6x3 at 50% of e1RM, 45 s rest. Bar speed is the entire point.
   Deliberately excluded from the volume tab: 18 reps at 50% sits far below any hypertrophy
   threshold, and counting it would inflate the chest number for stimulus that is not there.

const DE={sets:6,reps:3,pct:0.50,rest:"45 s"};
Z.de=(Z.de===undefined)?true:Z.de;
Z.base=Z.base||null;           /* {boxsq,trap,bench,date} e1RMs from the on-ramp */
/* ============ v11.12: ON-RAMP BASELINES BANKED, 2026-08-09 ============
   Test window Aug 6-8 is complete. Seeded once, editable in the Test tab.

   CONVENTION, and it changed a documented number — read this before touching it.

   PERFORMED (215 * 1.1), ignoring RIR. But workingE1() scores every LOGGED top set

   Seeded on the app's own live convention so floor and rolling estimate agree:
     box squat 255x3 @ RIR 2 -> 298   (Epley-on-reps would have said 280)
     trap bar  285x3 @ RIR 2 -> 333   (Epley-on-reps would have said 313)
     bench     215x3 @ RIR 2 -> 251   (supersedes the banked 236)
   Sanity check on the practical consequence, week 1 D1 top set is 3 @ RIR 3:

   If Robert prefers the conservative numbers they are two taps in the Test tab. */
if(!Z.seed1){

  /* PT-measured 2026-08-06. Passive IR was not recorded that day — the 2026-07-30

    irL:null,irR:null,erL:50,erR:50,

    ankL:37,ankR:38,

  Z.screen.push({date:"2026-08-07",method:"self",

  Z.seed1=true;}
Z.aeroSrc=Z.aeroSrc||{};       /* v11.12 dateISO -> 'morpheus'|'whoop'|'other' */
Z.z2=Z.z2||{};                 /* v11.12a dateISO -> minutes in the Zone 2 band */

/* v11.19 LAYER 2 — VO2max block. Dormant by default; nothing renders until on=true. */
Z.vo2=Z.vo2||{on:false,proto:"4x4",start:null,done:{}};
/* v11.19 LAYER 3 — benchmark rides. [{date,cls,kj,hr,hrr}] */
Z.aeroBench=Z.aeroBench||[];
/* v11.20 — the CHOSEN class, pinned once. {name,set}. A benchmark you have to remember

if(Z.benchClass===undefined)Z.benchClass=null;
/* v11.20 — baseline start. Records before this date are excluded from the trend.
   Exists because an FTP change silently breaks the comparison: Power Zone targets are a

if(Z.benchBase===undefined)Z.benchBase=null;
/* v10: the block start is a fixed calendar date, not "most recent Monday".

Z.start=Z.start||PROGRAM_START;
if(Z.start!==PROGRAM_START&&!Z.startPinned)Z.start=PROGRAM_START;
function save(){S.v9=Z;localStorage.setItem(KEY,JSON.stringify(S));}
const iso=d=>d.toISOString().slice(0,10);
const today=()=>new Date();
/* v11.10: every user-facing date is now derived. Three separate hardcoded dates from
   three start-dates ago survived into v11.9 on the pre-on-ramp card and told Robert the
   on-ramp opened "Thu 2026-07-30". Nothing below may hardcode a date. */
const fmtD=s=>{const d=new Date(s+"T00:00:00");
  return isNaN(d)?s:`${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][(d.getDay()+6)%7]} ${s}`;};
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);};

function curWeek(){ /* 0..11, clamped */
  const s=new Date(Z.start+"T00:00:00");const n=today();

}
function ageYears(){const n=new Date();let a=n.getFullYear()-DOB.getFullYear();
  const m=n.getMonth()-DOB.getMonth();if(m<0||(m===0&&n.getDate()<DOB.getDate()))a--;return a;}
function readiness(dISO){return Z.readiness[dISO]||null;}
function isDown(){return Z.down&&todayISO()<=Z.down.until;}
function downSuggest(){ /* ≥3 consecutive declining days OR avg<3 over last 5 logged */
  const ks=Object.keys(Z.readiness).sort();if(ks.length<3)return false;
  const last=ks.slice(-5).map(k=>Z.readiness[k]);
  const l3=last.slice(-3);
  const declining=l3.length===3&&l3[0]>=l3[1]&&l3[1]>=l3[2]&&l3[0]>l3[2];

const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ================= TABS ================= */
const TABS=[["today","Today"],["week","Week"],["gmb","GMB"],["vol","Volume"],["night","Night"],["test","Test"],["log","Log"]];
let cur="today";
function buildTabs(){

/* ============ v11: WEEKLY MED SCORECARD ============
   Counts INTENSITY-QUALIFIED exposures, not sessions. A heavy triple at 85%
   counts; four sets at 70% does not. Protected compounds are D1 box squat,
   D2 bench, D3 trap bar — Robert's call 2026-08-03. D4 machine/hypertrophy is
   the flex day and is made up at the Sunday social lift. */
const COMPOUND=["d1","d2","d3"];
function weekBounds(dISO){const d=new Date(dISO+"T00:00:00");const off=(d.getDay()+6)%7;
  const s=new Date(d);s.setDate(d.getDate()-off);const out=[];
  for(let i=0;i<7;i++){const x=new Date(s);x.setDate(s.getDate()+i);out.push(iso(x));}return out;}
function weekScore(dISO){
  const days=weekBounds(dISO);
  let heavy=0,heavyV=0,heavyU=0,d4=0,aero=0,hipD=0,skill=0,plyo=0;
  days.forEach(k=>{
    const c=Z.done[k]||{};
    const dk=DKEY[dayIdx(new Date(k+"T00:00:00"))];
    if(c.str&&dk&&COMPOUND.includes(dk)){
      const cl=exposureClass(k,dk);
      if(cl==="heavy")heavyV++;          /* verified >=80% */
      else if(cl==="unlogged")heavyU++;  /* no load logged — counted, but not verified */
      if(cl!=="light")heavy++;           /* a logged sub-80% session does NOT count as heavy */
    }
    if(c.str&&dk==="d4")d4++;
    if(c.sunlift)d4++;                        /* D4 made up at the Sunday social lift — his call 2026-08-03 */
    if(c.markow)hipD++;
    if(c.kick)skill++; if(c.bjj)skill++;
    if(c.plyo)plyo+=60;                       /* one plyo block ~ 60 contacts */
    if(aeroQualify((Z.aero||{})[k]))aero++;
  });
  const st={strength:medStatus("strength",heavy),aerobic:medStatus("aerobic",aero),
            hip:medStatus("hip",hipD),power:medStatus("power",plyo),skill:medStatus("skill",skill)};
  /* Tier. HELD is the literature's maintenance floor — hitting it means you
     provably lost nothing, which is a real thing to be told on a bad week. */
  let tier="MISSED";
  if(heavy>=3&&aero>=2&&skill>=2)tier="FULL";
  else if(heavy>=2&&aero>=1&&skill>=1)tier="SOLID";
  else if(heavy>=1)tier="HELD";
  return {days,heavy,heavyV,heavyU,d4,aero,hipD,skill,plyo,st,tier,
          counts:{strength:heavy,aerobic:aero,hip:hipD,power:plyo,skill:skill}};
}
const TIERTXT={
 FULL:["Full week","3 compound days, 2 hard aerobic, 2 skill. Everything progressing."],
 SOLID:["Solid week","Above the maintenance floor everywhere that matters. This is a good week, not a compromise."],
 HELD:["Held","At least one heavy exposure. Per the evidence you lost nothing measurable — 1-2 weeks at this level costs no 1RM at all."],
 MISSED:["Below floor","No heavy exposure this week. One heavy triple at 80% is 12 minutes and fixes it."]};

/* ---- Adaptive layer. Replaces \"repeat the week\" with \"change next week.\"
   Weeks never repeat — progression is calendar-driven by design. What adapts is
   the prescription. ---- */
function domainTrend(dISO,dom,weeks){
  const out=[];for(let i=0;i<weeks;i++){out.push(weekScore(isoBack(dISO,i*7)).st[dom]);}return out;}
function adaptations(dISO){
  const A=[];
  ["strength","aerobic","hip","skill"].forEach(dom=>{
    const tr=domainTrend(dISO,dom,3);
    if(tr.length===3&&tr.every(x=>x===0))
      A.push({dom,act:"floor",msg:`<b>${MED[dom].n}</b> has been below its maintenance floor 3 weeks running. Next week this domain drops to the MED only — <i>${MED[dom].maintain.v} ${MED[dom].maintain.u}</i> — and the intensity is protected. Prescribing volume that is not happening is what makes a block feel like failure.`});
    else if(tr.length===3&&tr.every(x=>x===2))
      A.push({dom,act:"raise",msg:`<b>${MED[dom].n}</b> has been at its progression dose 3 weeks running. Room to add.`});
  });
  return A;
}
function scoreCard(dISO){
  const w=weekScore(dISO);
  /* v11.13: MISSED means "the week happened and nothing heavy was in it". On Monday and
     Tuesday the week has not happened yet, so the same state is just an empty scorecard.
     Calling it "Below floor" on the morning the block starts is both wrong and dispiriting.
     w.tier is untouched — only the wording — so nothing downstream of it moves. */
  const dw=(new Date(dISO+"T00:00:00").getDay()+6)%7;
  const early=w.tier==="MISSED"&&dw<=1&&!w.heavy&&!w.aero&&!w.skill;
  const T=early?["Week just started","Nothing logged yet \u2014 that is what a Monday looks like. The target is 3 compound days, 2 hard aerobic, 2 skill."]:TIERTXT[w.tier];
  const cls=early?"":(w.tier==="FULL"?"teal":(w.tier==="SOLID"?"teal":(w.tier==="HELD"?"amber":"red")));
  let h=`<div class="card spine t1"><h3>This week — ${T[0]}</h3>

  ["strength","aerobic","hip","power","skill"].forEach(k=>{
    const m=MED[k],s=w.st[k],c=w.counts[k];
    const dot="\u25cf", col=early?"var(--dim,#777)":(s===2?"var(--ok,#3a7)":(s===1?"var(--t2,#c93)":"var(--bad,#c44)"));
    h+=`<div class="row"><div class="nm"><span style="color:${col}">${dot}</span> ${m.n}

  const A=adaptations(dISO);
  if(A.length)h+=A.map(a=>`<div class="banner amber" style="margin-top:8px">${a.msg}</div>`).join("");
  h+=`<div class="mini" style="margin-top:8px"><b>Weeks never repeat.</b> Progression is calendar-driven. When a domain stalls, the prescription changes \u2014 the calendar does not.</div></div>`;
  return h;

  <div class="mini" style="margin-top:6px">
  <b>Power Zone Endurance, 30–45 min.</b> Not PZ Max, and for a specific reason: the instructor pins your targets to your FTP, so <b>the class determines your output</b> — which leaves heart rate as the free variable. Adaptation shows up as the <i>same watts at a lower heart rate</i>, which is far cleaner than &ldquo;how hard did I decide to go today.&rdquo;<br><br>
  <b>The zone ceiling is the point, not a flaw.</b> Every zone below 7 has an upper bound as a percentage of FTP, so output <i>cannot</i> rise however fit you get — riding harder means leaving the zone and not doing the class. That makes this a <b>fixed-workload submaximal heart-rate test</b>, which is a long-standing method: hold a known power, read the heart rate, watch it fall. Output is the control variable. Heart rate is the measurement.<br><br>
  <b>What it costs you.</b> With output pinned, the &ldquo;more work at the same cost&rdquo; channel is unavailable here, and the whole signal rests on heart rate — which is noisy day to day (sleep, heat, caffeine, stress). So keep the conditions boring and repeatable, and do not over-read a single 2 bpm move. The uncapped channel needs Zone 7 / PZ Max work, which arrives with Layer 2.<br><br>
  <b>It should not be a hard session.</b> The measurement is meant to cost you nothing from the fatigue budget, and an endurance ride doubles as base volume — which you are currently short on after the on-ramp delivered about two-thirds of its planned Zone 2.<br><br>
  <b>Keep it repeatable.</b> Similar time of day, similar sleep, same strap every time. A Whoop-sleeve average and an H10 average are not the same quantity and must never be mixed in one trend.</div></details>`;

  if(off.length){
    h+=`<div class="banner amber" style="margin-top:8px"><b>${off.length} logged ride${off.length===1?" was":"s were"} on a different class</b> (${off.map(r=>r.date).join(", ")}). Those are not comparable to the rest — different structure, different output, for reasons unrelated to fitness. Either re-ride the pinned class or start a new baseline below.</div>`;
  }
  if(Z.benchBase){
    h+=`<div class="mini" style="margin-top:8px">Trend measured from <b>${Z.benchBase}</b>. Earlier records are kept but excluded.
    <button onclick="benchClearBaseline()" class="mini" style="margin-left:6px">Undo</button></div>`;
  }
  if(L.length){
    h+=`<div class="mini" style="margin:8px 0 4px"><b>Logged benchmarks</b></div>`;
    L.forEach((r,i)=>{const o=benchOPB(r);
      h+=`<div class="row"><div class="nm">${r.date}${r.cls?` <span class="sup">${r.cls}</span>`:""}</div>
      <div class="rx">${r.kj??"—"} kJ · ${r.hr??"—"} bpm${o!=null?` · <b>${n1(o)}</b> kJ/bpm`:""}${r.hrr!=null?` · HRR60 ${r.hrr}`:""}</div>
      <button onclick="benchDel(${i})" class="mini">×</button></div>`;});
  }
  if(D){
    const dr=benchDrift();
    /* HR FALLING at matched output is the signal. Note the sign: dHR negative is good. */
    const better=D.dHR!=null&&D.dHR<0;
    const valid=!dr||dr.ok;
    h+=`<div class="banner ${!valid?"amber":(better?"teal":"amber")}" style="margin-top:8px">
    <b>${D.first.date} → ${D.last.date}</b><br>
    Avg HR <b>${D.dHR==null?"—":(D.dHR>0?"+":"")+n1(D.dHR)+" bpm"}</b> at
    ${D.dKJ==null?"—":(D.dKJ>0?"+":"")+n1(D.dKJ)+" kJ"} output${dr?` (${dr.pct>0?"+":""}${n1(dr.pct)}%)`:""}
    ${D.dHRR==null?"":` · HRR60 ${(D.dHRR>0?"+":"")+n1(D.dHRR)} bpm`}
    <br><span class="mini">${
      !valid
        ? `<b>Output drifted ${n1(Math.abs(dr.pct))}% — the HR comparison is confounded and should not be read.</b> This is a fixed-workload test: it only works if the workload was actually fixed. Either the class differed, the zones moved, or you rode it differently. Re-ride the pinned class before drawing any conclusion.`
      : D.dHR==null
        ? "Need avg HR on two benchmarks before this means anything."
      : better
        ? "<b>Lower heart rate at the same power. That is aerobic adaptation</b> — the standard fixed-workload reading. Faster HRR60 is the independent second confirmation."
        : "Heart rate has not fallen at matched power. Before concluding the block failed: same class, similar sleep, similar time of day, same strap? Heart rate is noisy day to day, and two points is a line, not a trend."}</span></div>`;
    if(valid)h+=`<div class="mini" style="margin-top:6px"><b>Note the ceiling.</b> Output barely moved because it <i>cannot</i> — every Power Zone below 7 has an upper bound, so riding harder means leaving the zone. That is by design here: output is the <b>control</b>, heart rate is the <b>signal</b>. The &ldquo;more work at the same cost&rdquo; channel needs a session with no ceiling (Zone 7 / PZ Max), which arrives with Layer 2.</div>`;
  } else if(L.length===1){
    h+=`<div class="mini" style="margin-top:8px">One benchmark logged. That is your baseline — the readout starts at the second.</div>`;
  }
  h+=`<div class="mini" style="margin-top:10px"><b>Log a benchmark</b> (today, ${todayISO()})${cn?` — class auto-fills as <b>${cn}</b>, leave it blank`:""}</div>
  <div class="grid2" style="margin-top:4px">
   <div><label class="f">Class ${cn?"(override only)":"(name or ID)"}</label><input id="bnClass" type="text" placeholder="${cn?cn:"e.g. 45 min Power Zone Endurance — Matt"}"></div>
   <div><label class="f">Total Output (kJ)</label><input id="bnKJ" type="number" inputmode="decimal"></div>
   <div><label class="f">Avg HR (bpm)</label><input id="bnHR" type="number" inputmode="decimal"></div>
   <div><label class="f">HRR60 (bpm dropped)</label><input id="bnHRR" type="number" inputmode="decimal"></div>
  </div>
  <div style="margin-top:6px"><button onclick="benchAdd()">Save benchmark</button></div>
  <details style="margin-top:10px"><summary class="mini"><b>Where each number comes from</b></summary>
  <div class="mini" style="margin-top:6px">
  <b>Total Output (kJ)</b> — the post-ride summary screen, and in the CSV from your Peloton profile (Workouts → Download Workouts). <b>Per-interval watts are not exported</b> — the CSV carries Length, Type, Total Output and Avg Watts only, whole-ride. That is exactly why this is built on a repeated fixed class: identical structure makes whole-ride output comparable without needing splits.<br><br>
  <b>Avg HR</b> — same summary screen if the strap is paired, otherwise off the strap app. Use the <b>same instrument every time</b>; a Whoop-sleeve average and a chest-strap average are not the same quantity and must never be mixed in one trend.<br><br>
  <b>HRR60</b> — note HR the moment you stop the last hard effort, and again exactly 60 s later. Enter the <i>drop</i>. Costs you one minute of standing still. Faster recovery tracks aerobic fitness and is independent of the output measure, which is what makes it worth the minute.<br><br>
  <b>Same class, warm, similar time of day, similar sleep.</b> The comparison is only as good as the repeat. If you have to change class, start a new baseline rather than pretending the old one carries over.</div></details>
  <div class="banner amber" style="margin-top:10px"><b>If your FTP changes mid-block, this comparison breaks.</b> Power Zone targets are a percentage of FTP, so a new FTP means the class prescribes different watts — and your output moves for a reason that has nothing to do with adaptation. This is the one thing that would silently poison the data rather than obviously breaking it.
  <div style="margin-top:6px"><button onclick="benchNewBaseline()">FTP changed — start a new baseline here</button></div></div>
  <div class="mini" style="margin-top:8px">No FTP test, ever. You are at the bottom of your FTP after the layoff and a retest now would only record the dip. Peloton owns that number.</div></div>`;
  return h;
}

function realityCard(dow){

   0:["Monday","evening","median start 18:20 · 3% of Monday sessions start before 9am · median 166 min across the day"],
   1:["Tuesday","night","median start 20:55 · your lightest real day, median 111 min"],
   2:["Wednesday","evening","median start 19:47 · <b>0%</b> of Wednesday sessions have ever started before 9am"],
   3:["Thursday","evening","median start 19:15 · 5% before 9am · median 133 min"],
   4:["Friday","morning","median start 07:54 · <b>68% before 9am</b> — your only genuine morning day, and the 6:30 class is why"],
   5:["Saturday","evening","median start 17:57 · median 109 min, your shortest day"],
   6:["Sunday","midday","median start 13:24 · anchored by BJJ at 13:41 · median 161 min"]}[dow];
  if(!R)return "";
  const rel=DOW_REL[dow];

    :rel.train>=50?"Middling. Shows up about half the time."
    :"<b>Fragile.</b> Over 7 months this weekday produced training less than 40% of the time.";
  return `<div class="card"><div class="klabel">What you actually do on ${R[0]}s</div>
  <div class="mini">Slot: <b>${R[1]}</b>. ${R[2]}.</div>
  <div class="banner ${risk}" style="margin-top:8px"><b>${rel.train}% of ${R[0]}s produced any training. ${rel.lift}% produced a lift.</b>

  <div class="mini" style="opacity:.75;margin-top:4px">From 339 logged sessions over ${rel.n} ${R[0]}s, Jan–Aug 2026. This is ad-hoc training, not a completed block — you have not finished a 12-week program in this range.</div></div>`;
}

/* ---- Nutrition ---- */
function weeklyVolume(w){
  const tot={};Object.keys(MUS).forEach(k=>tot[k]=0);
  ["d1","d2","d3","d4"].forEach(dk=>{
    EX[dk].forEach((e,i)=>{
      if(e.sup)return;
      let sets=RX[w][dk][i][0];
      if(i===1&&HEAVY_BO_DAYS.includes(dk))sets=Math.max(1,sets-hboTrade(w));   /* hypertrophy sets traded out */
      if(i===0&&HEAVY_BO_DAYS.includes(dk))sets+=heavyBO(w,dk).sets;   /* two heavy triples in */
      Object.keys(e.mus).forEach(m=>tot[m]+=sets*e.mus[m]);
    });
  });
  /* Sunday gap-fill defaults */
  const p=corePhase(w);
  tot.rdelt+=(p===2?4:3)+3;      /* rev pec deck + face pulls */
  tot.back+=0.75;                 /* face pull spill + CS row partial */
  /* Core, split by wall (evidence report). Anterior = dedicated RA/oblique work, phase-progressed.
     Posterior = light dedicated lateral/extension + fractional credit from box squat + trap bar. */
  tot.abs_ant+={0:12,1:14,2:15}[p];
  const bsqSets=RX[w].d1[0][0]+RX[w].d1[1][0];
  const tbSets =RX[w].d3[0][0]+RX[w].d3[1][0];
  tot.abs_post+=4+0.5*(bsqSets+tbSets);   /* 0.5 indirect/heavy compound set (Pelland accounting) */
  return tot;
}

  <div class="mini" style="margin-top:6px">
  <b>Position.</b> Face down, one knee bent to 90&deg;, shin vertical, both hip bones flat. Prone, not seated \u2014 the standing-leg pivot happens near hip neutral, which is what prone tests. Seated tests a different capsular position; never compare across.<br><br>
  <b>Why record the whole arc.</b> <b>IR and ER trade off</b> around a total rotational range, so an IR number read alone is ambiguous — a small IR with a large ER is a distribution, not a restriction. Your PT measured the full arc for exactly this reason: 70&deg; left, 75&deg; right, with ER normal at 50&deg; bilaterally.<br><br>
  <b>Passive IR.</b> Let the shin fall <i>outward</i>, away from the midline. Loop a strap around the ankle and pull with steady tension until you meet a firm stop \u2014 a stop, not a stretch. <b>Do not use gravity alone</b>; it under-reads a firm end-feel by an unpredictable amount, which is why the self-measure and the PT differed by 14&deg; on the right.<br>
  <b>Passive ER.</b> Same setup, shin falls <i>inward</i>, across the midline.<br><br>
  <b>Active.</b> Identical positions, but <b>no strap and no hands</b>. Move the shin as far as you can under your own power and hold it there. That is your active range.<br><br>
  <b>Reading it.</b> Phone flat on the shin, angle off vertical. Book flat across the sacrum as a pelvic-lift alarm \u2014 if it shifts, the rep is void. Tripod photo at the stop, measure afterward.<br><br>
  <b>What the gap means.</b> Passive 50&deg; / active 30&deg; = 20&deg; you own but cannot command. That is end-range strength, and the loaded Markow work is the right answer. Passive 50&deg; / active 48&deg; = you are already using everything you have, and the ceiling is structural.</div></details>
  <details><summary><b>Kick height</b></summary>
  <div class="mini" style="margin-top:6px">Rear-leg chambered roundhouse against a wall, warm. Mark the highest clean contact where the chamber holds and the standing foot pivots properly. <b>Do not mark a kick you had to lean away from to make.</b> Photograph the mark. Film ten reps from behind at ~45&deg; \u2014 what your good kicks do differently is more informative than the number.</div></details>
  <details><summary><b>Ankle dorsiflexion</b></summary>
  <div class="mini" style="margin-top:6px">Weight-bearing lunge, barefoot, facing a wall, second toe in line with the knee. Drive the knee to the wall; <b>the heel must stay flat</b>. Slide the foot back until the knee only just reaches. Phone flat on the shin, angle off vertical. Single leg \u2014 do not let the back leg push you forward. This is the <b>weight-bearing lunge test</b>, the version the research uses; passive seated DF measures something you never use.<br><br>Worth the attention: ankle range responds to training better than any other joint, and eccentric-emphasis work carries the strongest effect of any modality (<b>g = 1.12</b>). Markow gives ankle and foot its own day from week 6.</div></details>
  <details><summary><b>What weight do I actually use?</b></summary>
  <div class="mini" style="margin-top:6px">Once the on-ramp gives you e1RMs, every main-lift row on Today shows a <b>suggested opening load</b> \u2014 e.g. &ldquo;start ~245 lb (86% of 285)&rdquo; \u2014 computed from your e1RM and that set&rsquo;s prescribed reps and RIR.<br><br>
  <b>It updates as you get stronger. You do not wait for a retest.</b> Every top set you log is itself an e1RM estimate (weight &divide; the %1RM that set represents), so a good day on week 3 raises the suggestions for week 4. The app takes the best of the last 6 weeks, floored at your on-ramp number \u2014 a light day never drags it down, because e1RM is a statement about capacity, not about average effort. <b>So there is no strength retest at all</b> &mdash; not at week 4, 8 or 12. Max or AMRAP attempts on top of an already high-volume block would cost real fatigue to produce a number the log already contains. Weeks 4/8/12 are <b>screen weeks</b>: kick height, rotation, ankle DF. Fifteen minutes, no barbell.<br><br>
  <b>Why you can&rsquo;t be marked down for following the program.</b> A session counts as a heavy exposure if it hit either &ge;80% of your working e1RM <i>or</i> &ge;97% of what the block prescribed that day. As written every top set here lands at 81&ndash;88%, so the two agree \u2014 but if the program ever prescribed lighter, doing it correctly would still count.<br><br>
  <b>It is a starting point, not a command.</b> RIR still governs the set: if 3 &times; 5 @ RIR 2 turns out to be RIR 0, the weight was wrong for today and the number in the app does not know that. Autoregulation is the design, and it is how the 4D Hybrid source is written.<br><br>
  Accessories get no suggestion \u2014 there is no e1RM for a machine row, and inventing one would be false precision.<br><br>
  <b>One consequence worth knowing:</b> the weekly scorecard now checks the load you log against 80% of e1RM before counting a session as a heavy exposure. A logged set under 80% does not count. That is the intensity rule with teeth rather than a slogan.</div></details>
  <details><summary><b>Strength \u2014 why a triple and not a max</b></summary>
  <div class="mini" style="margin-top:6px">Work to one hard triple at RPE 7\u20138 \u2014 a set of 3 with 1\u20132 clearly left. Epley: e1RM = weight &times; 1.1. That is accurate enough to program from at a fraction of the risk of a true max on a system with no scheduled deloads.</div></details>
  <details><summary><b>Conditioning</b></summary>
  <div class="mini" style="margin-top:6px">No FTP calculation in this app \u2014 removed 2026-08-03. Use Peloton and the Power Zone pack; they do it better and you already trust the number.<br><br>
  <b>Three layers, three different questions</b> (restructured 2026-08-14, because one number was being asked to do all three jobs and could only do the first):<br>
  <b>Layer 1 \u2014 maintenance floor.</b> Two days a week of \u226513 min above ${hrThreshold().t4} bpm, on Today. Hickson's dose. Tells you whether you <i>lost</i> anything. It cannot tell you whether you gained, and it was reading as a target when it is a floor.<br>
  <b>Layer 2 \u2014 stimulus delivery.</b> Three interval sessions a week for 3\u20136 weeks, on Today, dormant until switched on. Scored completed / not completed. Not scored on minutes, because time above a HR threshold is an unreliable proxy for time near VO2max and the error flips direction depending on whether you are running or cycling.<br>
  <b>Layer 3 \u2014 adaptation readout.</b> The benchmark ride above. The only one that answers whether any of it worked.</div></details>
  </div>

  <div class="card"><h3>Why the north star changed</h3>
  <div class="mini">It was passive hip IR. It is now <b>kick height</b>, with lift-off and the rear-view video as diagnostics.
  <details style="margin-top:6px"><summary>The four findings</summary>
  <div style="margin-top:6px">
  <b>1.</b> Opening the <i>entire</i> hip capsule in cadavers did not meaningfully increase internal rotation \u2014 only cam bone resection did (Ng 2019). The capsule restrains ER; bone and the ischiofemoral ligament restrain IR.<br>
  <b>2.</b> The hip &ldquo;capsular pattern&rdquo; is empirically invalid across 368 subjects (Bijl 1998, Kl&auml;ssbo 2003) \u2014 one study found 68 to 138 different patterns.<br>
  <b>3.</b> Minimum detectable change for hip IR is 6\u20139&deg; in a lab and 11\u201316&deg; with a phone. The gain you were chasing sits at or below the noise floor.<br>
  <b>4.</b> No literature establishes that passive hip IR limits a roundhouse at all. The kicking hip loads in flexion, abduction and external rotation.<br><br>
  Your X-ray showed no obvious bony lesion, but plain films cannot measure femoral version \u2014 that needs axial CT or MRI. The active-vs-passive gap answers the useful question without imaging: it measures the <i>trainable</i> part regardless of what the bone is doing.</div></details></div></div>`;
}
function rLog(){
  const el=document.getElementById("v_log");
  const ks=Object.keys(Z.readiness).sort().slice(-14);
  let spark="";
  if(ks.length>1){
    const vs=ks.map(k=>Z.readiness[k]);
    const pts=vs.map((v,i)=>`${(i/(vs.length-1)*300).toFixed(1)},${(42-(v-1)/4*38).toFixed(1)}`).join(" ");
    spark=`<svg class="spark" viewBox="0 0 300 44"><polyline points="${pts}" fill="none" stroke="#E0A458" stroke-width="2"/></svg>`;
  }
  /* this week's compliance vs tiers */
  const s=new Date(Z.start+"T00:00:00");s.setDate(s.getDate()+curWeek()*7);
  let t1=0,t1max=0,t2=0,t2max=0;
  for(let i=0;i<7;i++){
    const d=new Date(s);d.setDate(d.getDate()+i);const k=iso(d);const dn=Z.done[k]||{};
    if([0,2,3,4].includes(i)){t1max++;if(dn.str)t1++;}
    if(i===4){t1max++;if(dn.kick)t1++;}
    if(i===6){t1max++;if(dn.bjj)t1++;}
    if([0,1,2,3].includes(i)){t2max++;if(dn.markow)t2++;}
    if(i===1||i===5){t2max++;if(dn.cond_tue||dn.cond_sat)t2++;}
    if([0,2,3,4].includes(i)){t2max++;if(dn.core)t2++;}
    if(i===6){t2max++;if(dn.kotg)t2++;}
  }
  el.innerHTML=`
  <div class="card"><h3>Program</h3>
  <label class="f">Week 1 start date (Monday)</label>
  <input type="date" value="${Z.start}" onchange="Z.start=this.value;save();render()">
  <div class="mini" style="margin-top:6px">Currently Week ${curWeek()+1} of 12. Restart preserves training history — periodization resets, adaptation doesn't.</div></div>
  <div class="card"><h3>Readiness — last 14 logged days</h3>${spark||'<div class="mini">Log readiness on the Today tab.</div>'}
  ${ks.slice().reverse().map(k=>`<div class="row"><div class="nm">${k}</div><div class="rx">${Z.readiness[k]} / 5</div></div>`).join("")}</div>
  <div class="card"><h3>This week's compliance</h3>
  <div class="grid2">
  <div class="stat"><div class="v">${t1}/${t1max}</div><div class="l">T1 — never cut</div></div>
  <div class="stat"><div class="v">${t2}/${t2max}</div><div class="l">T2 — protect</div></div></div>
  <div class="mini" style="margin-top:8px">End-of-week rule of thumb: advance at ≥3/4 strength + both anchors + ≥1 Z2 + avg readiness ≥3. Details on the Week tab.</div></div>
  <div class="card"><h3>Data</h3>
  <div class="mini">State lives in localStorage under <code>hybrid_v6_state</code> — logged data survives Netlify redeployments as long as the app URL stays the same.</div>
  <div style="margin-top:8px"><button class="btn sm sec" onclick="navigator.clipboard&&navigator.clipboard.writeText(JSON.stringify(S)).then(()=>alert('Copied state JSON'))">Copy backup JSON</button></div></div>`;
}

buildTabs();render();
</script>
