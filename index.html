<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1216">
<title>Hybrid v9</title>
<style>
:root{
  --bg:#0F1216; --panel:#161B21; --panel2:#1E252D; --line:#2A323C;
  --ink:#E8E4DA; --mut:#8A93A0; --dim:#5B6572;
  --t1:#E5484D; --t2:#E0A458; --t3:#5B6572;
  --z2:#4FA3A5; --good:#6BBF7B; --warn:#E0A458;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-bottom:40px}
.hdr{padding:calc(env(safe-area-inset-top) + 10px) 16px 6px}
.hdr .brand{font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;font-weight:700}
.hdr h1{margin:2px 0 0;font-size:26px;font-weight:800;letter-spacing:-.01em}
.hdr .sub{color:var(--mut);font-size:13px;margin-top:2px}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);color:var(--mut)}
.chip.red{color:#fff;background:var(--t1);border-color:var(--t1)}
.chip.amber{color:#171308;background:var(--t2);border-color:var(--t2)}
.chip.teal{color:#06211f;background:var(--z2);border-color:var(--z2)}
.chip.ghost{color:var(--mut)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 12px;position:sticky;top:0;
  background:linear-gradient(var(--bg) 85%,transparent);z-index:50;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
  color:var(--mut);font-weight:700;font-size:13px;cursor:pointer;user-select:none}
.tab.on{background:var(--ink);color:#12161B;border-color:var(--ink)}
.view{display:none;padding:0 16px}
.view.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.spine{border-left:4px solid var(--t3)}
.card.spine.t1{border-left-color:var(--t1)}
.card.spine.t2{border-left-color:var(--t2)}
.card h3{margin:0 0 2px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .meta{color:var(--mut);font-size:12.5px;margin-bottom:8px}
.klabel{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800;margin:10px 0 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .nm{flex:1;font-size:14.5px}
.row .nm .sup{color:var(--dim);font-size:12px}
.row .rx{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.done .nm{color:var(--dim);text-decoration:line-through}
.win{width:62px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:6px 6px;font-size:14px;text-align:center;font-variant-numeric:tabular-nums}
.ck{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel2);
  display:flex;align-items:center;justify-content:center;color:transparent;font-weight:900;flex:0 0 auto;cursor:pointer}
.ck.on{background:var(--good);border-color:var(--good);color:#0c1a10}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
  color:var(--mut);font-weight:800;font-size:15px;cursor:pointer}
.seg button.on{background:var(--ink);color:#12161B;border-color:var(--ink)}
.banner{border-radius:12px;padding:11px 13px;font-size:13.5px;margin-bottom:12px;border:1px solid}
.banner.red{background:rgba(229,72,77,.12);border-color:rgba(229,72,77,.5)}
.banner.amber{background:rgba(224,164,88,.12);border-color:rgba(224,164,88,.5)}
.banner.teal{background:rgba(79,163,165,.12);border-color:rgba(79,163,165,.5)}
.banner b{display:block;margin-bottom:2px}
.btn{display:inline-block;padding:10px 16px;border-radius:11px;background:var(--ink);color:#12161B;
  font-weight:800;font-size:14px;border:none;cursor:pointer}
.btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.red{background:var(--t1);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
input[type=number],input[type=date],select,input[type=text]{background:var(--panel2);border:1px solid var(--line);
  color:var(--ink);border-radius:10px;padding:9px 11px;font-size:15px;width:100%}
label.f{display:block;font-size:12px;color:var(--mut);font-weight:700;margin:10px 0 4px}
a{color:var(--z2);text-decoration:none;font-weight:600}
.vlink{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:10px}
.vlink:last-child{border-bottom:none}
.vlink.dedupe{opacity:.35;pointer-events:none}
.bar{height:14px;border-radius:7px;background:var(--panel2);position:relative;overflow:hidden;border:1px solid var(--line)}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--dim);opacity:.8}
.volrow{margin-bottom:11px}
.volrow .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.volrow .t .n{font-weight:700}
.volrow .t .s{color:var(--mut);font-variant-numeric:tabular-nums}
.timerBig{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:6px 0}
.timerMove{text-align:center;font-size:20px;font-weight:800;min-height:28px}
.timerNext{text-align:center;color:var(--mut);font-size:13px;min-height:18px}
.timerPhase{text-align:center}
.tprog{height:6px;background:var(--panel2);border-radius:3px;margin:14px 0;overflow:hidden}
.tprog .f{height:100%;background:var(--z2)}
.trow{display:flex;gap:10px;justify-content:center;margin-top:14px}
details{margin-bottom:10px}
details summary{cursor:pointer;font-weight:800;padding:10px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"›";color:var(--dim);transform:rotate(90deg);font-size:18px}
details[open] summary:after{transform:rotate(-90deg)}
.mini{font-size:12.5px;color:var(--mut)}
.tinylist{font-size:13px;color:var(--mut);padding-left:16px;margin:4px 0}
.spark{width:100%;height:44px}
.assume li{margin-bottom:6px;font-size:13.5px}
.tiertag{font-size:10px;font-weight:900;letter-spacing:.08em;padding:1px 6px;border-radius:5px}
.tiertag.T1{background:var(--t1);color:#fff}
.tiertag.T2{background:var(--t2);color:#171308}
.tiertag.T3{background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.hr{height:1px;background:var(--line);margin:12px 0}
.wksel{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.wksel button{flex:0 0 auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--mut);font-weight:800;cursor:pointer}
.wksel button.on{background:var(--ink);color:#12161B}
.daysel{display:flex;gap:6px;margin-bottom:10px}
.daysel button{flex:1;padding:8px 0;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);font-weight:800;font-size:12px;cursor:pointer}
.daysel button.on{background:var(--ink);color:#12161B}
</style>
</head>

/* RULE 2 conflict guard: never place a displaced session where it collides. */
function canDisplace(blk,dow,targetDow){
  if(targetDow===4||targetDow===6)return false;                 /* Fri kickboxing, Sun BJJ are anchors */
  if(blk==="str"){
    const heavy=[0,3];                                          /* Mon box squat, Thu trap bar */
    if(heavy.includes(dow)){                                    /* a heavy lower day being moved */
      if(heavy.includes(targetDow))return false;                /* never onto the other heavy day */
      if(heavy.some(h=>Math.abs(h-targetDow)<=1))return false;  /* nor within 48h of one */
    }
  }
  if(blk==="plyo"&&[0,3,5].includes(targetDow))return false;    /* plyos already live there */
  return true;

function domainDrift(dISO){
  const exp={},miss={};
  for(let i=1;i<=21;i++){

    const dw=(new Date(d+"T00:00:00").getDay()+6)%7;const done=Z.done[d]||{};

/* ---- v10 helpers ---- */
/* ===== Booty Sprout =====
   Bands on hand: 45 lb and 70 lb nominal. Exact count of each is unknown, so the
   picker takes a quantity of each rather than assuming an inventory.
   IMPORTANT: the printed rating is NOMINAL. A band delivers its rated tension only
   at one stretch length; on a Sprout, lockout tension is far above bottom tension.
   So this number is an ORDINAL marker for progression, not a real load. It is
   deliberately kept out of barbell tonnage and out of the volume model's load math.
   Sets still count normally toward the horizontal glute vector. */
const BS_BANDS=[45,70];
function bsLoad(c){return (c.b45||0)*45+(c.b70||0)*70;}
function bsLabel(c){const p=[];if(c.b45)p.push(`${c.b45}×45`);if(c.b70)p.push(`${c.b70}×70`);
  return p.length?p.join(" + ")+` = ${bsLoad(c)} lb nominal`:"no bands set";}
function bsLast(beforeISO){const ks=Object.keys(Z.bs).filter(d=>d<beforeISO).sort();
  return ks.length?Z.bs[ks[ks.length-1]]:null;}
function bsSet(dISO,f,v){Z.bs[dISO]=Z.bs[dISO]||{b45:0,b70:0,reps:"",pause:""};
  Z.bs[dISO][f]=(f==="reps"||f==="pause")?v:Math.max(0,(+v||0));save();render();}
/* Progression order is the author's: reps first, then tempo and pauses, then band tension. */
function bsNextStep(cur,prev){
  if(!prev)return "First logged session. Establish a rep baseline before changing anything.";
  const dL=bsLoad(cur)-bsLoad(prev);
  if(dL>0)return `Tension went up (${bsLoad(prev)} → ${bsLoad(cur)} nominal). Hold here and rebuild reps before adding more.`;
  const pr=parseInt(prev.reps)||0,cr=parseInt(cur.reps)||0;
  if(cr>pr)return "Reps are climbing. Keep going on reps until they stall.";
  if(cr&&cr<=pr&&!cur.pause)return "Reps have stalled. Next lever is tempo or a pause at lockout, not more band.";
  if(cr&&cr<=pr&&cur.pause)return `Reps stalled with a pause already in. Now add tension: next step up is ${bsLoad(cur)+45} or ${bsLoad(cur)+70} nominal.`;
  return "Log reps to get a progression call.";
}
function bootyRow(dISO,s,r,rir,editable){
  const cur=Z.bs[dISO]||{b45:0,b70:0,reps:"",pause:""},prev=bsLast(dISO);
  if(!editable)return `<div class="row"><div class="nm">Banded Hip Thrust — Booty Sprout<div class="sup">${bsLabel(cur)}</div></div><div class="rx">${s}×${r}${rir!=null?" · RIR "+rir:""}</div></div>`;
  return `<div class="row" style="display:block"><div class="nm">Banded Hip Thrust — Booty Sprout
    <div class="sup">${prev?`Last: ${bsLabel(prev)} · ${prev.reps||"—"} reps${prev.pause?" · "+prev.pause:""}`:"No prior session logged"}</div></div>
  <div class="rx" style="margin:4px 0">${s}×${r}${rir!=null?" · RIR "+rir:""}</div>
  <div class="grid2" style="margin-top:6px">
    <div><label class="f">45 lb bands</label><input type="number" min="0" inputmode="numeric" value="${cur.b45||0}" onchange="bsSet('${dISO}','b45',this.value)"></div>
    <div><label class="f">70 lb bands</label><input type="number" min="0" inputmode="numeric" value="${cur.b70||0}" onchange="bsSet('${dISO}','b70',this.value)"></div>
    <div><label class="f">Reps</label><input type="number" min="0" inputmode="numeric" value="${cur.reps||""}" onchange="bsSet('${dISO}','reps',this.value)"></div>
    <div><label class="f">Pause / tempo</label><input type="text" placeholder="e.g. 2s lockout" value="${cur.pause||""}" onchange="bsSet('${dISO}','pause',this.value)"></div>
  </div>

  <div class="mini" style="color:var(--t2)">→ ${bsNextStep(cur,prev)}</div>
  <div class="mini">Nominal rating only. Band tension varies through the range, so this orders your progression but is not comparable to barbell load and is excluded from tonnage.</div>
  </div>`;
}

    });

    h+=`<div class="klabel" style="margin-top:10px">T2/T3 missed — absorb, no action</div>

  return h;
}

/* ---- GMB timer ---- */
let T={seq:[],i:0,left:0,run:false,int:null,cls:null};
function buildSeq(cls,dur){
  const c=GMB[cls][dur];const seq=[];
  [["P","PREPARE"],["R","PRACTICE"],["Y","PLAY"]].forEach(([k,lab])=>{
    c[k].forEach(m=>{
      if(m[2]){seq.push({n:m[0]+" — Left",s:m[1],ph:lab});seq.push({n:m[0]+" — Right",s:m[1],ph:lab});}
      else seq.push({n:m[0],s:m[1],ph:lab});
    });
  });
  return seq;
}
let AC=null;
function beep(n){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();
      o.connect(g);g.connect(AC.destination);o.frequency.value=880;
      const t=AC.currentTime+i*0.22;g.gain.setValueAtTime(0.001,t);
      g.gain.exponentialRampToValueAtTime(0.4,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
      o.start(t);o.stop(t+0.2);}
  }catch(e){}
  if(navigator.vibrate)navigator.vibrate(n===3?[150,80,150,80,300]:[120,60,120]);
}
let wl=null;
async function wake(on){try{if(on&&"wakeLock" in navigator)wl=await navigator.wakeLock.request("screen");
  else if(wl){wl.release();wl=null;}}catch(e){}}
function gmbStart(cls){
  T.cls=cls;T.seq=buildSeq(cls,Z.gmb.dur);T.i=0;T.left=T.seq[0].s;T.run=true;
  clearInterval(T.int);T.int=setInterval(tick,1000);beep(2);wake(true);render();
}
function tick(){
  if(!T.run)return;
  T.left--;
  if(T.left<=0){
    const prevPh=T.seq[T.i].ph;T.i++;
    if(T.i>=T.seq.length){beep(3);gmbStop();
      Z.gmb["on_"+todayISO()]=true;Z.done[todayISO()]=Z.done[todayISO()]||{};Z.done[todayISO()].gmb=true;save();render();return;}
    T.left=T.seq[T.i].s;
    beep(T.seq[T.i].ph!==prevPh?3:2);
  }
  if(cur==="gmb")updTimer();
}
function gmbStop(){T.run=false;clearInterval(T.int);T.int=null;wake(false);}
function gmbPause(){T.run=!T.run;render();}
function gmbSkip(d){T.i=Math.max(0,Math.min(T.seq.length-1,T.i+d));T.left=T.seq[T.i].s;beep(1);render();}
function updTimer(){
  const m=T.seq[T.i];if(!m)return;
  document.getElementById("tBig").textContent=fmtT(T.left);
  document.getElementById("tMove").textContent=m.n;
  document.getElementById("tPh").innerHTML=`<span class="chip teal">${m.ph}</span> <span class="mini">${T.i+1}/${T.seq.length}</span>`;
  const nx=T.seq[T.i+1];
  document.getElementById("tNext").textContent=nx?("Next: "+nx.n):"Last movement";
  const total=T.seq.reduce((a,b)=>a+b.s,0),done=T.seq.slice(0,T.i).reduce((a,b)=>a+b.s,0)+(m.s-T.left);
  document.getElementById("tFill").style.width=(100*done/total)+"%";
}

  }
  const weeksSince=n.hist.length?Math.floor((new Date()-new Date(n.hist[n.hist.length-1].d))/(7*86400000)):99;
  let recal=weeksSince>=2?`<div class="banner amber"><b>Re-enter BW + BF% (last entry ${weeksSince>50?"never":weeksSince+" wk ago"}).</b> Weight trend is the feedback loop — you don't track macros, so if the trend misses the target rate, nudge the <b>activity multiplier</b> (not the deficit) and recompute.</div>`:"";
  let spark="";
  if(n.hist.length>1){
    const ws=n.hist.map(x=>+x.bw);const mn=Math.min(...ws),mx=Math.max(...ws),rg=(mx-mn)||1;
    const pts=ws.map((v,i)=>`${(i/(ws.length-1)*300).toFixed(1)},${(40-((v-mn)/rg)*36).toFixed(1)}`).join(" ");

/* ---- Volume ---- */
let volWk=null;
function weeklyVolume(w){
  const tot={};Object.keys(MUS).forEach(k=>tot[k]=0);
  ["d1","d2","d3","d4"].forEach(dk=>{
    EX[dk].forEach((e,i)=>{
      if(e.sup)return;
      let sets=RX[w][dk][i][0];
      if(e.se&&Z.se[e.k])sets+=Z.se[e.k];
      Object.keys(e.mus).forEach(m=>tot[m]+=sets*e.mus[m]);
    });
  });
  /* Sunday gap-fill defaults */
  const p=corePhase(w);
  tot.rdelt+=(p===2?4:3)+3;      /* rev pec deck + face pulls */
  tot.back+=0.75;                 /* face pull spill + CS row partial */
  /* Core, split by wall (evidence report). Anterior = dedicated RA/oblique work, phase-progressed.
     Posterior = light dedicated lateral/extension + fractional credit from box squat + trap bar. */
  tot.abs_ant+={0:12,1:14,2:15}[p];
  const bsqSets=RX[w].d1[0][0]+RX[w].d1[1][0];
  const tbSets =RX[w].d3[0][0]+RX[w].d3[1][0];
  tot.abs_post+=4+0.5*(bsqSets+tbSets);   /* 0.5 indirect/heavy compound set (Pelland accounting) */
  return tot;
}
function rVol(){
  const el=document.getElementById("v_vol");
  const w=volWk===null?curWeek():volWk;
  const tot=weeklyVolume(w);
  let rows="";
  Object.keys(MUS).forEach(k=>{
    const [nm,mev,mav,mrv]=MUS[k];const v=tot[k];
    const max=mrv*1.25;const pct=Math.min(100,100*v/max);
    let col="var(--good)",flag="";
    if(v<mev){col="var(--t2)";flag=" · under MEV";}
    else if(v>mrv){col="var(--t1)";flag=" · over MRV";}
    else if(v>mav){col="var(--t2)";flag=" · MAV→MRV watch";}
    if(k==="rdelt"&&v>=mev)flag=" · Sunday block filling the hole ✓";
    if(k==="abs_post"&&v>=mev)flag=" · box squat + trap bar credited ✓";
    rows+=`<div class="volrow"><div class="t"><span class="n">${nm}</span><span class="s">${v.toFixed(1)} sets${flag}</span></div>
    <div class="bar"><div class="fill" style="width:${pct}%;background:${col}"></div>
    <div class="tick" style="left:${100*mev/max}%"></div><div class="tick" style="left:${100*mav/max}%"></div><div class="tick" style="left:${100*mrv/max}%"></div></div></div>`;
  });
  el.innerHTML=`<div class="card"><h3>Combined weekly volume — Week ${w+1}</h3>
  <div class="meta">Mains + accessories + Sunday block + core, fractional counting. Ticks = MEV / MAV / MRV (masters-adjusted — practical MRV runs lower with kicks, BJJ, and plyos on top). Kicks/BJJ/KOTG are background load not counted here: read quads/glutes conservatively.</div>

  ${rows}
  <div class="mini">Overshoot watch: quads / glutes / arms. Undershoot flag: rear delt — owned by the Sunday block. Core is split by wall: anterior (RA/obliques) is trained directly for aesthetics; posterior (ES/MF/QL) is largely paid by box squat + trap bar, so dedicated low-back work stays minimal.</div></div>`;

function ftpEstimate(){
  const E=Z.effort,have=k=>E[k]&&E[k].w;
  if(have("20"))return {est:Math.round(E["20"].w*0.95),method:"0.95 × 20-min power"};
  const bk=[["1",60],["5",300],["20",1200]].filter(([k])=>have(k));
  if(bk.length>=2){const [s,l]=bk.slice(-2);
    const t1=s[1],P1=E[s[0]].w,t2=l[1],P2=E[l[0]].w;
    const Wp=(P1-P2)*t1*t2/(t2-t1),CP=P1-Wp/t1;
    return {est:Math.round(CP),method:`Critical-Power fit (${s[0]}+${l[0]} min)`};}
  return {est:null,method:null};
}
function logEffort(){const d=document.getElementById("effdur").value,w=+document.getElementById("effw").value;if(!w)return;Z.effort[d]={w,date:todayISO()};save();render();}
function setEstFTP(w){if(!w)return;Z.ftp.push({w,date:todayISO()});save();render();}
function addFTP(){const w=+document.getElementById("ftpw").value;if(!w)return;Z.ftp.push({w,date:todayISO()});save();render();}

/* ---- Log ---- */
function rLog(){
  const el=document.getElementById("v_log");
  const ks=Object.keys(Z.readiness).sort().slice(-14);
  let spark="";
  if(ks.length>1){
    const vs=ks.map(k=>Z.readiness[k]);
    const pts=vs.map((v,i)=>`${(i/(vs.length-1)*300).toFixed(1)},${(42-(v-1)/4*38).toFixed(1)}`).join(" ");
    spark=`<svg class="spark" viewBox="0 0 300 44"><polyline points="${pts}" fill="none" stroke="#E0A458" stroke-width="2"/></svg>`;
  }
  /* this week's compliance vs tiers */
  const s=new Date(Z.start+"T00:00:00");s.setDate(s.getDate()+curWeek()*7);
  let t1=0,t1max=0,t2=0,t2max=0;
  for(let i=0;i<7;i++){
    const d=new Date(s);d.setDate(d.getDate()+i);const k=iso(d);const dn=Z.done[k]||{};
    if([0,2,3,4].includes(i)){t1max++;if(dn.str)t1++;}
    if(i===4){t1max++;if(dn.kick)t1++;}
    if(i===6){t1max++;if(dn.bjj)t1++;}
    if([0,1,2,3].includes(i)){t2max++;if(dn.markow)t2++;}
    if(i===1||i===5){t2max++;if(dn.cond_tue||dn.cond_sat)t2++;}
    if([0,2,3,4].includes(i)){t2max++;if(dn.core)t2++;}
    if(i===6){t2max++;if(dn.kotg)t2++;}
  }
  el.innerHTML=`
  <div class="card"><h3>Program</h3>
  <label class="f">Week 1 start date (Monday)</label>
  <input type="date" value="${Z.start}" onchange="Z.start=this.value;save();render()">
  <div class="mini" style="margin-top:6px">Currently Week ${curWeek()+1} of 12. Restart preserves training history — periodization resets, adaptation doesn't.</div></div>
  <div class="card"><h3>Readiness — last 14 logged days</h3>${spark||'<div class="mini">Log readiness on the Today tab.</div>'}
  ${ks.slice().reverse().map(k=>`<div class="row"><div class="nm">${k}</div><div class="rx">${Z.readiness[k]} / 5</div></div>`).join("")}</div>
  <div class="card"><h3>This week's compliance</h3>
  <div class="grid2">
  <div class="stat"><div class="v">${t1}/${t1max}</div><div class="l">T1 — never cut</div></div>
  <div class="stat"><div class="v">${t2}/${t2max}</div><div class="l">T2 — protect</div></div></div>
  <div class="mini" style="margin-top:8px">End-of-week rule of thumb: advance at ≥3/4 strength + both anchors + ≥1 Z2 + avg readiness ≥3. Details on the Week tab.</div></div>
  <div class="card"><h3>Data</h3>
  <div class="mini">State lives in localStorage under <code>hybrid_v6_state</code> — logged data survives Netlify redeployments as long as the app URL stays the same.</div>
  <div style="margin-top:8px"><button class="btn sm sec" onclick="navigator.clipboard&&navigator.clipboard.writeText(JSON.stringify(S)).then(()=>alert('Copied state JSON'))">Copy backup JSON</button></div></div>`;
}

buildTabs();render();
</script>
</body>
</html>
